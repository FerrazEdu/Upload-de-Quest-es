      const canvas = await renderizar(p.page);
      negritoPorPalavra(canvas, p.uma.linhas, p.duas.linhas);
      const todas = await imagensDaPagina(p.page, p.vp);
      const imagens = todas.filter(r => r.x1 - r.x0 >= FIGURA_MIN && r.y1 - r.y0 >= FIGURA_MIN && r.y0 > MARGEM_TOPO);
      const pequenas = todas.filter(r => !(r.x1 - r.x0 >= FIGURA_MIN && r.y1 - r.y0 >= FIGURA_MIN) && r.y0 > MARGEM_TOPO);
      // modelo da página pela barra; sem barra, pelo texto que atravessa o meio; página só de
      // continuação segue o modelo da anterior
      // Voto de cada barra: começa na metade esquerda e passa do meio = questão na largura toda; começa na
      // metade direita (barra da 2ª coluna, que sempre "passa do meio") ou acaba antes do meio = duas colunas.
      const meio = p.vp.width / 2;
      const votos = p.uma.cabecalhos.map(c => { const fim = fimDaBarra(canvas, c); return fim === null ? null : c.x0 < meio - 30 && fim > meio + 30 ? 'uma' : 'duas'; })
        .filter(Boolean);
      // duas barras "Questão NN" na mesma altura, uma em cada coluna: a página é de duas colunas
      const lado = p.duas.cabecalhos.some(a => a.col === 0 && p.duas.cabecalhos.some(b => b.col === 1 && Math.abs(a.base - b.base) < 4))
        || p.duas.cabecalhos.some(b => b.col === 1);   // barra que começa na coluna da direita
      let umaColuna = lado ? false : votos.length ? votos.filter(v => v === 'uma').length * 2 > votos.length
        : temCab ? p.cruzam >= 3 : umaColunaAnterior;
      // trava: "uma coluna" com várias linhas que têm um vão bem no meio da página (texto das duas colunas
      // lado a lado) é página de duas colunas — senão as duas questões se misturam linha a linha
      if (umaColuna) {
        const vaoNoMeio = p.uma.linhas.filter(l => l.y0 > MARGEM_TOPO && (l.trechos || []).some((t, i, ts) => i + 1 < ts.length
          && t.x1 < meio - 4 && ts[i + 1].x0 > meio + 4 && ts[i + 1].x0 - t.x1 >= 8)).length;
        if (vaoNoMeio >= 3) umaColuna = false;
      }
      umaColunaAnterior = umaColuna;
      const m = umaColuna ? p.uma : p.duas;
      Object.assign(p, {linhas: m.linhas, cabecalhos: m.cabecalhos, umaColuna});
      const partes = partesDaPagina(p, m, imagens);
      for (const parte of partes) {
        if (parte.tipo === 'nova') {
          aberta = {numero: parte.numero, pagina: p.pn, coluna: parte.col + 1, regiao: parte.regiao, partes: [], foraDoRecorte: []};
          questoes.push(aberta);
        } else if (!aberta) continue;   // texto antes da 1ª questão da lista (capa, instruções)
        const d = await dadosDaParte(p, m, parte, canvas, imagens, parte.tipo === 'nova', pequenas);
        aberta.partes.push({pagina: p.pn, col: parte.col, regiao: parte.regiao, ...d});
        parte.dono = aberta;
      }
      // Trava: nenhum texto ou imagem da página pode ficar fora de todas as partes.
      const dentroDe = r => partes.find(pt => r.x0 >= pt.regiao.x0 - 6 && r.x1 <= pt.regiao.x1 + Math.max(8, 0.08 * (pt.regiao.x1 - pt.regiao.x0)) && (r.y0 + r.y1) / 2 >= pt.regiao.y0 && (r.y0 + r.y1) / 2 <= pt.regiao.y1 + 2);
      const dono = r => (partes.filter(pt => pt.dono && (r.y0 + r.y1) / 2 >= pt.regiao.y0 - 2).sort((a, b) => b.regiao.y0 - a.regiao.y0)[0] || partes.find(pt => pt.dono))?.dono;
      for (const l of m.linhas) {
        // a barra "Questão NN" é da própria questão (às vezes passa uns pontos do meio da página)
        if (l.texto.trim().length < 2 || ETAPAS.includes(l.texto.trim()) || RE_QUESTAO.test(l.texto) || l.y0 < MARGEM_TOPO || l.y0 >= p.fundo - 2 || dentroDe(l)) continue;
        dono(l)?.foraDoRecorte.push(l.texto.trim().slice(0, 80));
      }
      for (const f of imagens) if (!dentroDe(f) && f.y0 >= MARGEM_TOPO && f.y0 < p.fundo) dono(f)?.foraDoRecorte.push('[imagem]');
      liberar(canvas); p.page.cleanup();
      await folga();   // devolve a vez à tela entre uma página e outra
    }
    // Junta as partes de cada questão: texto em ordem, figuras numeradas, imagem empilhada.
    for (const q of questoes) {
      const nn = String(q.numero).padStart(2, '0');
      let base = 0;
      q.figuras = q.partes.flatMap(pt => { const fs = pt.figuras.map(f => ({...f, linha: base + f.linha})); base += pt.texto.length; return fs; })
        .map((f, k) => ({nome: `Q${nn}_fig${k + 1}`, ...f}));
      // fórmulas: #k de cada parte → nome da questão (Q35_f1, Q35_f2…), na ordem do texto
      q.formulas = [];
      q.textoPdf = q.partes.map(pt => pt.texto.join('\n').replace(/⟦FÓRMULA #(\d+)⟧/g, (m0, k) => {
        const nome = `Q${nn}_f${q.formulas.length + 1}`;
        q.formulas.push({nome, ...pt.formulas[+k]});
        return `⟦FÓRMULA ${nome}⟧`;
      })).join('\n');
      // Cada figura marcada no texto, no ponto exato em que aparece no PDF (⟦FIGURA NOME⟧ numa linha
      // própria): a transcrição tem de pôr a figura ali, não onde o texto "sugere" ("figura ao lado").
      const linhasQ = q.textoPdf.split('\n');
      [...q.figuras].sort((a, b) => b.linha - a.linha || q.figuras.indexOf(b) - q.figuras.indexOf(a))
        .forEach(f => linhasQ.splice(Math.min(Math.max(1, f.linha), linhasQ.length), 0, `⟦FIGURA ${f.nome}⟧`));
      q.textoPdf = linhasQ.join('\n');
      q.figuras.forEach(f => { f.linha = linhasQ.indexOf(`⟦FIGURA ${f.nome}⟧`); });
      q.regioes = q.partes.map(pt => ({pagina: pt.pagina, ...pt.regiao}));
      q.imagem = await juntarRecortes(q.partes.map(pt => pt.recorte));
      delete q.partes;
    }

    const inicio = etapasPeloSumario(paginas);
    for (const q of questoes) {
      const antes = Object.entries(inicio).filter(([, pg]) => pg <= q.pagina).map(([e]) => e);
      q.etapa = antes.length ? antes[antes.length - 1] : null;
    }
    questoes.sort((a, b) => a.numero - b.numero);
    const numeros = questoes.map(q => q.numero);
    const maior = Math.max(0, ...numeros);
    const faltando = [...Array(maior).keys()].map(i => i + 1).filter(n => !numeros.includes(n));
    const repetidos = [...new Set(numeros.filter((n, i) => numeros.indexOf(n) !== i))];

    const ultima = Math.max(0, ...questoes.map(q => q.pagina));
    // Tabela de gabarito: nas páginas sem questão depois da última questão (pode ocupar mais de
    // uma); em último caso, no fim da página da última questão.
    const candidatas = semQuestao.filter(p => p.pn > ultima);
    const pUltima = paginas.find(p => p.pn === ultima);
    if (pUltima) candidatas.push(pUltima);
    let paginaGabarito = null, gabaritoPdf = {}, gabaritoMotivo = 'nenhuma página de gabarito depois das questões';
    const motivos = [], gabaritoRecortes = {};
    let porImagem = false;   // gabarito lido do desenho da tabela (não do texto): recortes guardados para conferência
    for (const pg of candidatas) {
      const menor = Math.min(...numeros), proximo = menor + Object.keys(gabaritoPdf).length;   // a lista pode não começar na 1
      let {pares, caixas} = gabaritoEmTexto(pg.linhas);
      const c = await renderizar(pg.page);
      if (!Object.keys(pares).length) {
        porImagem = true;
        const r = gabaritoNaImagem(c, proximo);
        ({pares, caixas = {}} = r);
        if (r.motivo) motivos.push(`página ${pg.pn}: ${r.motivo}`);
      }
      // recorte da linha da tabela de cada questão (número + letra), para conferência
      for (const [n, cx] of Object.entries(caixas)) {
        const h = cx.y1 - cx.y0, mx = Math.max(12, h * 1.2);
        gabaritoRecortes[n] = await recortar(c, {x0: cx.x0 - mx, y0: cx.y0 - h * 0.6, x1: cx.x1 + mx, y1: cx.y1 + h * 0.6});
      }
      if (Object.keys(pares).length || !paginaGabarito)
        paginaGabarito = paginaGabarito && !Object.keys(pares).length ? paginaGabarito
          : await recortar(c, {x0: 0, y0: 0, x1: pg.vp.width, y1: pg.vp.height}, {maxPx: MAX_PX_QUESTAO, tipo: 'image/jpeg'});
      Object.assign(gabaritoPdf, pares);
      liberar(c); pg.page.cleanup();
      if (numeros.every(n => gabaritoPdf[String(n).padStart(2, '0')])) break;
    }
    const lidas = Object.keys(gabaritoPdf).length;
    const completo = numeros.length > 0 && numeros.every(n => gabaritoPdf[String(n).padStart(2, '0')]);
    if (completo) gabaritoMotivo = null;
    else {
      gabaritoMotivo = lidas ? `a tabela tem ${lidas} respostas, a lista tem ${numeros.length} questões` : (motivos.join('; ') || gabaritoMotivo);
      gabaritoPdf = {};
      for (const n of Object.keys(gabaritoRecortes)) delete gabaritoRecortes[n];
    }
    const nome = arquivo.name || 'lista.pdf';
    // fecha o documento no pdf.js (senão cada lista fica na memória do Worker)
    try { await tarefa.destroy(); } catch {}
    return {
      arquivo: nome, hash: hashPdf, titulo: tituloLista || nome.replace(/\.pdf$/i, '').replace(/_/g, ' '),
      tipo: /simulado/i.test(nome + ' ' + tituloLista) ? 'simulado' : 'lista',
      etapas: inicio, questoes, faltando, repetidos, paginaGabarito, gabaritoPdf, gabaritoMotivo, gabaritoRecortes, gabaritoPorImagem: porImagem, paginas: doc.numPages,
    };
  }

  return {segmentar, gabaritoNaImagem, gabaritoEmTexto, linhasDaPagina, gradeDaTabela, ETAPAS, ESCALA,
};
})();

/* Leitura de fórmula em imagem → LaTeX no navegador (pix2tex / LaTeX-OCR, versão ONNX do RapidLaTeXOCR).
 * Usada quando o Claude desta visualização não recebe imagens: as fórmulas que o PDF traz como imagem
 * (sem texto) seriam perdidas. Arquivos publicados com a página, em formula/ (scripts/preparar_formulas.sh):
 *   ort.bundle.js        onnxruntime-web (só wasm, sem threads)
 *   ort.wasm.txt…        runtime wasm, em base64 e em pedaços (o artefato só serve tipos web comuns)
 *   resizer / encoder / decoder .txt…   modelos (pesos em float16 + Cast; decoder em int8), base64
 *   tokenizer.json       vocabulário
 *
 *   const leitor = await UPQFormulas.carregar(urlBase)
 *   const {latex, votos, de} = await leitor.ler(blob)
 *
 * Roda num Worker (a conta não trava a página; a memória do modelo fica fora dela). Se o navegador
 * não deixar criar o Worker, roda na página, cedendo a vez à tela entre os passos.
 */
function fabricaFormulas() {
  const MAX_W = 672, MAX_H = 192, MIN_W = 32, MIN_H = 32, BOS = 1, EOS = 2, MAX_TOKENS = 100, ORCAMENTO_MS = 12000;
  const MEDIA = 0.7931 * 255, DESVIO = 0.1738 * 255;
  let carregando = null;

  async function baixarBase64(url, partes) {
    const pedacos = [];
    for (let k = 1; k <= partes; k++) {
      const r = await fetch(`${url}.${k}.txt`);
      if (!r.ok) throw new Error(`não carregou ${url}.${k}.txt (${r.status})`);
      pedacos.push(await r.text());
    }
    const bin = atob(pedacos.join('').replace(/\s+/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function carregar(base, progresso = () => {}) {
    if (carregando) return carregando;
    carregando = (async () => {
      const man = await (await fetch(base + 'manifesto.json')).json();
      progresso('runtime');
      // módulo ES do onnxruntime; se a página não aceitar import() do arquivo, tenta por blob
      let ort;
      try { ort = await import(base + 'ort.bundle.js'); }
      catch (e) {
        const codigo = await (await fetch(base + 'ort.bundle.js')).text();
        ort = await import(URL.createObjectURL(new Blob([codigo], {type: 'text/javascript'})));
      }
      ort.env.wasm.numThreads = 1;
      ort.env.wasm.proxy = false;
      ort.env.wasm.wasmBinary = (await baixarBase64(base + 'ort.wasm', man['ort.wasm'])).buffer;
      const sessao = async nome => {
        progresso(nome);
        const bytes = await baixarBase64(base + nome, man[nome]);
        return ort.InferenceSession.create(bytes, {executionProviders: ['wasm'], graphOptimizationLevel: 'all'});
      };
      const resizer = await sessao('resizer'), encoder = await sessao('encoder'), decoder = await sessao('decoder');
      const tok = await (await fetch(base + 'tokenizer.json')).json();
      const vocab = [];
      for (const [t, id] of Object.entries(tok.model.vocab)) vocab[id] = t;
      for (const t of tok.added_tokens || []) vocab[t.id] = t.content;
      return {ler: img => ler({ort, resizer, encoder, decoder, vocab}, img)};
    })();
    carregando.catch(() => { carregando = null; });
    return carregando;
  }

  // ---- pré-processamento (igual ao do pix2tex: cinza, recorte da tinta, múltiplos de 32, escala)
  const novaTela = (w, h) => {
    w = Math.max(1, w); h = Math.max(1, h);
    if (typeof document === 'undefined') return new OffscreenCanvas(w, h);
    const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
  };
  const folga = () => typeof document === 'undefined' ? null : new Promise(r => setTimeout(r, 0));
  function cinzaDe(c) {
    const d = c.getContext('2d', {willReadFrequently: true}).getImageData(0, 0, c.width, c.height).data, g = new Float32Array(c.width * c.height);
    for (let i = 0, k = 0; k < g.length; i += 4, k++) g[k] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;   // PIL "L"
    return g;
  }
  function deCinza(g, w, h) {
    const c = novaTela(w, h), ctx = c.getContext('2d'), im = ctx.createImageData(w, h);
    for (let k = 0; k < g.length; k++) { const v = Math.max(0, Math.min(255, Math.floor(g[k]))); im.data[4 * k] = im.data[4 * k + 1] = im.data[4 * k + 2] = v; im.data[4 * k + 3] = 255; }
    ctx.putImageData(im, 0, 0);
    return c;
  }
  // tinta escura sobre fundo claro, recortada à caixa da tinta e completada com branco até múltiplos de 32
  function pad(c) {
    const W = c.width, H = c.height;
    let g = cinzaDe(c), mn = 255, mx = 0;
    for (const v of g) { if (v < mn) mn = v; if (v > mx) mx = v; }
    const amp = mx - mn || 1;
    let soma = 0;
    for (let k = 0; k < g.length; k++) { g[k] = (g[k] - mn) / amp * 255; soma += g[k]; }
    const claro = soma / g.length > 128;
    if (!claro) for (let k = 0; k < g.length; k++) g[k] = 255 - g[k];
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (g[y * W + x] < 128) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) { x0 = 0; y0 = 0; x1 = W - 1; y1 = H - 1; }
    const w = x1 - x0 + 1, h = y1 - y0 + 1, PW = Math.ceil(w / 32) * 32, PH = Math.ceil(h / 32) * 32;
    const out = new Float32Array(PW * PH).fill(255);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) out[y * PW + x] = Math.floor(g[(y0 + y) * W + x0 + x]);
    return deCinza(out, PW, PH);
  }
  function redimensionar(c, w, h) {
    const o = novaTela(w, h), ctx = o.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(c, 0, 0, c.width, c.height, 0, 0, w, h);
    return o;
  }
  function minmax(c) {
    const r = Math.max(c.width / MAX_W, c.height / MAX_H);
    if (r > 1) c = redimensionar(c, Math.max(1, Math.floor(c.width / r)), Math.max(1, Math.floor(c.height / r)));
    if (c.width < MIN_W || c.height < MIN_H) {
      const o = novaTela(Math.max(c.width, MIN_W), Math.max(c.height, MIN_H)), ctx = o.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, o.width, o.height); ctx.drawImage(c, 0, 0); c = o;
    }
    return c;
  }
  function tensor(ort, c) {
    const g = cinzaDe(c), t = new Float32Array(g.length);
    for (let k = 0; k < g.length; k++) t[k] = (Math.round(g[k]) - MEDIA) / DESVIO;
    return new ort.Tensor('float32', t, [1, 1, c.height, c.width]);
  }
  const argmax = (a, ini = 0, fim = a.length) => { let k = ini; for (let i = ini; i < fim; i++) if (a[i] > a[k]) k = i; return k - ini; };

  async function paraCanvas(img) {
    if (typeof HTMLCanvasElement !== 'undefined' && img instanceof HTMLCanvasElement) return img;
    const bmp = await createImageBitmap(img);
    const c = novaTela(bmp.width, bmp.height), ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0);
    return c;
  }

  // Lê em três escalas e fica com a leitura em que a maioria concorda (fórmula pequena às vezes troca
  // um símbolo numa escala só); sem maioria, lê em mais duas. Desempate: leitura sem símbolo raro
  // (\aleph no lugar de 8…), depois a de maior confiança. `votos`/`de` dizem quanto concordaram.
  const ESCALAS = [1, 0.75, 1.5], EXTRAS = [0.6, 1.25];
  const RARO = /\\(aleph|beth|gimel|daleth|mho|wp|Re|Im|mathbf|mathfrak|propto|natural|flat|sharp|clubsuit|spadesuit|heartsuit|diamondsuit|bigstar|maltese|S|P)\b/;
  const chave = t => t.replace(/\\[,;:! ]|\s|[{}]/g, '').replace(/\\left|\\right/g, '');
  async function ler(m, img) {
    const inicio = Date.now(), base = await paraCanvas(img), leituras = [];
    const em = e => e === 1 ? base : redimensionar(base, Math.max(8, Math.round(base.width * e)), Math.max(8, Math.round(base.height * e)));
    const votar = () => {
      const grupos = new Map();
      for (const l of leituras.filter(l => l.completa)) { const k = chave(l.latex); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(l); }
      return [...grupos.values()].sort((a, b) => b.length - a.length || RARO.test(a[0].latex) - RARO.test(b[0].latex)
        || Math.max(...b.map(x => x.media)) - Math.max(...a.map(x => x.media)))[0] || [];
    };
    const resultado = melhor => {
      const escolhida = [...melhor].sort((a, b) => b.media - a.media)[0];
      return escolhida ? {...escolhida, votos: melhor.length, de: leituras.length, ms: Date.now() - inicio}
        : {latex: '', invalida: true, votos: 0, de: leituras.length, ms: Date.now() - inicio};
    };
    // 1ª leitura sem fim (não chegou ao fim da fórmula): é desenho, não fórmula — para aqui
    leituras.push(await lerUma(m, em(1), inicio));
    if (!leituras[0].completa) return resultado([]);
    // duas escalas que concordam bastam; senão, a terceira desempata; sem maioria, mais duas (se der tempo)
    leituras.push(await lerUma(m, em(0.75), inicio));
    let melhor = votar();
    if (melhor.length >= 2) return resultado(melhor);
    leituras.push(await lerUma(m, em(1.5), inicio));
    melhor = votar();
    for (const e of EXTRAS) { if (melhor.length >= 2 || Date.now() - inicio > ORCAMENTO_MS) break; leituras.push(await lerUma(m, em(e), inicio)); melhor = votar(); }
    return resultado(melhor);
  }

  async function lerUma(m, img, inicio = Date.now()) {
    const {ort} = m;
    const entrada = minmax(pad(img));
    // o "resizer" escolhe a largura em que a fórmula fica na escala do treino
    let r = 1, w = entrada.width, h = entrada.height, final = null;
    for (let i = 0; i < 10; i++) {
      h = Math.floor(h * r);
      const p = pad(minmax(redimensionar(entrada, w, h)));
      final = tensor(ort, p);
      const out = (await m.resizer.run({[m.resizer.inputNames[0]]: final}))[m.resizer.outputNames[0]];
      w = (argmax(out.data) + 1) * 32;
      if (w === p.width) break;
      r = w / p.width;
    }
    const contexto = (await m.encoder.run({[m.encoder.inputNames[0]]: final}))[m.encoder.outputNames[0]];
    const ids = [BOS];
    let minimo = 1, somaLog = 0, completa = false;
    for (let passo = 0; passo < MAX_TOKENS; passo++) {
      if (passo % 8 === 7) await folga();
      if (Date.now() - inicio > ORCAMENTO_MS) break;   // orçamento da fórmula estourado
      const x = new ort.Tensor('int64', BigInt64Array.from(ids.map(BigInt)), [1, ids.length]);
      const mascara = new ort.Tensor('bool', new Uint8Array(ids.length).fill(1), [1, ids.length]);
      const saida = (await m.decoder.run({x, mask: mascara, context: contexto}))[m.decoder.outputNames[0]];
      const V = saida.dims[2], base = (ids.length - 1) * V, d = saida.data;
      const k = argmax(d, base, base + V);
      let mx = -Infinity, soma = 0;
      for (let i = base; i < base + V; i++) if (d[i] > mx) mx = d[i];
      for (let i = base; i < base + V; i++) soma += Math.exp(d[i] - mx);
      const p = 1 / soma;   // probabilidade do token escolhido
      minimo = Math.min(minimo, p); somaLog += Math.log(p);
      ids.push(k);
      if (k === EOS) { completa = true; break; }
    }
    const tokens = ids.slice(1).filter(i => i > 2).map(i => m.vocab[i] ?? '');
    const latex = enxugar(posProcessar(tokens.join('').replace(/Ġ/g, ' ').trim())).replace(/(\\[,;:!]|\\ )+$/, '').trim();
    return {latex, completa, confianca: minimo, media: Math.exp(somaLog / Math.max(1, ids.length - 1))};
  }

  // mesmo pós-processamento do pix2tex: tira espaços que não separam comandos
  function posProcessar(s) {
    const reTexto = /(\\(operatorname|mathrm|text|mathbf)\s?\*? {.*?})/g;
    s = s.replace(reTexto, m0 => m0.replace(/ /g, ''));
    const letra = '[a-zA-Z]', naoLetra = '[\\W_^\\d]';
    for (;;) {
      let n = s.replace(new RegExp(`(?!\\\\ )(${naoLetra})\\s+?(${naoLetra})`, 'g'), '$1$2');
      n = n.replace(new RegExp(`(?!\\\\ )(${naoLetra})\\s+?(${letra})`, 'g'), '$1$2');
      n = n.replace(new RegExp(`(${letra})\\s+?(${naoLetra})`, 'g'), '$1$2');
      if (n === s) break;
      s = n;
    }
    return s;
  }

  // Chaves redundantes em volta de um comando inteiro ("k{\\frac{q}{a}}" → "k\\frac{q}{a}"); ficam as que
  // são argumento (depois de comando que recebe argumento, de "}", "^" ou "_").
  function enxugar(s) {
    for (let i = 0; i < s.length; i++) {
      if (s[i] !== '{' || s[i + 1] !== '\\') continue;
      const antes = s.slice(0, i);
      if (/[\^_}]$|\\(frac|dfrac|tfrac|sqrt|text|mathrm|mathbf|mathit|mathcal|boldsymbol|vec|hat|bar|dot|ddot|tilde|overline|underline|overrightarrow|operatorname|binom)\s*$/.test(antes)) continue;
      let prof = 0, j = i;
      for (; j < s.length; j++) { if (s[j] === '{') prof++; else if (s[j] === '}' && --prof === 0) break; }
      if (j >= s.length) break;
      const dentro = s.slice(i + 1, j), cmd = dentro.match(/^\\[a-zA-Z]+/);
      if (!cmd) continue;
      // o miolo tem de ser só o comando com seus argumentos {…}{…}
      let k = cmd[0].length, ok = true;
      while (k < dentro.length) {
        if (dentro[k] !== '{') { ok = false; break; }
        let pr = 0, t = k;
        for (; t < dentro.length; t++) { if (dentro[t] === '{') pr++; else if (dentro[t] === '}' && --pr === 0) break; }
        k = t + 1;
      }
      if (ok) { s = antes + dentro + s.slice(j + 1); i--; }
    }
    return s;
  }

  return {carregar, posProcessar, enxugar};
}

const UPQFormulas = (() => {
  const local = fabricaFormulas();
  let carregando = null;
  // Worker com uma cópia deste mesmo código (fabricaFormulas), falando por mensagens.
  function noWorker(base) {
    const fonte = `${fabricaFormulas.toString()}
const F = fabricaFormulas(); let leitor = null;
self.onmessage = async e => {
  const {id, tipo, base, blob} = e.data;
  try {
    if (tipo === 'carregar') { leitor = await F.carregar(base); self.postMessage({id, ok: true}); }
    else self.postMessage({id, ok: true, r: await leitor.ler(blob)});
  } catch (err) { self.postMessage({id, ok: false, erro: String(err && err.message || err)}); }
};`;
    const w = new Worker(URL.createObjectURL(new Blob([fonte], {type: 'text/javascript'})));
    let seq = 0;
    const pendentes = new Map();
    w.onmessage = e => { const p = pendentes.get(e.data.id); if (!p) return; pendentes.delete(e.data.id); e.data.ok ? p.ok(e.data.r) : p.falha(new Error(e.data.erro)); };
    w.onerror = e => { for (const p of pendentes.values()) p.falha(new Error(e.message || 'o Worker do leitor de fórmulas parou')); pendentes.clear(); morto = true; };
    const pedir = (msg, limiteMs) => new Promise((ok, falha) => {
      const id = ++seq;
      const t = setTimeout(() => { if (!pendentes.has(id)) return; pendentes.delete(id); morto = true; w.terminate();
        falha(Object.assign(new Error('leitor de fórmulas não respondeu a tempo'), {code: 'timeout'})); }, limiteMs);
      pendentes.set(id, {ok: r => { clearTimeout(t); ok(r); }, falha: e => { clearTimeout(t); falha(e); }});
      w.postMessage({...msg, id});
    });
    let morto = false, substituto = null;   // Worker que travou/morreu é trocado UMA vez por um novo
    return pedir({tipo: 'carregar', base}, 180000).then(() => ({
      ler: blob => morto ? (substituto ||= noWorker(base)).then(l => l.ler(blob)) : pedir({tipo: 'ler', blob}, 40000), modo: 'worker'}),
      e => { w.terminate(); throw e; });
  }
  // Vários Workers em paralelo (um por núcleo livre, até 3): uma lista de 1000 questões tem centenas de
  // fórmulas. O 1º carrega antes; os outros entram assim que ficam prontos. Cada pedido vai para o
  // Worker com menos pedidos na fila.
  const NUCLEOS = Math.max(1, Math.min(3, ((typeof navigator !== 'undefined' && navigator.hardwareConcurrency) || 2) - 1));
  function carregar(base) {
    if (carregando) return carregando;
    carregando = (async () => {
      try {
        if (typeof Worker !== 'undefined' && typeof OffscreenCanvas !== 'undefined') {
          const pool = [{l: await noWorker(base), fila: 0}];
          for (let k = 1; k < NUCLEOS; k++) noWorker(base).then(l => pool.push({l, fila: 0})).catch(() => {});
          return {
            modo: `worker × ${NUCLEOS}`, paralelos: () => pool.length,
            ler: async blob => {
              const w = pool.reduce((a, b) => (b.fila < a.fila ? b : a));
              w.fila++;
              try { return await w.l.ler(blob); } finally { w.fila--; }
            },
          };
        }
      } catch (e) { console.warn('leitor de fórmulas sem Worker:', e); }
      const l = await local.carregar(base);
      return {ler: l.ler, modo: 'página', paralelos: () => 1};
    })();
    carregando.catch(() => { carregando = null; });
    return carregando;
  }
  return {carregar, posProcessar: local.posProcessar, enxugar: local.enxugar};
})();

<script>
const DADOS = {"sistema": "Você transcreve questões de listas de exercícios em PDF para o banco de questões\nde uma plataforma de ensino pré-vestibular. Cada mensagem traz VÁRIAS questões: uma imagem\nrecortada do PDF por questão (as figuras aparecem dentro dela), os NOMES das figuras de cada\nquestão, o texto extraído do PDF e o gabarito oficial. Devolva só o JSON pedido, com uma\nentrada por questão, na ordem das imagens.\n\nFONTE DA VERDADE\n- A IMAGEM é a fonte da verdade. O \"texto extraído do PDF\" ajuda com a ordem das palavras\n  e nomes próprios, mas tem erros conhecidos: símbolos trocados (π aparece como \"À\",\n  ≈ como \"H\"), expoentes e índices achatados (\"10 8\" ou \"108\" = 10⁸, \"N1\" = N₁), palavras\n  partidas e trechos repetidos. Sempre confira com a imagem.\n- Transcrição literal: não resuma, não parafraseie, não corrija nem atualize o conteúdo.\n  Preserve palavras, acentos, pontuação, números e unidades. O texto-base inteiro entra no\n  enunciado (contexto, textos de apoio, afirmativas, referências e o comando).\n- Reconstrua a questão inteira: nenhum trecho de uma alternativa pode vazar para outra.\n  Questão de A a D tem 4 alternativas — nunca invente a E.\n\nFORMATAÇÃO DO TEXTO (enunciado e alternativas)\nO texto é exibido para alunos numa plataforma que renderiza Markdown + LaTeX (MathJax).\n\n1. Fórmulas, números com unidade, potências, índices, símbolos e variáveis vão em LaTeX:\n   - no meio da frase: $...$ · destacada/centralizada no PDF: $$...$$ em parágrafo próprio.\n   - vírgula decimal: $3{,}5$ (as chaves evitam espaço depois da vírgula).\n   - milhar com ponto: $3.600$ · notação científica: $4{,}0 \\times 10^{8}\\ \\text{m}$.\n   - unidades em \\text{}: $35\\ \\text{m/s}$, $9{,}8\\ \\text{m/s}^2$, $60\\ \\text{cm}$, $3000\\ \\text{rpm}$.\n   - aproximação e constantes: $\\pi \\approx 3$, $g = 10\\ \\text{m/s}^2$.\n   - vetores: $\\vec{F}$, $m\\vec{g}$ · índices: $N_1$, $x_2$, $v_{\\text{máx}}$ · graus: $45^\\circ$.\n   - frações: $\\frac{a}{b}$ · raízes: $\\sqrt{2}$ · trigonometria: $\\sin 45^\\circ$, $\\cos\\theta$.\n   - química: $\\mathrm{H_2O}$, $\\mathrm{Ca^{2+}}$, setas \\rightarrow e \\rightleftharpoons.\n   - comandos permitidos: os do MathJax padrão. Nada de \\ce, \\SI, \\usepackage ou pacotes.\n   - Valores numéricos isolados em alternativas também vão em LaTeX: $110$, $\\frac{\\pi}{2}$.\n   - Ano, data, número de questão e quantidades contadas no texto corrido ficam como texto\n     (\"em 2023\", \"Questão 05\", \"quatro posições (1, 2, 3 e 4)\").\n2. Cifrão de dinheiro sempre escapado: R\\$ 25,00. Todo $ sem barra abre ou fecha fórmula.\n3. NEGRITO É OBRIGATÓRIO: todo trecho em negrito no PDF vai em **negrito** (títulos, cabeçalhos\n   de tabela, \"TEXTO I\", palavras destacadas como **CORRETA**, **INCORRETA**, **EXCETO**).\n   *Itálico* como no PDF (títulos de obras, termos estrangeiros). No texto extraído, os\n   trechos em fonte negrito já vêm entre ** — todos eles têm de sair em negrito.\n4. Parágrafos separados por uma linha em branco. Afirmativas I, II, III cada uma em seu\n   parágrafo, começando por \"I. \", \"II. \". Listas de dados (π = 3; g = 10 m/s²) uma por linha.\n   FÓRMULA EM IMAGEM: no PDF, muitas fórmulas (frações, raízes, alternativas inteiras) são\n   imagem e não têm texto. No texto extraído elas aparecem no ponto exato como\n   ⟦FÓRMULA NOME = $LaTeX$⟧ (lida da imagem) ou ⟦FÓRMULA NOME⟧ (sem leitura: leia na imagem).\n   Transcreva cada uma em LaTeX nesse ponto (não copie a marca); a alternativa cujo texto é só\n   a marca tem como texto a fórmula. NUNCA escreva no lugar da fórmula um aviso como\n   \"(expressão não legível)\": se não houver como ler, deixe a alternativa vazia e marque\n   revisar = true.\n5. Tabelas em Markdown (| col | col | + linha de separação), com unidades no cabeçalho.\n6. Figuras: no ponto exato onde a figura aparece, escreva ![descrição curta](figura:NOME)\n   usando SOMENTE os NOMES de figura informados na mensagem. ORDEM IGUAL À DO PDF: quando o texto\n   extraído traz ⟦FIGURA NOME⟧ numa linha, a figura vai EXATAMENTE nesse ponto — entre o parágrafo\n   que vem antes e o que vem depois da marca —, mesmo que o texto diga \"figura ao lado\", \"abaixo\" ou\n   \"a seguir\". Nunca mova parágrafos para antes ou depois de uma figura (não copie a marca). A descrição é texto alternativo\n   (o que a figura mostra, em até 15 palavras). Créditos da figura (\"Fonte: UNICAMP, 2023.\")\n   são transcritos logo abaixo dela, como referência (regra 8) — exceto quando já aparecem\n   DENTRO da imagem recortada da figura (confira na imagem da questão): aí não repita. Não\n   descreva a figura no enunciado nem invente dados que só ela mostra.\n   ALTERNATIVAS EM IMAGEM: quando as alternativas são figuras (gráficos, esquemas, fórmulas\n   estruturais), o texto de cada alternativa é a sua figura: ![Alternativa A: descrição\n   curta](figura:NOME), com texto antes ou depois se houver. As figuras estão nomeadas na ordem\n   de leitura (de cima para baixo; lado a lado, da esquerda para a direita), então as últimas\n   figuras da questão costumam ser as alternativas, na ordem A, B, C... Se uma única figura\n   reúne todas as alternativas, coloque-a no fim do enunciado, transcreva em cada alternativa o\n   que estiver legível dela e marque revisar = true.\n7. Não transcreva: número da questão, cabeçalho com banca/ano, letras das alternativas,\n   cabeçalho/rodapé da página, marcas d'água.\n8. Referências (créditos de figura e fontes de texto: \"Fonte: ...\", \"Disponível em: ...\n   Acesso em: ...\", \"Adaptado de ...\") ficam num parágrafo próprio, no ponto onde aparecem,\n   com o texto literal (parênteses inclusive, URL como texto simples), neste formato exato:\n   <p style=\"text-align: right;\"><sub>Fonte: UNICAMP, 2014.<\/sub><\/p>\n9. ALINHAMENTO COMO NO PDF: tudo o que está centralizado no PDF (títulos, tabelas, figuras,\n   fórmulas e dados destacados, \"TEXTO I\") fica centralizado. Envolva cada trecho centralizado\n   num bloco próprio, com as marcas sozinhas na linha:\n   ::: centro\n   **Título centralizado**\n   :::\n   Dentro do bloco vale o Markdown normal (tabela, ![...](figura:NOME), $LaTeX$, **negrito**).\n   No texto extraído, as linhas centralizadas vêm com \"[centralizado]\" (não copie a marca).\n   Texto justificado ou à esquerda fica fora do bloco. Referências seguem a regra 8 (à direita).\n10. COMPLETUDE E NADA A MAIS: nenhuma coluna ou linha de tabela, figura ou trecho do PDF pode\n   faltar, e nenhum trecho pode aparecer mais vezes do que no PDF. Use TODAS as figuras\n   informadas. No texto extraído, cada linha de tabela vem numa linha só (o cabeçalho em negrito,\n   ex.: \"**Nutriente I II III**\"): ela entra SÓ dentro da tabela, nunca também como título ou\n   parágrafo. O título de uma tabela é a linha acima dela (ex.: \"Tabela 1: ...\"). Se algo não\n   estiver legível, marque revisar = true.\n\nCABEÇALHO\n- instituicao e ano vêm da barra vermelha \"Questão NN ... BANCA ANO\". Ex.: \"UFMG 2025\" →\n  instituicao \"UFMG\", ano 2025. \"CESMAC MEDICINA 2022/1\" → instituicao \"CESMAC MEDICINA\",\n  ano 2022. \"(ADAPTADO)\" → adaptada true e não entra na instituição. Sem banca → null; sem\n  ano → null. Não confunda com datas citadas no enunciado.\n\nDISCIPLINA, TÓPICO E ASSUNTOS\n- Somente pares que existem no ANEXO — BASE DE TÓPICOS, copiados com a grafia exata.\n  O campo topico recebe o nome do TÓPICO, nunca o do assunto.\n- Em lista de exercícios a mensagem informa a disciplina e o tópico da lista: use-os.\n- assuntos: 1 ou 2 assuntos do tópico escolhido (os que aparecem depois de \"Tópico:\" no\n  anexo), com a grafia exata, pelo conteúdo que a questão cobra. Tópico sem assuntos listados\n  → assuntos = [nome do tópico].\n\nDIFICULDADE (inteiro de 1 a 5, obrigatório)\n1 = Muito Fácil · 2 = Fácil · 3 = Média · 4 = Difícil · 5 = Muito Difícil\n- Referência: aluno de pré-vestibular/ENEM que já estudou o tópico.\n- Pese: quantos conceitos ou etapa // Markdown + LaTeX: guarda as fórmulas antes do Markdown para não perder _ e * dentro delas.
function md(texto, figuras = {}) {
  const guardadas = [];
  const t = String(texto || '').replace(/\\\$/g, '\u0001')
    .replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => { guardadas.push(m); return `\u0002${guardadas.length - 1}\u0002`; })
    .replace(/(\(|src=")figura:([A-Za-z0-9_]+)/g, (m, a, n) => a + (figuras[n] || ''));
  const html = window.marked ? marked.parse(t) : `<p>${esc(t)}</p>`;
  return html.replace(/\u0002(\d+)\u0002/g, (m, i) => esc(guardadas[+i])).replace(/\u0001/g, '\\$');
}
function tipografar(el) {
  if (window.MathJax?.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
  else setTimeout(() => tipografar(el), 300);
}
function textoBusca(q) {
  return String(q.enunciado || '').replace(/<[^>]+>|!\[[^\]]*\]\([^)]*\)|[$*_#>|\\]/g, ' ').replace(/\s+/g, ' ').slice(0, 400);
}

      estado.partes = new Map([...fatias.values()].flat()); aoMudarDados();
    }, erro);
    db.collection('listas').limit(1000).onSnapshot(s => { estado.listas = new Map(s.docs.map(d => [d.id, d.data()])); aoMudarDados(); }, erro);
  }

let redesenhoPendente = null;
function aoMudarDados() {   // vários snapshots chegam juntos: um redesenho por quadro
  if (redesenhoPendente) return;
  redesenhoPendente = requestAnimationFrame(() => { redesenhoPendente = null; desenharSeSeguro(); });
}
function desenharSeSeguro() {   // não redesenha por baixo de quem está digitando ou com a janela aberta
  if (document.getElementById('camada').childElementCount) return;
  const ativo = document.activeElement;
  if (ativo && ['INPUT', 'TEXTAREA', 'SELECT'].includes(ativo.tagName) && principal.contains(ativo)) return;
  desenhar();
}

// O banco geral = todas as questões de todas as partes, com id "<importação>:<NN>".
function banco() {
  const qs = [];
  for (const [parteId, parte] of estado.partes) {
    const imp = estado.importacoes.get(parte.importacao);
    for (const q of parte.questoes || []) qs.push({...q, id: `${parte.importacao}:${nn(q.numero)}`, origem: parte.importacao,
      parte_id: parteId, lista_origem: imp?.titulo || '', criado_em: imp?.criado_em || ''});
  }
  return qs.sort((a, b) => a.criado_em.localeCompare(b.criado_em) || a.lista_origem.localeCompare(b.lista_origem) || a.numero - b.numero);
}
function indiceBanco() { return new Map(banco().map(q => [q.id, q])); }

// ============================================================ validação (porta de upq/validar.py)
const RE_MATH = /\$\$[\s\S]+?\$\$|\$[^$]+?\$/g;
const RE_FIG = /(?:!\[[^\]]*\]\(|src=")figura:([A-Za-z0-9_]+)/g;
const UNICODE_MAT = '²³¹⁰⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉√≤≥≠±×÷∞∫∑πΔ≈';
const semAcento = s => s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function checarLatex(campo, texto, erros, avisos) {
  const limpo = texto.replace(/\\\$/g, '');
  if ((limpo.match(/\$/g) || []).length % 2) erros.push(`${campo}: quantidade ímpar de "$" (fórmula aberta ou R$ sem escape)`);
  if (/R\$\s?\d/.test(limpo)) erros.push(`${campo}: "R$" sem escape (use R\\$)`);
  for (const f of limpo.match(RE_MATH) || []) {
    if ((f.match(/\{/g) || []).length !== (f.match(/\}/g) || []).length) erros.push(`${campo}: chaves desbalanceadas em ${f.slice(0, 40)}`);
    for (const p of ['\\ce{', '\\SI{', '\\usepackage']) if (f.includes(p)) erros.push(`${campo}: comando não suportado ${p}`);
  }
  const fora = limpo.replace(RE_MATH, ' ');
  const achados = [...new Set([...fora].filter(c => UNICODE_MAT.includes(c)))];
  if (achados.length) avisos.push(`${campo}: símbolo fora de LaTeX (${achados.join(' ')})`);
}
// Negrito e centralização do PDF (marcados no texto extraído) têm de estar na transcrição
// (igual a conferir_formatacao em upq/validar.py).
// aviso que a IA às vezes escreve no lugar de um trecho que não leu (igual a upq/validar.py)
const RE_NAO_LIDO = /n[ãa]o\s+(?:[ée]\s+)?leg[ií]ve|ileg[ií]ve|n[ãa]o\s+(?:foi\s+)?(?:capturad|extra[ií]d|identificad)|n[ãa]o\s+dispon[ií]vel\s+no\s+texto|\((?:express[ãa]o|f[óo]rmula)[^)]*\)/i;
const soAlnum = t => semAcento(String(t).replace(/\\[a-zA-Z]+|<[^>]+>/g, ' ')).replace(/[^a-z0-9]/g, '');
function trechosNegrito(t) {
  const partes = [...t.matchAll(/\*\*([\s\S]+?)\*\*/g), ...t.matchAll(/<strong>([\s\S]+?)<\/strong>/g), ...t.matchAll(/<thead>([\s\S]*?)<\/thead>/g)].map(m => m[1]);
  const linhas = t.split('\n');
  linhas.forEach((l, i) => { if (l.trim().startsWith('|') && (i === 0 || !linhas[i - 1].trim().startsWith('|'))) partes.push(l); });
  return partes.map(soAlnum).join('|');
}
function trechosCentralizados(t) {
  return [...t.matchAll(/<p style="text-align: center;">([\s\S]*?)<\/p>/g), ...t.matchAll(/<table style="margin-left: auto; margin-right: auto;">([\s\S]*?)<\/table>/g)]
    .map(m => soAlnum(m[1])).join('|');
}
// Trava contra vazamento: nenhum trecho do PDF pode aparecer na transcrição mais vezes do que
// aparece no PDF (ex.: cabeçalho de tabela repetido como título). Igual a upq/validar.py.
function conferirRepeticoes(textoPdf, transcrito) {
  const linhas = String(textoPdf || '').split('\n').slice(1).filter(l => !l.startsWith(MARCA_OCR)).map(l => soAlnum(l.replace(/^\[centralizado\] /, '').replace(/\*\*/g, '')));
  const pdf = linhas.join(''), tr = soAlnum(transcrito);
  const conta = (t, n) => t.split(n).length - 1;
  const repetidos = [...new Set(linhas.filter(n => n.length >= 12))].filter(n => conta(tr, n) > conta(pdf, n));
  if (!repetidos.length) return [];
  const original = String(textoPdf).split('\n').slice(1).filter(l => !l.startsWith(MARCA_OCR)).map(l => l.replace(/^\[centralizado\] /, '').replace(/\*\*/g, '').trim());
  return ['trecho repetido na transcrição (aparece mais vezes do que no PDF): ' + repetidos.slice(0, 3).map(n => `«${(original.find(l => soAlnum(l) === n) || n).slice(0, 60)}»`).join('; ')];
}
// A figura tem de ficar no lugar dela no PDF: as palavras logo antes da marca ⟦FIGURA NOME⟧ vêm antes
// da figura no enunciado, e as logo depois vêm depois (texto trocado de lugar em volta da figura = erro).
function recorteMisturado(textoPdf, numero) {
  const linhas = String(textoPdf || '').split('\n');
  if (!textoPdf) return null;
  const barra = linhas[0].match(/^\s*Quest[aã]o\s*(\d[\d ]*)/i);
  if (!barra || +barra[1].replace(/ /g, '') !== +numero) return `o texto da questão não começa na barra "Questão ${nn(numero)}" (colunas ou questões misturadas)`;
  if (linhas.slice(1).some(l => /^\s*Quest[aã]o\s*\d/i.test(l))) return 'há a barra de outra questão dentro desta (questões misturadas)';
  const letras = linhas.map(l => (l.match(/^(?:\*\*)?([A-E])(?:\*\*)?\s+\S/) || [])[1]).filter(Boolean);
  let viuB = false;
  for (let i = 1; i < letras.length; i++) {
    if (letras[i] === 'B') viuB = true;
    if (viuB && letras[i] < letras[i - 1]) return `alternativas fora de ordem no texto do PDF (${letras.join(' ')}): colunas misturadas`;
  }
  return null;
}
function conferirPosicaoFiguras(textoPdf, enunciado, tabelas = new Set()) {
  const linhas = String(textoPdf || '').split('\n').slice(1), enun = String(enunciado || ''), erros = [];
  const palavras = l => semAcento(semMarcasFormula(l).replace(/^\[centralizado\] /, '').replace(/\*\*/g, '')).match(/[a-z]{4,}/g) || [];
  const ehAlternativa = l => /^(\*\*)?[A-E](\*\*)?(\s|$)/.test(l.trim());
  for (const [i, l] of linhas.entries()) {
    const m = l.match(/^⟦FIGURA ([A-Za-z0-9_]+)⟧$/);
    if (!m || tabelas.has(m[1])) continue;
    const pos = enun.search(new RegExp(`figura:${m[1]}\\b`));
    if (pos < 0) continue;   // figura numa alternativa ou não usada: outras conferências cuidam
    const antes = semAcento(enun.slice(0, pos)).replace(/\\[a-zA-Z]+/g, ' '), depois = semAcento(enun.slice(pos)).replace(/\\[a-zA-Z]+/g, ' ');
    // últimas palavras do texto antes da marca e primeiras depois (parando nas alternativas)
    const ant = linhas.slice(0, i).filter(x => !/^⟦FIGURA/.test(x)).flatMap(palavras).slice(-3);
    const dep = [];
    for (const x of linhas.slice(i + 1)) { if (ehAlternativa(x)) break; if (!/^⟦FIGURA/.test(x)) dep.push(...palavras(x)); if (dep.length >= 3) break; }
    const falhaAntes = ant.length === 3 && !ant.every(w => antes.includes(w)) && ant.every(w => depois.includes(w));
    const falhaDepois = dep.length >= 3 && !dep.slice(0, 3).every(w => depois.includes(w)) && dep.slice(0, 3).every(w => antes.includes(w));
    if (falhaAntes || falhaDepois)
      erros.push(`figura ${m[1]} fora do lugar: no PDF ela vem ${falhaAntes ? `depois de «…${ant.join(' ')}»` : `antes de «${dep.slice(0, 3).join(' ')}…»`} (texto trocado de lugar em volta da figura)`);
  }

}
function conferirFormatacao(textoPdf, transcrito) {
  const erros = [], faltamN = [], faltamC = [];
  const negrito = trechosNegrito(transcrito), centro = trechosCentralizados(transcrito);
  for (let l of String(textoPdf || '').split('\n').slice(1).filter(l => !l.startsWith(MARCA_OCR))) {
    const cent = l.startsWith('[centralizado] ');
    l = l.replace(/^\[centralizado\] /, '');
    for (const m of l.matchAll(/\*\*(.+?)\*\*/g)) { const n = soAlnum(m[1]); if (n.replace(/[0-9]/g, '').length >= 4 && !negrito.includes(n)) faltamN.push(m[1].trim()); }
    const limpo = l.replace(/\*\*/g, ''), n = soAlnum(limpo);
    if (cent && n.length >= 3 && !/^\s*\(?(fonte|dispon[ií]vel)/i.test(limpo) && !centro.includes(n)) faltamC.push(limpo.trim());
  }
  if (faltamN.length) erros.push('negrito do PDF ausente na transcrição: ' + faltamN.slice(0, 4).map(t => `«${t.slice(0, 60)}»`).join('; '));
  if (faltamC.length) erros.push('texto centralizado no PDF sem centralizar: ' + faltamC.slice(0, 4).map(t => `«${t.slice(0, 60)}»`).join('; '));
  return erros;
}
function conferirComPdf(textoPdf, transcrito) {
  textoPdf = String(textoPdf || '').split('\n').filter(l => !l.startsWith(MARCA_OCR)).join('\n').replace(/\[centralizado\] /g, '').replace(/\*\*/g, '');
  const avisos = [];
  const corpo = String(textoPdf || '').split('\n').slice(1).filter(l => !/^\s*\(?(Fonte|Disponível em)/.test(l)).join('\n');
  const digitos = transcrito.replace(/\D/g, '');
  const faltam = [...new Set((corpo.replace(/\./g, '').match(/\d+/g) || []).filter(n => n.length >= 2 && !digitos.includes(n)))];
  if (faltam.length) avisos.push(`números do PDF ausentes na transcrição: ${faltam.join(', ')}`);
  const palavras = new Set(semAcento(corpo).match(/[a-z]{5,}/g) || []);
  if (palavras.size) {
    const t = semAcento(transcrito);
    const cob = [...palavras].filter(w => t.includes(w)).length / palavras.size;
    if (cob < 0.85) avisos.push(`só ${Math.round(cob * 100)}% das palavras do PDF aparecem na transcrição (trecho cortado?)`);
  }
  return avisos;
}
function validarQuestao(q, lista) {
  const erros = [], avisos = [];
  // Trava de recorte: o texto da questão começa na barra dela e as alternativas vêm em ordem; senão o
  // recorte misturou colunas/questões (nunca deixa passar como se estivesse certo)
  const misturado = recorteMisturado(q.textoPdf, q.numero);
  if (misturado) erros.push(`recorte incompleto: ${misturado}. Avise o suporte do importador.`);
  if (q.foraDoRecorte?.length) erros.push(`recorte incompleto: trecho da página fora da questão (${q.foraDoRecorte.slice(0, 3).map(t => `«${t}»`).join('; ')}). Avise o suporte do importador.`);
  const assuntosBase = BASE.get(q.disciplina + '\u0000' + q.topico);
  if (!assuntosBase) erros.push(`par fora da base de tópicos: ${q.disciplina} / ${q.topico}`);
  if (lista?.tipo === 'lista' && lista.disciplina && (q.disciplina !== lista.disciplina || q.topico !== lista.topico)) erros.push('disciplina/tópico diferente do resto da lista');
  const validos = assuntosBase && assuntosBase.length ? assuntosBase : [q.topico];
  if (!q.assuntos?.length) erros.push('sem assunto');
  for (const a of q.assuntos || []) if (!validos.includes(a)) erros.push(`assunto fora da base para ${q.topico}: ${a}`);
  const letras = Object.keys(q.alternativas || {});
  if (letras.join('') !== 'ABCDE'.slice(0, letras.length) || letras.length < 2) erros.push(`alternativas fora de ordem ou insuficientes: ${letras.join(', ')}`);
  if (!q.gabarito) erros.push('sem gabarito: a tabela do fim da lista não foi lida (preencha na edição)');
  else if (!letras.includes(q.gabarito)) erros.push(`gabarito ${q.gabarito} não está entre as alternativas`);
  for (const [nome, t] of [['enunciado', q.enunciado], ...Object.entries(q.alternativas || {}).map(([l, t]) => [`alternativa ${l}`, t])]) {
    const achado = String(t || '').match(RE_NAO_LIDO);
    if (achado) erros.push(`${nome}: trecho não transcrito (a IA escreveu «${achado[0]}»)`);
  }
  for (const [l, t] of Object.entries(q.alternativas || {})) {
    if (!String(t).trim()) erros.push(`alternativa ${l} vazia`);
    else if (/^\(?[a-eA-E][).]\s/.test(t)) avisos.push(`alternativa ${l} parece começar com a letra`);
  }
  const faixa = FAIXA_ETAPA[q.etapa];
  if (faixa && !(faixa[0] <= q.dificuldade && q.dificuldade <= faixa[1])) avisos.push(`dificuldade ${q.dificuldade} fora da faixa ${faixa[0]}–${faixa[1]} de ${q.etapa}`);
  const campos = {enunciado: q.enunciado, ...Object.fromEntries(Object.entries(q.alternativas || {}).map(([k, v]) => [`alternativa ${k}`, v]))};
  for (const [nome, texto] of Object.entries(campos)) checarLatex(nome, String(texto || ''), erros, avisos);
  const nomes = new Set((q.figuras || []).map(f => f.nome));
  const usadas = new Set(Object.values(campos).flatMap(t => [...String(t || '').matchAll(RE_FIG)].map(m => m[1])));
  const inexistentes = [...usadas].filter(n => !nomes.has(n));
  if (inexistentes.length) erros.push(`figura inexistente referenciada: ${inexistentes.join(', ')}`);
  // Tabela colada como imagem (print) no PDF: tem de virar tabela de verdade, nunca imagem.
  const tabelasImg = new Set((q.figuras || []).filter(f => f.tabela).map(f => f.nome));
  const comoImagem = [...tabelasImg].filter(n => usadas.has(n));
  const temTabela = Object.values(campos).some(t => /<table|^\s*\|/m.test(String(t || '')));
  const porOcr = new Set(q.tabelasOcr || []), semDados = [...tabelasImg].filter(n => !porOcr.has(n));
  if (tabelasImg.size && q.lidaSemImagem && semDados.length)
    erros.push(`tabela colada como imagem no PDF (${semDados.join(', ')}): os dados só existem na imagem e esta leitura foi feita sem imagem nem OCR. Clique em Reprocessar.`);
  else if (comoImagem.length) erros.push(`tabela colada como imagem no PDF usada como figura (${comoImagem.join(', ')}): transcreva-a como tabela`);
  else if (tabelasImg.size && !temTabela) erros.push(`tabela da imagem não foi transcrita (${[...tabelasImg].join(', ')})`);
  if (q.lidaSemImagem && porOcr.size && !comoImagem.length && temTabela) avisos.push(`tabela lida por OCR do print (${[...porOcr].join(', ')}): confira os valores com o original`);
  // figura que no PDF está ao lado da letra de uma alternativa é o conteúdo dessa alternativa
  const foraDoLugar = (q.figuras || []).filter(f => f.alternativa && !f.tabela && q.alternativas?.[f.alternativa] !== undefined
    && !new RegExp(`figura:${f.nome}\\b`).test(String(q.alternativas[f.alternativa])));
  if (foraDoLugar.length) erros.push(`alternativa em imagem fora do lugar: ${foraDoLugar.map(f => `${f.nome} é a alternativa ${f.alternativa}`).join('; ')}`);
  // alternativas em imagem: se várias são figuras, nenhuma pode ficar sem a sua (recorte ou leitura falhou)
  const comFigura = new Set((q.figuras || []).filter(f => f.alternativa && !f.tabela).map(f => f.alternativa));
  if (comFigura.size >= 2) {
    const semFigura = Object.keys(q.alternativas || {}).filter(l => !comFigura.has(l) && !/figura:/.test(String(q.alternativas[l])) && !String(q.alternativas[l]).replace(/[\s.]/g, ''));
    if (semFigura.length) erros.push(`alternativa sem a figura: ${semFigura.join(', ')} (as outras alternativas são imagens)`);
  }
  const deFormula = (q.figuras || []).filter(f => f.deFormula).map(f => f.nome);
  if (deFormula.length) avisos.push(`trecho sem texto do PDF entrou como imagem (${deFormula.join(', ')}): confira se é desenho ou fórmula`);
  const sobras = [...nomes].filter(n => !usadas.has(n) && !tabelasImg.has(n));
  if (sobras.length) erros.push(`figura recortada mas não usada no texto: ${sobras.join(', ')}`);
  // Fórmula em imagem no PDF: tem de estar na transcrição (a lida por OCR, com o mesmo conteúdo)
  const transcrito = [q.enunciado, ...Object.values(q.alternativas || {})].join('\n');
  const marcas = marcasFormula(q.textoPdf);
  if (marcas.length) {
    const tr = soAlnum(transcrito), info = new Map((q.formulas || []).map(f => [f.nome, f]));
    const naoLidas = marcas.filter(f => !f.latex).map(f => f.nome);
    if (naoLidas.length && q.lidaSemImagem)
      erros.push(`fórmula em imagem não lida (${naoLidas.join(', ')}): o PDF traz a fórmula só como imagem e esta leitura foi feita sem imagem nem leitor de fórmulas. Clique em Reprocessar.`);
    const faltam = marcas.filter(f => f.latex && soAlnum(f.latex) && !tr.includes(soAlnum(f.latex)));
    if (faltam.length) erros.push(`fórmula do PDF ausente na transcrição: ${faltam.slice(0, 3).map(f => `${f.nome} ($${f.latex}$)`).join('; ')}`);
    const lidas = marcas.filter(f => f.latex), incertas = lidas.filter(f => (info.get(f.nome)?.votos ?? 2) < 2);
    if (incertas.length) avisos.push(`fórmula lida da imagem com incerteza (${incertas.map(f => f.nome).join(', ')}): confira com o original`);
    else if (lidas.length && q.lidaSemImagem) avisos.push(`fórmula lida da imagem por OCR (${lidas.map(f => f.nome).join(', ')}): confira com o original`);
  }
  erros.push(...conferirPosicaoFiguras(q.textoPdf, q.enunciado, tabelasImg));
  const pdfSemMarcas = semMarcasFormula(q.textoPdf);
  erros.push(...conferirComPdf(pdfSemMarcas, transcrito));
  erros.push(...conferirFormatacao(pdfSemMarcas, transcrito));
  erros.push(...conferirRepeticoes(pdfSemMarcas, transcrito));
  if (q.revisar && !q.revisada) avisos.unshift(`IA pediu revisão: ${q.observacoes || '(sem motivo)'}`);
  if (q.revisada) return {erros, avisos: []};
  return {erros, avisos};
}

function titulo(tipo, tituloLista, numero, instituicao, ano, simulado) {
  if (tipo === 'simulado') return `Questão ${nn(numero)} - ${simulado?.numero ?? '?'}º Simulado Autoral 2026 - ${simulado?.dia ?? '?'}º DIA`;
  const origem = [instituicao, ano].filter(Boolean).join(' ');
  return `Lista de Exercícios - ${tituloLista} - Questão ${nn(numero)}` + (origem ? ` - ${origem}` : '');
}
function dadosSimulado(nome) {
  const s = nome.replace(/_/g, ' ');
  const sim = s.match(/(\d+)\s*[ºo°]?\s*Simulado/i), dia = s.match(/(\d+)\s*[ºo°]?\s*DIA|DIA\s*(\d+)/i);
  return {numero: sim ? +sim[1] : null, dia: dia ? +(dia[1] || dia[2]) : null};
}

// ============================================================ Claude (capacidade "sample")
// Sem imagens nesta visualização (ex.: app de desktop): transcreve só pelo texto do PDF.
const comImagens = () => !!cap.limites?.images || cap.sonda?.estado === 'ok';
// Teste real: manda ao Claude uma imagem minúscula com a letra "B". Se ele ler, o modo com imagem
// vale mesmo que limits() não anuncie imagens. Custa uma chamada pequena, feita uma vez.
async function sondarImagens(forcar = false) {
  if (!cap.sample || cap.limites?.images) return;
  if (!forcar && (cap.sonda?.estado === 'ok' || cap.sonda?.estado === 'sem imagem')) return;
  const c = document.createElement('canvas'); c.width = c.height = 96;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 96, 96);
  ctx.fillStyle = '#000'; ctx.font = 'bold 72px Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('B', 48, 52);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  cap.sonda = {estado: 'testando', em: agora()};
  if (tela.nome === 'enviar') desenhar();
  try {
    const r = await cap.sample.json('A imagem anexada mostra uma única letra maiúscula. Responda somente com JSON: {"letra": "X"}', {images: [blob], modelTier: 'default', cache: false});
    const letra = String(r?.letra || '').trim().toUpperCase();
    cap.sonda = letra === 'B' ? {estado: 'ok', em: agora()} : {estado: 'sem imagem', codigo: 'resposta', mensagem: `o Claude respondeu "${letra || '?'}" (não viu a imagem)`, em: agora()};
  } catch (e) {
    const codigo = e?.code || 'erro';
    const conclusivo = ['images_unavailable', 'image_rejected', 'invalid_request'].includes(codigo);
    cap.sonda = {estado: conclusivo ? 'sem imagem' : 'indefinido', codigo, mensagem: e?.message || String(e), em: agora()};
  }

      if (nova.erros.length < x.erros.length) melhores.set(x.q.numero, nova);
    });
    aoAvancar(Math.min(i + porLote, itens.length), itens.length);
  }
  // a IA pulou alguma questão do lote: pede de novo uma vez
  if (sem.length && repetir) for (const [n, q] of await rodadaCorrecao(sem, ctx, () => {}, false)) melhores.set(n, q);
  return melhores;
}
// Durante a importação: valida o que veio do Claude e reprocessa as questões com erro.
async function corrigirComErro(job) {
  job.fase = 'correcao';
  const ctx = job.ctx, itens = [];
  for (const q of job.m.questoes) {
    const r = job.resultados.get(q.numero);
    if (!r) continue;
    const v = validarQuestao({...r, figuras: q.figuras.map(f => ({nome: f.nome, tabela: !!f.tabela, alternativa: f.alternativa || null, deFormula: !!f.deFormula}))}, {tipo: ctx.tipo, disciplina: ctx.disciplina, topico: ctx.topico});
    const erros = errosReprocessaveis(v);
    if (erros.length) itens.push({q, erros, imagem: q.imagem, manter: {figuras: q.figuras.map(f => ({nome: f.nome, tabela: !!f.tabela, centralizada: !!f.centralizada, alternativa: f.alternativa || null, deFormula: !!f.deFormula}))}});
  }
  job.reprocessadas = 0; job.corrigidas = 0;
  if (!itens.length) return;
  atualizar(job, {etapa: 2, estado: 'rodando', progresso: 0, mensagem: `Reprocessando ${itens.length} questão(ões) com erro…`});
  try {
    const melhores = await rodadaCorrecao(itens, ctx, (f, t) => atualizar(job, {progresso: f / t, mensagem: `Reprocessando questões com erro: ${f} de ${t}…`}));
    for (const [n, nova] of melhores) { const {figuras, erros, avisos, ...resto} = nova; job.resultados.set(n, resto); }
    job.reprocessadas = itens.length; job.corrigidas = melhores.size;
  } catch (e) { console.warn('reprocessamento adiado', e); job.reprocessadas = 0; }
}
// Questões já no banco: baixa o recorte guardado e reprocessa.
async function baixarImagem(id) {
  try { const r = await fetch(blobUrl(id)); if (r.ok) return await r.blob(); } catch {}
  const img = new Image(); img.src = blobUrl(id); await img.decode();
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
}
let reprocessando = false;
async function reprocessarQuestoes(qs) {
  if (reprocessando || !qs.length) return;
  if (!cap.sample) return toast('O Claude não está disponível nesta visualização.');
  reprocessando = true; desenhar();
  let corrigidas = 0, feitas = 0;
  try {
    const porImp = new Map();
    for (const q of qs) { if (!porImp.has(q.origem)) porImp.set(q.origem, []); porImp.get(q.origem).push(q); }
    for (const [idImp, grupo] of porImp) {
      const imp = estado.importacoes.get(idImp);
      if (!imp) continue;
      const ctx = {titulo: imp.titulo, tipo: imp.tipo, gabarito: imp.gabarito || {}, disciplina: imp.disciplina, topico: imp.topico,
        simulado: imp.tipo === 'simulado' ? dadosSimulado(imp.arquivo) : null};
      const itens = [];
      for (const q0 of grupo) {
        let q = q0;
        if (!comImagens() && (q.figuras || []).some(f => f.tabela)) {   // sem imagem: OCR das tabelas-imagem guardadas
          const lidas = {};
          for (const f of q.figuras.filter(f => f.tabela)) { try { const l = await ocrDaFigura(await baixarImagem(f.asset)); if (l) lidas[f.nome] = l; } catch (e) { console.warn('OCR', e); } }
          if (Object.keys(lidas).length) q = {...q, ocr: lidas, textoPdf: comTabelasOcr(q.textoPdf, q.figuras, lidas)};
        }
        if (!comImagens() && (q.formulas || []).some(f => !f.latex && f.asset)) {   // sem imagem: lê as fórmulas guardadas
          const formulas = [];
          for (const f of q.formulas) {
            if (f.latex || !f.asset) { formulas.push(f); continue; }
            try { formulas.push({...f, ...(await lerFormula({blob: await baixarImagem(f.asset)}) || {})}); } catch (e) { console.warn('fórmula', e); formulas.push(f); }
          }
          q = {...q, formulas, figuras: [...(q.figuras || [])]};
          formulasViramFiguras(q);   // o recorte guardado (asset) passa a ser a figura
          q.textoPdf = comFormulas(q.textoPdf, q.formulas);
        }
        itens.push({q, erros: errosReprocessaveis(q0), imagem: comImagens() ? await baixarImagem(q.imagem) : null,
        manter: {imagem: q.imagem, figuras: q.figuras, formulas: (q.formulas || []).map(({blob, comoFigura, ...f}) => f), gabaritoRecorte: q.gabaritoRecorte || null}});
      }
      const melhores = await rodadaCorrecao(itens, ctx, (f) => toast(`Reprocessando: ${feitas + f} de ${qs.length}…`));
      feitas += grupo.length;
      const porParte = new Map();
      for (const q of grupo) if (melhores.has(q.numero)) { if (!porParte.has(q.parte_id)) porParte.set(q.parte_id, []); porParte.get(q.parte_id).push(melhores.get(q.numero)); }
      for (const [pid, novas] of porParte) {
        const parte = estado.partes.get(pid);
        const questoes = parte.questoes.map(x => { const n = novas.find(y => y.numero === x.numero); return n ? {...n, revisada: false} : x; });
        await cap.db.doc(`partes/${pid}`).set({...parte, questoes});
        corrigidas += novas.length;
      }
    }
    toast(`Reprocessamento concluído: ${corrigidas} de ${qs.length} questão(ões) corrigida(s).${corrigidas < qs.length ? ' As demais continuam com erro para revisão.' : ''}`);
  } catch (e) {
    toast(e?.code === 'rate_limited' ? 'Limite de uso do Claude atingido. Tente de novo em alguns minutos.' : `Reprocessamento parou: ${e?.message || e?.code || e}`);
  } finally { reprocessando = false; desenhar(); }
}

// ============================================================ processamento de um PDF
function novoJob(arquivo) {
  const job = {id: 'j' + Date.now() + Math.random().toString(36).slice(2, 6), arquivo: arquivo.name, file: arquivo,
    etapa: 0, estado: 'rodando', mensagem: 'Lendo o PDF…', progresso: 0, m: null, ctx: null, resultados: new Map(), pendentes: []};
  estado.jobs.unshift(job);
  return job;
}
function atualizar(job, campos) { Object.assign(job, campos); if (tela.nome === 'enviar') desenharEnvios(); }

// ---------------- previsão de término (cartão de cada lista)
// Custos típicos de cada passo; a transcrição usa o ritmo medido assim que as primeiras respostas chegam.
const CUSTO_MS = {pagina: 700, tabela: 6000, formula: 2500, chamada: 75000, classificacao: 25000, gravacaoQ: 150};
const FASES = ['recorte', 'ocr', 'formulas', 'classificacao', 'transcricao', 'correcao', 'gravacao'];
function previsaoMs(job) {
  if (job.estado !== 'rodando' || !job.fase) return null;
  const m = job.m, n = m?.questoes?.length || Math.round((job.paginas || 0) * 3.5);   // antes de recortar: ~3,5 questões/página
  if (!n) return null;
  const lote = porChamada();
  const feitas = job.resultados?.size || 0;
  const ritmo = job.trans && feitas - job.trans.feitas0 >= lote ? (Date.now() - job.trans.inicio) / (feitas - job.trans.feitas0) : null;   // ms por questão
  const transcrever = q => ritmo ? q * ritmo : Math.ceil(q / lote / SIMULTANEAS) * CUSTO_MS.chamada;
  const semImagem = !comImagens();
  const tabelas = semImagem && m ? m.questoes.reduce((a, q) => a + (q.figuras || []).filter(f => f.tabela && !(q.ocr && q.ocr[f.nome])).length, 0) : 0;
  const formulas = semImagem && m ? m.questoes.reduce((a, q) => a + (q.formulas || []).filter(f => !f.latex && !f.comoFigura).length, 0) : 0;
  const resto = {
    recorte: job.fase === 'recorte' ? (job.paginas || 0) * (1 - (job.progresso || 0)) * CUSTO_MS.pagina * (job.lendo ? 1.3 : 1) : 0,
    ocr: tabelas * CUSTO_MS.tabela,
    formulas: formulas * CUSTO_MS.formula / Math.max(1, formula.leitor?.paralelos?.() || 1),
    classificacao: CUSTO_MS.classificacao,
    transcricao: transcrever(n - feitas),
    correcao: 0.12 * transcrever(n),
    gravacao: n * CUSTO_MS.gravacaoQ * (job.fase === 'gravacao' ? 1 - (job.progresso || 0) : 1),
  };
  const i = FASES.indexOf(job.fase);
  return FASES.slice(Math.max(0, i)).reduce((a, f) => a + (resto[f] || 0), 0);
}
const mmss = ms => { const t = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(t / 3600), mi = Math.floor(t % 3600 / 60), se = t % 60;
  return h ? `${h}h${String(mi).padStart(2, '0')}` : `${mi}:${String(se).padStart(2, '0')}`; };
function textoTempo(job) {
  if (job.estado === 'fila') return 'Na fila: começa quando uma das listas em andamento terminar.';
  if (!job.inicio || ['concluido', 'falhou', 'duplicado', 'gabarito'].includes(job.estado)) return '';
  const decorrido = `⏱ ${mmss(Date.now() - job.inicio)} decorridos`;
  if (job.estado === 'parado') return decorrido + ' · pausada';
  const falta = previsaoMs(job);
  if (falta === null) return decorrido + ' · calculando o tempo restante…';
  const fim = new Date(Date.now() + falta).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
  return `${decorrido} · faltam ~${falta < 60000 ? 'menos de 1 min' : Math.ceil(falta / 60000) + ' min'} · deve terminar por volta de ${fim}`;
}
setInterval(() => {   // o relógio anda sozinho, sem redesenhar os cartões
  document.querySelectorAll('[data-tempo-job]').forEach(el => { const j = estado.jobs.find(x => x.id === el.dataset.tempoJob); if (j) el.textContent = textoTempo(j); });
}, 1000);

async function processar(job, {reprocessar = false} = {}) {
  job.inicio ||= Date.now();
  try {
    if (!job.m) {
      atualizar(job, {etapa: 0, estado: 'rodando', mensagem: 'Recortando questões e figuras…', progresso: 0});
      await pdfjsPronto;
      job.fase = 'recorte';
      job.m = await UPQRecorte.segmentar(job.file, p => atualizar(job, {mensagem: p.etapa === 'lendo' ? `Lendo a página ${p.pagina} de ${p.total}…` : `Recortando a página ${p.pagina} de ${p.total}…`,
        progresso: p.pagina / p.total, paginas: p.total, lendo: p.etapa === 'lendo'}));
      if (!job.m.questoes.length) return atualizar(job, {estado: 'falhou', mensagem: 'Nenhuma barra "Questão NN" encontrada. Este PDF segue outro modelo de lista.'});
      job.idImp = job.m.hash.slice(0, 16);
      if (estado.jobs.some(j => j !== job && j.idImp === job.idImp && ['rodando', 'parado'].includes(j.estado)))
        return atualizar(job, {estado: 'duplicado', mensagem: 'Este mesmo PDF já está sendo processado em outro cartão.'});
      if (estado.importacoes.has(job.idImp) && !reprocessar)
        return atualizar(job, {estado: 'duplicado', mensagem: `Esta lista já está no banco (${job.m.questoes.length} questões). Reprocessar substitui a transcrição.`});
    }
    const m = job.m;
    if (!job.ctx) {
      if (!comImagens()) { atualizar(job, {etapa: 1, estado: 'rodando', progresso: 0, mensagem: 'Testando se o Claude recebe imagens nesta visualização…'}); await sondarImagens(); }
      if (!comImagens()) { await lerTabelasPorOcr(job); await lerFormulasPorOcr(job); }
      atualizar(job, {etapa: 1, estado: 'rodando', progresso: 0, mensagem: `${m.questoes.length} questões recortadas. Lendo o gabarito e classificando a lista…`});
      // Gabarito obrigatório e sempre da tabela do fim da lista: lido no navegador; se não der,
      // o Claude lê a imagem da tabela; se ainda faltar, a lista para aqui (nada é transcrito).
      const completo = g => m.questoes.every(q => g[nn(q.numero)]);
      let gabarito = m.gabaritoPdf, origem = 'tabela do PDF';
      if (!completo(gabarito) && m.paginaGabarito && comImagens()) {
        atualizar(job, {mensagem: 'Lendo a tabela de gabarito com o Claude…'});
        gabarito = await lerGabarito(m.paginaGabarito).catch(() => ({}));
        origem = 'tabela do PDF (lida pelo Claude)';
      }
      if (!completo(gabarito)) {
        const faltam = m.questoes.filter(q => !gabarito[nn(q.numero)]).map(q => nn(q.numero));
        const motivo = m.gabaritoMotivo || `faltam as questões ${faltam.join(', ')}`;
        guardarFalhaGabarito(job, motivo).catch(() => {});
        return atualizar(job, {estado: 'gabarito', mensagem: `Não consegui ler a tabela de gabarito automaticamente (${motivo}). A lista não foi processada e nada foi enviado ao Claude.`});
      }
      job.fase = 'classificacao';
      const classe = m.tipo === 'lista' ? await classificar(m) : null;
      job.ctx = {titulo: m.titulo, tipo: m.tipo, gabarito, gabaritoOrigem: origem, disciplina: classe?.disciplina || null, topico: classe?.topico || null,
                 classificacao: classe, simulado: m.tipo === 'simulado' ? dadosSimulado(m.arquivo) : null};
      const porLote = porChamada();
      job.pendentes = [];
      for (let i = 0; i < m.questoes.length; i += porLote) job.pendentes.push({questoes: m.questoes.slice(i, i + porLote), tentativas: 0});
    }
    await transcreverPendentes(job);
    if (job.pendentes.length) return;   // parou: o botão "Continuar" retoma
    await corrigirComErro(job);
    await salvarNoBanco(job);
  } catch (e) {
    console.error(e);
    pararComErro(job, e);
  }
}

function pararComErro(job, e) {
  const codigo = e?.code;
  const msgs = {
    not_granted: 'O uso do Claude não foi permitido neste artefato. Recarregue a página e permita para continuar.',
    rate_limited: 'Limite de uso do Claude atingido por agora. Espere alguns minutos e clique em Continuar.',
    session_expired: 'Sua sessão expirou. Entre de novo no claude.ai e clique em Continuar.',
    images_unavailable: 'Esta visualização não consegue enviar imagens ao Claude. Abra o artefato no claude.ai pelo navegador.',
    sem_claude: 'O Claude não está disponível nesta visualização. Abra o artefato no claude.ai.',
  };
  // Limite de uso ou falha passageira do Claude: retoma sozinho depois de uma pausa (até MAX_RETOMADAS),
  // para uma fila de várias listas não parar no meio esperando um clique.
  const passageiro = ['rate_limited', 'upstream_error', 'empty_completion', 'invalid_json', 'timeout', 'overloaded', 'incompleto'].includes(codigo);
  job.retomadas = job.retomadas || 0;
  if (passageiro && job.retomadas < MAX_RETOMADAS && estado.jobs.includes(job)) {
    const espera = codigo === 'rate_limited' ? Math.min(600, 90 * 2 ** Math.min(3, job.retomadas)) : 20;
    job.retomadas++;
    let falta = espera;
    atualizar(job, {estado: 'parado', mensagem: `${codigo === 'rate_limited' ? 'Limite de uso do Claude atingido' : 'O Claude não respondeu direito'}. Retomando sozinho em ${falta} s (tentativa ${job.retomadas} de ${MAX_RETOMADAS})…`});
    job.contagem = setInterval(() => {
      if (job.estado !== 'parado' || !estado.jobs.includes(job)) { clearInterval(job.contagem); return; }
      if (--falta > 0) return atualizar(job, {mensagem: job.mensagem.replace(/em \d+ s/, `em ${falta} s`)});
      clearInterval(job.contagem); enfileirar(job);
    }, 1000);
    return;
  }
  atualizar(job, {estado: 'parado', mensagem: msgs[codigo] || `Parou: ${e?.message || codigo || e}. Clique em Continuar para tentar de novo.`});
}

async function transcreverPendentes(job) {
  job.fase = 'transcricao';
  job.trans = {inicio: Date.now(), feitas0: job.resultados.size};   // ritmo medido desta rodada
  const total = job.m.questoes.length;
  atualizar(job, {etapa: 1, estado: 'rodando', mensagem: `Transcrevendo com o Claude: ${job.resultados.size} de ${total} questões…`, progresso: job.resultados.size / total});
  let erroFatal = null;
  const trabalhador = async () => {
    while (job.pendentes.length && !erroFatal) {
      const lote = job.pendentes.shift();
      try {
        const r = await perguntar(promptLote(lote.questoes, job.ctx), comImagens() ? {images: lote.questoes.map(q => q.imagem)} : {});
        const lista = (Array.isArray(r?.questoes) ? r.questoes : []).filter(x => x && typeof x === "object");
        lote.questoes.forEach((q, i) => {
          const achada = lista.find(x => +x.numero === q.numero) || (lista.length === lote.questoes.length ? lista[i] : null);
          if (achada && String(achada.enunciado || '').trim()) job.resultados.set(q.numero, normalizarIA(achada, q, job.ctx));
        });
        const faltaram = lote.questoes.filter(q => !job.resultados.has(q.numero));
        if (faltaram.length && lote.tentativas < 1) job.pendentes.push({questoes: faltaram, tentativas: lote.tentativas + 1});
        else if (faltaram.length) { job.pendentes.unshift({questoes: faltaram, tentativas: 0}); erroFatal = {code: 'incompleto', message: `a IA não devolveu as questões ${faltaram.map(q => nn(q.numero)).join(', ')}`}; }
      } catch (e) {
        const transitorio = ['invalid_json', 'upstream_error', 'empty_completion', 'timeout', 'overloaded'].includes(e?.code);
        if (transitorio && lote.tentativas < 1) job.pendentes.push({...lote, tentativas: lote.tentativas + 1});
        else { job.pendentes.unshift({...lote, tentativas: 0}); erroFatal = e; }
      }
      atualizar(job, {mensagem: `Transcrevendo com o Claude: ${job.resultados.size} de ${total} questões…`, progresso: job.resultados.size / total});
    }
  };
  await Promise.all(Array.from({length: SIMULTANEAS}, trabalhador));
  if (erroFatal) throw erroFatal;
}

// Tabela que o leitor não conseguiu ler: guarda a página e o motivo (coleção "falhas") para
// ajustar o leitor sem precisar do PDF.
async function guardarFalhaGabarito(job, motivo) {
  if (!cap.db || !cap.assets || job.falhaGuardada) return;
  job.falhaGuardada = true;
  const imagem = job.m.paginaGabarito ? (await cap.assets.upload(job.m.paginaGabarito, {type: 'image/jpeg'})).id : null;
  await cap.db.doc(`falhas/${job.idImp}`).set({arquivo: job.m.arquivo, hash: job.m.hash, motivo, gabaritoImagem: imagem,
    questoes: job.m.questoes.length, criado_em: agora()});
}

async function salvarNoBanco(job) {
  job.fase = 'gravacao';
  if (!cap.db || !cap.assets) throw {message: 'só quem pode editar este artefato grava no banco'};
  const m = job.m, ctx = job.ctx, id = job.idImp;
  atualizar(job, {etapa: 2, estado: 'rodando', mensagem: 'Validando e guardando as imagens…', progresso: 0});
  const questoes = new Array(m.questoes.length);
  let feitas = 0, proxima = 0;
  // 4 questões subindo imagens ao mesmo tempo (lista de 1000 questões: milhares de imagens)
  const guardarUma = async q => {
    const base = job.resultados.get(q.numero);
    const up = await cap.assets.upload(q.imagem, {type: 'image/jpeg'});
    const figuras = [];
    for (const f of q.figuras) figuras.push({nome: f.nome, centralizada: !!f.centralizada, tabela: !!f.tabela, alternativa: f.alternativa || null, deFormula: !!f.deFormula, asset: (await cap.assets.upload(f.blob, {type: 'image/png'})).id});
    const formulas = [];
    // recorte da fórmula só quando a leitura não foi confirmada (é o que um reprocessamento relê)
    for (const f of q.formulas || []) formulas.push({nome: f.nome, latex: f.latex || null, votos: f.votos ?? null, de: f.de ?? null,
      asset: f.latex && (f.votos ?? 0) >= 2 ? null : (await cap.assets.upload(f.blob, {type: 'image/png'})).id});
    // recorte da linha do gabarito: só quando a tabela foi lida do desenho (o texto do PDF é exato) —
    // cada arquivo conta no limite de 5000 do artefato
    const recGab = m.gabaritoPorImagem ? m.gabaritoRecortes?.[nn(q.numero)] : null;
    const gabaritoRecorte = recGab ? (await cap.assets.upload(recGab, {type: 'image/png'})).id : null;
    const final = {...base, imagem: up.id, figuras, formulas, gabaritoRecorte};
    Object.assign(final, validarQuestao(final, {tipo: ctx.tipo, disciplina: ctx.disciplina, topico: ctx.topico}));
    return final;
  };
  await Promise.all(Array.from({length: 4}, async () => {
    while (proxima < m.questoes.length) {
      const i = proxima++;
      questoes[i] = await guardarUma(m.questoes[i]);
      atualizar(job, {progresso: ++feitas / m.questoes.length, mensagem: `Guardando imagens e validando: ${feitas} de ${m.questoes.length} questões…`});
    }
  }));
  const gabaritoImagem = m.paginaGabarito ? (await cap.assets.upload(m.paginaGabarito, {type: 'image/jpeg'})).id : null;
  atualizar(job, {etapa: 3, mensagem: 'Gravando no banco…', progresso: 0.5});
  const tags = [...new Set(questoes.flatMap(q => q.assuntos))];
  const nPartes = Math.ceil(questoes.length / QUESTOES_POR_PARTE);
  for (let k = 0; k < nPartes; k++)
    await cap.db.doc(`partes/${id}-${k}`).set({importacao: id, fatia: id[0], parte: k, questoes: questoes.slice(k * QUESTOES_POR_PARTE, (k + 1) * QUESTOES_POR_PARTE)});
  for (const [pid, parte] of estado.partes)   // reprocessamento com menos questões: some com as partes que sobraram
    if (parte.importacao === id && parte.parte >= nPartes) await cap.db.doc(`partes/${pid}`).delete();
  await cap.db.doc(`importacoes/${id}`).set({arquivo: m.arquivo, hash: m.hash, titulo: m.titulo, tipo: m.tipo,

// Liberar espaço: apaga as imagens que nenhuma questão do banco usa (sobras de listas apagadas ou de
// importações interrompidas), os registros de importação sem questões e os registros de falha de gabarito.
// Nunca toca em imagem de questão que está no banco. Só roda sem lista em processamento.
let liberando = false;
async function liberarEspaco() {
  if (liberando || !cap.assets?.list || !cap.db) return;
  if (estado.jobs.some(j => ['rodando', 'fila', 'parado'].includes(j.estado))) return toast('Espere as listas em processamento terminarem (ou descarte-as) antes de liberar espaço.');
  liberando = true; desenhar();
  try {
    const usadas = new Set();
    for (const parte of estado.partes.values()) for (const q of parte.questoes || []) {
      [q.imagem, q.gabaritoRecorte, ...(q.figuras || []).map(f => f.asset), ...(q.formulas || []).map(f => f.asset)].forEach(id => id && usadas.add(id));
    }
    const comQuestoes = new Set([...estado.partes.values()].map(p => p.importacao));
    for (const [id, imp] of estado.importacoes) if (comQuestoes.has(id) && imp.gabaritoImagem) usadas.add(imp.gabaritoImagem);
    // registros sem questões e falhas antigas de gabarito
    for (const id of [...estado.importacoes.keys()].filter(id => !comQuestoes.has(id))) await cap.db.doc(`importacoes/${id}`).delete().catch(() => {});
    const falhas = await cap.db.collection('falhas').limit(1000).get().catch(() => null);
    for (const d of falhas?.docs || []) await cap.db.doc(`falhas/${d.id}`).delete().catch(() => {});
    const {assets = []} = await cap.assets.list();
    const sobras = assets.filter(a => !usadas.has(a.id));
    let feitas = 0, proxima = 0;
    await Promise.all(Array.from({length: 6}, async () => {
      while (proxima < sobras.length) {
        const a = sobras[proxima++];
        await cap.assets.delete(a.id).catch(() => {});
        if (++feitas % 50 === 0) toast(`Liberando espaço: ${feitas} de ${sobras.length} imagens apagadas…`);
      }
    }));
    toast(`Espaço liberado: ${feitas} imagens sem uso apagadas${usadas.size ? `; ${usadas.size} imagens das questões do banco foram mantidas` : ''}.`);
  } catch (e) { toast(`Não foi possível liberar o espaço: ${e?.message || e?.code || e}`); }
  finally { liberando = false; await medirArmazenamento(); }
}
function liberarJob(job) {
  medirArmazenamento();

  clearInterval(job.contagem);

function resumoLista(l, indice) {
  const qs = (l.questoes || []).map(i => indice.get(i)).filter(Boolean);
  return {total: qs.length, faltando: (l.questoes || []).length - qs.length,
          erros: qs.filter(q => q.erros?.length).length, avisos: qs.filter(q => q.avisos?.length).length};
}

  if (r.avisos) return `<span class="selo alerta">${r.avisos} para revisar</span>`;
  return '<span class="selo ok">Pronta</span>';
}
