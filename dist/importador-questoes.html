  --acento: #2f63e6; --acento-fundo: #e7eeff; --acento-texto: #ffffff;
  --ok: #1f8a55; --ok-fundo: #e2f4ea; --alerta: #a86b00; --alerta-fundo: #fbf0d9;

:root[data-theme="light"] {

  --texto: #181b21; --suave: #5b6270; --fraco: #8a909b;
  --acento: #2f63e6; --acento-fundo: #e7eeff; --acento-texto: #ffffff;

<script>
/* Recorte de uma lista em PDF (modelo Plataforma Assaad) no navegador, com pdf.js.
 * Porta de upq/segmentar.py: usa só a geometria da página (barras "Questão NN",
 * meio da página entre as colunas, rodapé) e as imagens desenhadas nela.
 *
 *   const m = await UPQRecorte.segmentar(arquivo, progresso => ...)
 *   m.questoes[i] = {numero, pagina, coluna, regiao, etapa, textoPdf, imagem: Blob, figuras: [{nome, blob}]}
 */
const UPQRecorte = (() => {
  const ETAPAS = ['Fixação', 'Treinamento', 'Aprofundamento', 'Desafios'];
  const RE_QUESTAO = /^\s*Quest[aã]o\s*(\d[\d ]*)/;
  const MARGEM_TOPO = 30;          // abaixo da faixa de cabeçalho da página (pt)
  const FIGURA_MIN = 30;           // lado mínimo (pt) para uma imagem contar como figura (alternativas em imagem são pequenas)
  const ESCALA = 3;                // render da página: 3 px por pt (≈ 216 dpi)
  const MAX_PX_QUESTAO = 1150000;  // o Claude reduz imagens a ~1,2 MP: o recorte já sai nesse tamanho

  async function hash(buffer) {
    const d = await crypto.subtle.digest('SHA-256', buffer);
    return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Linhas de texto da página, por coluna, em pt com origem no canto superior esquerdo.
  function linhasDaPagina(itens, viewport) {
    const meio = viewport.width / 2;
    const pedacos = [];
    for (const it of itens) {
      if (!it.str) continue;
      const [x, y] = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
      const h = it.height || Math.hypot(it.transform[2], it.transform[3]) || 8;
      pedacos.push({str: it.str, x0: x, x1: x + (it.width || 0), base: y, h, col: x < meio ? 0 : 1});
    }
    pedacos.sort((a, b) => a.col - b.col || a.base - b.base || a.x0 - b.x0);
    const linhas = [];
    for (const p of pedacos) {
      const l = linhas.length && linhas[linhas.length - 1];
      if (l && l.col === p.col && Math.abs(l.base - p.base) < 2.5) l.pedacos.push(p);
      else linhas.push({col: p.col, base: p.base, pedacos: [p]});
    }
    return linhas.map(l => {
      l.pedacos.sort((a, b) => a.x0 - b.x0);
      let texto = '', fim = null;
      for (const p of l.pedacos) {
        if (fim !== null && p.x0 - fim > 1.5 && !texto.endsWith(' ') && !p.str.startsWith(' ')) texto += ' ';
        texto += p.str; fim = p.x1;
      }
      const h = Math.max(...l.pedacos.map(p => p.h));
      return {texto, col: l.col, x0: Math.min(...l.pedacos.map(p => p.x0)), x1: Math.max(...l.pedacos.map(p => p.x1)),
              y0: l.base - h, y1: l.base + h * 0.25, base: l.base};
    });
  }

  // Retângulos (pt) das imagens desenhadas na página, seguindo a matriz de transformação.
  async function imagensDaPagina(page, viewport) {
    const {fnArray, argsArray} = await page.getOperatorList();
    const OPS = pdfjsLib.OPS;
    // Matrizes [a b c d e f] do PDF: mul(m1, m2) aplica m2 e depois m1.
    const mul = (m1, m2) => [m1[0] * m2[0] + m1[2] * m2[1], m1[1] * m2[0] + m1[3] * m2[1],
      m1[0] * m2[2] + m1[2] * m2[3], m1[1] * m2[2] + m1[3] * m2[3],
      m1[0] * m2[4] + m1[2] * m2[5] + m1[4], m1[1] * m2[4] + m1[3] * m2[5] + m1[5]];
    const aplicar = ([x, y], m) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
    let ctm = viewport.transform.slice();
    const pilha = [], rects = [];
    for (let i = 0; i < fnArray.length; i++) {
      const fn = fnArray[i], args = argsArray[i];
      if (fn === OPS.save) pilha.push(ctm.slice());
      else if (fn === OPS.restore) ctm = pilha.pop() || ctm;
      else if (fn === OPS.transform) ctm = mul(ctm, args);
      else if (fn === OPS.paintFormXObjectBegin) { pilha.push(ctm.slice()); if (args && args[0]) ctm = mul(ctm, args[0]); }
      else if (fn === OPS.paintFormXObjectEnd) ctm = pilha.pop() || ctm;
      else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject || fn === OPS.paintJpegXObject) {
        const pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(p => aplicar(p, ctm));
        const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        rects.push({x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys)});
      }
    }
    return rects;
  }

  // A imagem embutida às vezes é maior que a área visível e invade o texto vizinho:
  // corta nas linhas que cruzam a borda de cima ou de baixo (rótulos inteiros dentro ficam).
  // Ordem de leitura das figuras: por faixas horizontais (figuras lado a lado, como alternativas
  // A e B numa mesma linha, ficam da esquerda para a direita), depois de cima para baixo.
  function ordemDeLeitura(figs) {
    figs.sort((a, b) => a.y0 - b.y0);
    const faixas = [];
    for (const f of figs) {
      const u = faixas[faixas.length - 1];
      if (u && f.y0 < u.y1 - 0.5 * Math.min(f.y1 - f.y0, u.y1 - u.y0)) { u.f.push(f); u.y1 = Math.max(u.y1, f.y1); }
      else faixas.push({y1: f.y1, f: [f]});
    }
    figs.splice(0, figs.length, ...faixas.flatMap(u => u.f.sort((a, b) => a.x0 - b.x0)));
    return figs;
  }

  function aparar(f, linhas) {
    const r = {...f};
    for (const t of linhas) {
      if (t.x1 < r.x0 || t.x0 > r.x1) continue;
      if (t.y0 < r.y1 && r.y1 < t.y1) r.y1 = t.y0 - 1;
      else if (t.y0 < r.y0 && r.y0 < t.y1) r.y0 = t.y1 + 1;
    }
    return r;
  }

  async function renderizar(page) {
    const vp = page.getViewport({scale: ESCALA});
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({canvasContext: ctx, viewport: vp}).promise;
    return canvas;
  }

  function recortar(canvas, r, {maxPx = Infinity, tipo = 'image/png', qualidade = 0.88} = {}) {
    const sx = Math.max(0, r.x0 * ESCALA), sy = Math.max(0, r.y0 * ESCALA);
    const sw = Math.min(canvas.width - sx, (r.x1 - r.x0) * ESCALA), sh = Math.min(canvas.height - sy, (r.y1 - r.y0) * ESCALA);
    const fator = Math.min(1, Math.sqrt(maxPx / (sw * sh)));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(sw * fator)); c.height = Math.max(1, Math.round(sh * fator));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return new Promise(res => c.toBlob(res, tipo, qualidade));
  }

  function etapasPeloSumario(paginas) {
    for (const p of paginas) {
      if (!p.linhas.some(l => /Sumário/.test(l.texto))) continue;
      const inicio = {};
      for (const etapa of ETAPAS) {
        const l = p.linhas.find(x => x.texto.trim() === etapa);
        if (!l) continue;
        const num = p.linhas.find(x => /^\s*\d{1,3}\s*$/.test(x.texto) && Math.abs(x.base - l.base) < 6);
        if (num) inicio[etapa] = parseInt(num.texto, 10);
      }
      if (Object.keys(inicio).length) return inicio;
    }
    return {};
  }

  // Tabela de gabarito em texto: "12 C" na mesma linha, ou número e letra em pedaços alinhados.
  // Devolve {pares, caixas}: caixas[NN] = retângulo (pt) da linha da tabela, para o recorte.
  function gabaritoEmTexto(linhas) {
    const pares = {}, caixas = {};
    const nn = n => String(+n).padStart(2, '0');
    const uniao = (a, b) => ({x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0), x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1)});
    const numeros = [], letras = [];
    for (const l of linhas) {
      const t = l.texto.trim();
      let m;
      if ((m = t.match(/^(\d{1,3})\s+([A-E])$/))) { pares[nn(m[1])] = m[2]; caixas[nn(m[1])] = uniao(l, l); }
      else if (/^\d{1,3}$/.test(t)) numeros.push(l);
      else if (/^[A-E]$/.test(t)) letras.push(l);
    }
    for (const n of numeros) {
      const l = letras.filter(x => Math.abs(x.base - n.base) < 3 && x.x0 > n.x1).sort((a, b) => a.x0 - b.x0)[0];
      if (l && !pares[nn(n.texto)]) { pares[nn(n.texto)] = l.texto.trim(); caixas[nn(n.texto)] = uniao(n, l); }
    }
    return {pares, caixas};
  }

  // Quadro de gabarito desenhado como imagem: lê as letras A–E pela forma (sem IA).
  // Funciona com uma ou várias tabelas lado a lado ("Questão | Gabarito"), de qualquer tamanho.
  // A ordem das linhas é conferida pela quantidade de dígitos de cada número (1–9: um; 10+: dois).
  // Devolve {pares: {"01": "C", ...}, motivo} — pares vazio quando não dá para ler com segurança.
  function componentes(canvas, limiar) {
    const W = canvas.width, H = canvas.height;
    const px = canvas.getContext('2d').getImageData(0, 0, W, H).data;
    const tinta = new Uint8Array(W * H);
    for (let i = 0, j = 0; i < tinta.length; i++, j += 4) {
      const mx = Math.max(px[j], px[j + 1], px[j + 2]), mn = Math.min(px[j], px[j + 1], px[j + 2]);
      tinta[i] = mx < limiar && mx - mn < 90 ? 1 : 0;   // escuro e pouco saturado (não o vermelho/azul do layout)
    }
    const rot = new Int32Array(W * H), fila = new Int32Array(W * H), comps = [];
    for (let i = 0; i < tinta.length; i++) {
      if (!tinta[i] || rot[i]) continue;
      const c = {x0: W, y0: H, x1: 0, y1: 0, n: 0, id: comps.length + 1};
      let ini = 0, fim = 0; fila[fim++] = i; rot[i] = c.id;
      while (ini < fim) {
        const k = fila[ini++], x = k % W, y = (k - x) / W;
        c.n++; if (x < c.x0) c.x0 = x; if (x > c.x1) c.x1 = x; if (y < c.y0) c.y0 = y; if (y > c.y1) c.y1 = y;
        if (x > 0 && tinta[k - 1] && !rot[k - 1]) { rot[k - 1] = c.id; fila[fim++] = k - 1; }
        if (x < W - 1 && tinta[k + 1] && !rot[k + 1]) { rot[k + 1] = c.id; fila[fim++] = k + 1; }
        if (y > 0 && tinta[k - W] && !rot[k - W]) { rot[k - W] = c.id; fila[fim++] = k - W; }
        if (y < H - 1 && tinta[k + W] && !rot[k + W]) { rot[k + W] = c.id; fila[fim++] = k + W; }
      }
      comps.push(c);
    }
    return {comps, rot, W, px};
  }

  // retângulo (pt) que cobre o número e a letra de uma linha da tabela
  function caixaDe(num, letra) {
    const g = [...num.g, ...letra.g];
    return {x0: Math.min(...g.map(c => c.x0)) / ESCALA, y0: Math.min(...g.map(c => c.y0)) / ESCALA,
            x1: Math.max(...g.map(c => c.x1)) / ESCALA, y1: Math.max(...g.map(c => c.y1)) / ESCALA};
  }

  function gabaritoNaImagem(canvas, inicio = 1) {
    let melhor = {pares: {}, motivo: 'nenhum quadro de gabarito reconhecido'};
    for (const limiar of [120, 160, 90]) {
      const r = lerQuadro(canvas, limiar, inicio);
      if (Object.keys(r.pares).length) return r;
      if (r.pontos > (melhor.pontos || 0)) melhor = r;
    }
    return melhor;
  }

  function lerQuadro(canvas, limiar, inicio) {
    const {comps, rot, W, px} = componentes(canvas, limiar);
    const glifos = comps.filter(c => { const h = c.y1 - c.y0 + 1, w = c.x1 - c.x0 + 1;
      return h >= ESCALA * 3 && h <= ESCALA * 30 && w <= ESCALA * 30 && w >= 2 && c.n > 12; });
    // linhas: glifos com o centro vertical alinhado
    glifos.sort((a, b) => (a.y0 + a.y1) - (b.y0 + b.y1));
    const linhas = [];
    for (const g of glifos) {
      const yc = (g.y0 + g.y1) / 2, h = g.y1 - g.y0 + 1, l = linhas[linhas.length - 1];
      if (l && Math.abs(yc - l.yc) < 0.45 * Math.max(h, l.h)) { l.g.push(g); l.yc = (l.yc * (l.g.length - 1) + yc) / l.g.length; l.h = Math.max(l.h, h); }
      else linhas.push({yc, h, g: [g]});
    }
    // em cada linha, glifos próximos formam um "item" (o número 12 = dois glifos)
    const linhasQuadro = [];
    for (const l of linhas) {
      l.g.sort((a, b) => a.x0 - b.x0);
      const itens = [];
      for (const g of l.g) {
        const u = itens[itens.length - 1];
        if (u && g.x0 - u.x1 < 0.6 * l.h) { u.g.push(g); u.x1 = Math.max(u.x1, g.x1); } else itens.push({x0: g.x0, x1: g.x1, g: [g]});
      }
      // padrão de linha do quadro: [número, letra] repetido (número: 1–3 glifos; letra: 1 glifo)
      if (itens.length < 2 || itens.length % 2) continue;
      let ok = true;
      for (let i = 0; i < itens.length; i += 2) if (itens[i].g.length > 3 || itens[i + 1].g.length !== 1) ok = false;
      if (ok) linhasQuadro.push(itens);
    }
    if (!linhasQuadro.length) return {pares: {}, motivo: 'nenhuma linha "número | letra" encontrada', pontos: 0};
    // mesma quantidade de tabelas (pares por linha) na maioria das linhas; tabelas em colunas
    const colunas = [];
    for (const itens of linhasQuadro)
      for (let i = 0; i < itens.length; i += 2) {
        const xc = (itens[i].x0 + itens[i + 1].x1) / 2;
        let col = colunas.find(c => Math.abs(c.xc - xc) < ESCALA * 40);
        if (!col) colunas.push(col = {xc, celulas: []});
        col.celulas.push({digitos: itens[i].g.length, largura: itens[i].x1 - itens[i].x0, letra: itens[i + 1].g[0], y: itens[i].g[0].y0, caixa: caixaDe(itens[i], itens[i + 1])});
      }
    colunas.sort((a, b) => a.xc - b.xc);
    const tentativas = [
      colunas.flatMap(c => c.celulas.sort((a, b) => a.y - b.y)),                                   // tabela por tabela
      linhasQuadro.flatMap(itens => itens.filter((_, i) => i % 2 === 0).map((n, k) => ({digitos: n.g.length, largura: n.x1 - n.x0, letra: itens[2 * k + 1].g[0], caixa: caixaDe(n, itens[2 * k + 1])}))),  // linha a linha
    ];
    // números sem zero (1, 2… 10) ou com zero à esquerda (01, 02… 10): as duas formas valem
    // Conferência da ordem pelo número de dígitos: contando os glifos ou, quando dígitos pequenos
    // se grudam, pela largura do número (1–9 têm cerca de metade da largura de 10–99).
    const confere = cel => {
      if (cel.length < 5) return false;   // leitura parcial nunca vale
      const largura = String(inicio + cel.length - 1).length;
      if (cel.every((c, i) => c.digitos === String(inicio + i).length) || cel.every(c => c.digitos === Math.max(2, largura))) return true;
      const ref = cel.filter((c, i) => String(inicio + i).length === largura).map(c => c.largura).sort((a, b) => a - b);
      if (!ref.length) return false;
      const med = ref[Math.floor(ref.length / 2)];
      const padrao = cel.map(c => c.largura / med);
      const semZero = padrao.every((r, i) => String(inicio + i).length < largura ? r > 0.3 && r < 0.75 : r > 0.8 && r < 1.25);
      const comZero = padrao.every(r => r > 0.8 && r < 1.25) && inicio + cel.length - 1 >= 10;
      return semZero || comZero;
    };
    const celulas = tentativas.find(confere);
    if (!celulas) return {pares: {}, motivo: `quadro com ${tentativas[0].length} linhas, mas a numeração não fecha`, pontos: tentativas[0].length};
    const pares = {}, caixas = {};
    for (let i = 0; i < celulas.length; i++) {
      const letra = reconhecerLetra(celulas[i].letra, rot, W, px);
      if (!letra) return {pares: {}, caixas: {}, motivo: `não reconheci a letra da questão ${inicio + i}`, pontos: celulas.length};
      pares[String(inicio + i).padStart(2, '0')] = letra;
      caixas[String(inicio + i).padStart(2, '0')] = celulas[i].caixa;
    }
    return {pares, caixas, motivo: null, pontos: celulas.length};
  }

  // Segundo método, que não depende do tamanho da letra: compara o glifo (em tons de cinza,
  // esticado para uma grade 20×20) com A–E desenhados pelo navegador em várias fontes.
  const GRADE = 20;
  let modelos = null;
  function gradeDe(cinza, w, h) {   // cinza: Float32Array w×h com 0 (fundo) a 1 (tinta)
    const g = new Float32Array(GRADE * GRADE);
    for (let gy = 0; gy < GRADE; gy++) for (let gx = 0; gx < GRADE; gx++) {
      const xa = gx * w / GRADE, xb = (gx + 1) * w / GRADE, ya = gy * h / GRADE, yb = (gy + 1) * h / GRADE;
      let soma = 0, n = 0;
      for (let y = Math.floor(ya); y < Math.ceil(yb); y++) for (let x = Math.floor(xa); x < Math.ceil(xb); x++) { soma += cinza[y * w + x]; n++; }
      g[gy * GRADE + gx] = n ? soma / n : 0;
    }
    const m = g.reduce((a, b) => a + b) / g.length;
    let d = 0; for (let i = 0; i < g.length; i++) { g[i] -= m; d += g[i] * g[i]; }
    d = Math.sqrt(d) || 1; for (let i = 0; i < g.length; i++) g[i] /= d;
    return g;
  }
  function carregarModelos() {
    if (modelos) return modelos;
    modelos = [];
    const c = document.createElement('canvas'); c.width = c.height = 160;
    const ctx = c.getContext('2d', {willReadFrequently: true});
    const fontes = ['Arial', 'Helvetica', 'Inter', 'Montserrat', 'Roboto', 'Segoe UI', 'DejaVu Sans', 'Liberation Sans', 'Verdana', 'sans-serif'];
    for (const f of fontes) for (const peso of ['bold', '600', 'normal']) for (const letra of 'ABCDE') {
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 160, 160); ctx.fillStyle = '#000';
      ctx.font = `${peso} 110px "${f}"`; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText(letra, 80, 84);
      const d = ctx.getImageData(0, 0, 160, 160).data;
      let x0 = 160, y0 = 160, x1 = -1, y1 = -1;
      for (let y = 0; y < 160; y++) for (let x = 0; x < 160; x++) if (d[(y * 160 + x) * 4] < 128) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < 0) continue;
      const w = x1 - x0 + 1, h = y1 - y0 + 1, cinza = new Float32Array(w * h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) cinza[y * w + x] = 1 - d[((y0 + y) * 160 + x0 + x) * 4] / 255;
      modelos.push({letra, g: gradeDe(cinza, w, h)});
    }
    return modelos;
  }
  function letraPorModelo(c, W, px) {
    const w = c.x1 - c.x0 + 1, h = c.y1 - c.y0 + 1, cinza = new Float32Array(w * h);
    let fundo = 0, n = 0;   // cor do fundo: pixels claros em volta da caixa
    for (let x = c.x0; x <= c.x1; x++) for (const y of [c.y0 - 2, c.y1 + 2]) {
      const j = (y * W + x) * 4; if (j >= 0 && j < px.length) { fundo += Math.max(px[j], px[j + 1], px[j + 2]); n++; }
    }
    fundo = n ? fundo / n : 255;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const j = ((c.y0 + y) * W + c.x0 + x) * 4;
      cinza[y * w + x] = Math.max(0, Math.min(1, (fundo - Math.max(px[j], px[j + 1], px[j + 2])) / Math.max(60, fundo - 30)));
    }
    const g = gradeDe(cinza, w, h);
    const melhor = {};
    for (const m of carregarModelos()) {
      let r = 0; for (let i = 0; i < g.length; i++) r += g[i] * m.g[i];
      if (!(m.letra in melhor) || r > melhor[m.letra]) melhor[m.letra] = r;
    }
    const ord = Object.entries(melhor).sort((a, b) => b[1] - a[1]);
    return {letra: ord[0][0], nota: ord[0][1], margem: ord[0][1] - ord[1][1]};
  }
  // Decisão: forma (buracos/hastes) e modelo concordando; se a forma não decidir, o modelo
  // decide sozinho só com folga clara sobre a 2ª letra.
  function reconhecerLetra(c, rot, W, px) {
    const forma = classificarLetra(c, rot, W);
    const modelo = letraPorModelo(c, W, px);
    if (forma && forma === modelo.letra) return forma;
    if (!forma && modelo.nota > 0.6 && modelo.margem > 0.08) return modelo.letra;
    if (forma && modelo.margem < 0.04) return forma;   // modelo indeciso: fica a forma
    return null;
  }

  function classificarLetra(c, rot, W) {
    const w = c.x1 - c.x0 + 1, h = c.y1 - c.y0 + 1;
    const g = (x, y) => rot[(c.y0 + y) * W + c.x0 + x] === c.id;
    // buracos: regiões de fundo da caixa que não tocam a borda
    const visto = new Uint8Array(w * h), pilha = [];
    let buracos = 0;
    for (let y0 = 0; y0 < h; y0++) for (let x0 = 0; x0 < w; x0++) {
      if (g(x0, y0) || visto[y0 * w + x0]) continue;
      let borda = false, area = 0; pilha.push(x0, y0); visto[y0 * w + x0] = 1;
      while (pilha.length) {
        const y = pilha.pop(), x = pilha.pop(); area++;
        if (x === 0 || y === 0 || x === w - 1 || y === h - 1) borda = true;
        for (const [a, b] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]])
          if (a >= 0 && b >= 0 && a < w && b < h && !g(a, b) && !visto[b * w + a]) { visto[b * w + a] = 1; pilha.push(a, b); }
      }
      if (!borda && area > 4) buracos++;
    }
    const largura = y => { let a = -1, b = -1; for (let x = 0; x < w; x++) if (g(x, y)) { if (a < 0) a = x; b = x; } return a < 0 ? 0 : (b - a + 1) / w; };
    const fracao = (ys, xa, xb) => { let n = 0, t = 0; for (const y of ys) for (let x = Math.floor(xa * w); x < Math.ceil(xb * w); x++) { t++; n += g(x, y); } return n / t; };
    const faixa = (a, b) => { const r = []; for (let y = Math.floor(a * h); y <= Math.min(h - 1, Math.floor(b * h)); y++) r.push(y); return r; };
    if (buracos === 2) return 'B';
    if (buracos === 1) {
      const topo = Math.max(...faixa(0, 0.08).map(largura)), base = Math.max(...faixa(0.92, 1).map(largura));
      return topo < 0.6 && base > 0.8 ? 'A' : topo > 0.7 ? 'D' : null;
    }
    if (buracos === 0) {
      const meioDireita = fracao(faixa(0.42, 0.58), 0.55, 0.75);   // braço do meio do E
      const haste = fracao(faixa(0.1, 0.9), 0, 0.12);              // haste vertical cheia do E
      if (meioDireita > 0.3 && haste > 0.9) return 'E';
      if (meioDireita < 0.05) return 'C';
    }
    return null;
  }

  async function segmentar(arquivo, progresso = () => {}) {
    const buffer = arquivo instanceof ArrayBuffer ? arquivo : await arquivo.arrayBuffer();
    const hashPdf = await hash(buffer.slice(0));
    const doc = await pdfjsLib.getDocument({data: new Uint8Array(buffer), isEvalSupported: false}).promise;
    const paginas = [];
    let tituloLista = '';
    for (let pn = 1; pn <= doc.numPages; pn++) {
      progresso({etapa: 'lendo', pagina: pn, total: doc.numPages});
      const page = await doc.getPage(pn);
      const vp = page.getViewport({scale: 1});
      const {items} = await page.getTextContent();
      const linhas = linhasDaPagina(items, vp);
      if (!tituloLista) {
        const t = linhas.find(l => l.texto.startsWith('Lista de Exercícios'));
        if (t) tituloLista = t.texto.split('|').slice(1).join('|').trim();
      }
      const rodape = linhas.filter(l => l.y0 > vp.height * 0.85 && /Plataforma|Assaad/.test(l.texto));
      const fundo = rodape.length ? Math.min(...rodape.map(l => l.y0)) - 8 : vp.height - 30;
      const cabecalhos = linhas.filter(l => l.y0 > MARGEM_TOPO && RE_QUESTAO.test(l.texto))
        .map(l => ({col: l.col, y: l.y0, numero: parseInt(l.texto.match(RE_QUESTAO)[1].replace(/ /g, ''), 10)}));
      paginas.push({pn, page, vp, linhas, fundo, cabecalhos});
    }

    const questoes = [];
    const semQuestao = [];
    for (const p of paginas) {
      if (!p.cabecalhos.length) { semQuestao.push(p); continue; }
      progresso({etapa: 'recortando', pagina: p.pn, total: doc.numPages});
      const canvas = await renderizar(p.page);
      const imagens = (await imagensDaPagina(p.page, p.vp)).filter(r =>
        r.x1 - r.x0 >= FIGURA_MIN && r.y1 - r.y0 >= FIGURA_MIN && r.y0 > MARGEM_TOPO);
      const meio = p.vp.width / 2;
      for (const col of [0, 1]) {
        const naColuna = p.cabecalhos.filter(c => c.col === col).sort((a, b) => a.y - b.y);
        const [x0, x1] = col === 0 ? [0, meio] : [meio, p.vp.width];
        for (let i = 0; i < naColuna.length; i++) {
          const {y, numero} = naColuna[i];
          const yFim = i + 1 < naColuna.length ? naColuna[i + 1].y - 2 : p.fundo - 2;
          const regiao = {x0: x0 + 2, y0: y - 2, x1: x1 - 2, y1: yFim};
          const dentro = imagens.filter(f => {
            const cx = (f.x0 + f.x1) / 2, cy = (f.y0 + f.y1) / 2;
            return cx > regiao.x0 && cx < regiao.x1 && cy > regiao.y0 && cy < regiao.y1;
          });
          ordemDeLeitura(dentro);
          const nn = String(numero).padStart(2, '0');
          const figuras = [];
          for (let k = 0; k < dentro.length; k++) {
            const f = aparar(dentro[k], p.linhas);
            figuras.push({nome: `Q${nn}_fig${k + 1}`, regiao: f, blob: await recortar(canvas, f)});
          }
          const textoPdf = p.linhas.filter(l => l.col === col && (l.y0 + l.y1) / 2 > regiao.y0 && (l.y0 + l.y1) / 2 < regiao.y1)
            .sort((a, b) => a.base - b.base).map(l => l.texto).join('\n');
          questoes.push({numero, pagina: p.pn, coluna: col + 1, regiao, textoPdf, figuras,
            imagem: await recortar(canvas, regiao, {maxPx: MAX_PX_QUESTAO, tipo: 'image/jpeg', qualidade: 0.86})});
        }
      }
    }

    const inicio = etapasPeloSumario(paginas);
    for (const q of questoes) {
      const antes = Object.entries(inicio).filter(([, pg]) => pg <= q.pagina).map(([e]) => e);
      q.etapa = antes.length ? antes[antes.length - 1] : null;
    }
    questoes.sort((a, b) => a.numero - b.numero);
    const numeros = questoes.map(q => q.numero);
    const maior = Math.max(0, ...numeros);
    const faltando = [...Array(maior).keys()].map(i => i + 1).filter(n => !numeros.includes(n));
    const repetidos = [...new Set(numeros.filter((n, i) => numeros.indexOf(n) !== i))];

    const ultima = Math.max(0, ...questoes.map(q => q.pagina));
    // Tabela de gabarito: nas páginas sem questão depois da última questão (pode ocupar mais de
    // uma); em último caso, no fim da página da última questão.
    const candidatas = semQuestao.filter(p => p.pn > ultima);
    const pUltima = paginas.find(p => p.pn === ultima);
    if (pUltima) candidatas.push(pUltima);
    let paginaGabarito = null, gabaritoPdf = {}, gabaritoMotivo = 'nenhuma página de gabarito depois das questões';
    const motivos = [], gabaritoRecortes = {};
    for (const pg of candidatas) {
      const proximo = Object.keys(gabaritoPdf).length + 1;
      let {pares, caixas} = gabaritoEmTexto(pg.linhas);
      const c = await renderizar(pg.page);
      if (!Object.keys(pares).length) {
        const r = gabaritoNaImagem(c, proximo);
        ({pares, caixas = {}} = r);
        if (r.motivo) motivos.push(`página ${pg.pn}: ${r.motivo}`);
      }
      // recorte da linha da tabela de cada questão (número + letra), para conferência
      for (const [n, cx] of Object.entries(caixas)) {
        const h = cx.y1 - cx.y0, mx = Math.max(12, h * 1.2);
        gabaritoRecortes[n] = await recortar(c, {x0: cx.x0 - mx, y0: cx.y0 - h * 0.6, x1: cx.x1 + mx, y1: cx.y1 + h * 0.6});
      }
      if (Object.keys(pares).length || !paginaGabarito)
        paginaGabarito = paginaGabarito && !Object.keys(pares).length ? paginaGabarito
          : await recortar(c, {x0: 0, y0: 0, x1: pg.vp.width, y1: pg.vp.height}, {maxPx: MAX_PX_QUESTAO, tipo: 'image/jpeg'});
      Object.assign(gabaritoPdf, pares);
      if (Object.keys(gabaritoPdf).length >= maior) break;
    }
    const lidas = Object.keys(gabaritoPdf).length;
    const completo = maior > 0 && [...Array(maior).keys()].every(i => gabaritoPdf[String(i + 1).padStart(2, '0')]);
    if (completo) gabaritoMotivo = null;
    else {
      gabaritoMotivo = lidas ? `a tabela tem ${lidas} respostas, a lista tem ${maior} questões` : (motivos.join('; ') || gabaritoMotivo);
      gabaritoPdf = {};
      for (const n of Object.keys(gabaritoRecortes)) delete gabaritoRecortes[n];
    }
    const nome = arquivo.name || 'lista.pdf';
    return {
      arquivo: nome, hash: hashPdf, titulo: tituloLista || nome.replace(/\.pdf$/i, '').replace(/_/g, ' '),
      tipo: /simulado/i.test(nome + ' ' + tituloLista) ? 'simulado' : 'lista',
      etapas: inicio, questoes, faltando, repetidos, paginaGabarito, gabaritoPdf, gabaritoMotivo, gabaritoRecortes, paginas: doc.numPages,
    };
  }

  return {segmentar, gabaritoNaImagem, ETAPAS};
})();

mam ser as alternativas, na ordem A, B, C... Se uma única figura\n   reúne todas as alternativas, coloque-a no fim do enunciado, transcreva em cada alternativa o\n   que estiver legível dela e marque revisar = true.\n7. Não transcreva: número da questão, cabeçalho com banca/ano, letras das alternativas,\n   cabeçalho/rodapé da página, marcas d'água.\n8. Referências (créditos de figura e fontes de texto: \"Fonte: ...\", \"Disponível em: ...\n   Acesso em: ...\", \"Adaptado de ...\") ficam num parágrafo próprio, no ponto onde aparecem,\n   com o texto literal (parênteses inclusive, URL como texto simples), neste formato exato:\n   <p style=\"text-align: right;\"><sub>Fonte: UNICAMP, 2014.<\/sub><\/p>\n\nCABEÇALHO\n- instituicao e ano vêm da barra vermelha \"Questão NN ... BANCA ANO\". Ex.: \"UFMG 2025\" →\n  instituicao \"UFMG\", ano 2025. \"CESMAC MEDICINA 2022/1\" → instituicao \"CESMAC MEDICINA\",\n  ano 2022. \"(ADAPTADO)\" → adaptada true e não entra na instituição. Sem banca → null; sem\n  ano → null. Não confunda com datas citadas no enunciado.\n\nDISCIPLINA, TÓPICO E ASSUNTOS\n- Somente pares que existem no ANEXO — BASE DE TÓPICOS, copiados com a grafia exata.\n  O campo topico recebe o nome do TÓPICO, nunca o do assunto.\n- Em lista de exercícios a mensagem informa a disciplina e o tópico da lista: use-os.\n- assuntos: 1 ou 2 assuntos do tópico escolhido (os que aparecem depois de \"Tópico:\" no\n  anexo), com a grafia exata, pelo conteúdo que a questão cobra. Tópico sem assuntos listados\n  → assuntos = [nome do tópico].\n\nDIFICULDADE (inteiro de 1 a 5, obrigatório)\n1 = Muito Fácil · 2 = Fácil · 3 = Média · 4 = Difícil · 5 = Muito Difícil\n- Referência: aluno de pré-vestibular/ENEM que já estudou o tópico.\n- Pese: quantos conceitos ou etapas a questão encadeia; carga de interpretação; uso de\n  gráfico, tabela ou figura; volume de cálculo; proximidade entre as alternativas; conteúdo\n  além do tópico.\n- Guia: aplicação direta de um conceito ou fórmula → // Markdown + LaTeX: guarda as fórmulas antes do Markdown para não perder _ e * dentro delas.
function md(texto, figuras = {}) {
  const guardadas = [];
  const t = String(texto || '').replace(/\\\$/g, '\u0001')
    .replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => { guardadas.push(m); return `\u0002${guardadas.length - 1}\u0002`; })
    .replace(/\(figura:([A-Za-z0-9_]+)\)/g, (m, n) => `(${figuras[n] || ''})`);
  const html = window.marked ? marked.parse(t) : `<p>${esc(t)}</p>`;
  return html.replace(/\u0002(\d+)\u0002/g, (m, i) => esc(guardadas[+i])).replace(/\u0001/g, '\\$');
}
function tipografar(el) {
  if (window.MathJax?.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});

// ============================================================ validação (porta de upq/validar.py)
const RE_MATH = /\$\$[\s\S]+?\$\$|\$[^$]+?\$/g;
const RE_FIG = /!\[[^\]]*\]\(figura:([A-Za-z0-9_]+)\)/g;
const UNICODE_MAT = '²³¹⁰⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉√≤≥≠±×÷∞∫∑πΔ≈';
const semAcento = s => s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function checarLatex(campo, texto, erros, avisos) {
  const limpo = texto.replace(/\\\$/g, '');
  if ((limpo.match(/\$/g) || []).length % 2) erros.push(`${campo}: quantidade ímpar de "$" (fórmula aberta ou R$ sem escape)`);
  if (/R\$\s?\d/.test(limpo)) erros.push(`${campo}: "R$" sem escape (use R\\$)`);
  for (const f of limpo.match(RE_MATH) || []) {
    if ((f.match(/\{/g) || []).length !== (f.match(/\}/g) || []).length) erros.push(`${campo}: chaves desbalanceadas em ${f.slice(0, 40)}`);
    for (const p of ['\\ce{', '\\SI{', '\\usepackage']) if (f.includes(p)) erros.push(`${campo}: comando não suportado ${p}`);
  }
  const fora = limpo.replace(RE_MATH, ' ');
  const achados = [...new Set([...fora].filter(c => UNICODE_MAT.includes(c)))];
  if (achados.length) avisos.push(`${campo}: símbolo fora de LaTeX (${achados.join(' ')})`);
}
function conferirComPdf(textoPdf, transcrito) {
  const avisos = [];
  const corpo = String(textoPdf || '').split('\n').slice(1).filter(l => !/^\s*\(?(Fonte|Disponível em)/.test(l)).join('\n');
  const digitos = transcrito.replace(/\D/g, '');
  const faltam = [...new Set((corpo.replace(/\./g, '').match(/\d+/g) || []).filter(n => n.length >= 2 && !digitos.includes(n)))];
  if (faltam.length) avisos.push(`números do PDF ausentes na transcrição: ${faltam.join(', ')}`);
  const palavras = new Set(semAcento(corpo).match(/[a-z]{5,}/g) || []);
  if (palavras.size) {
    const t = semAcento(transcrito);
    const cob = [...palavras].filter(w => t.includes(w)).length / palavras.size;
    if (cob < 0.85) avisos.push(`só ${Math.round(cob * 100)}% das palavras do PDF aparecem na transcrição (trecho cortado?)`);
  }
  return avisos;
}
function validarQuestao(q, lista) {
  const erros = [], avisos = [];
  const assuntosBase = BASE.get(q.disciplina + '\u0000' + q.topico);
  if (!assuntosBase) erros.push(`par fora da base de tópicos: ${q.disciplina} / ${q.topico}`);
  if (lista?.tipo === 'lista' && lista.disciplina && (q.disciplina !== lista.disciplina || q.topico !== lista.topico)) erros.push('disciplina/tópico diferente do resto da lista');
  const validos = assuntosBase && assuntosBase.length ? assuntosBase : [q.topico];
  if (!q.assuntos?.length) erros.push('sem assunto');
  for (const a of q.assuntos || []) if (!validos.includes(a)) erros.push(`assunto fora da base para ${q.topico}: ${a}`);
  const letras = Object.keys(q.alternativas || {});
  if (letras.join('') !== 'ABCDE'.slice(0, letras.length) || letras.length < 2) erros.push(`alternativas fora de ordem ou insuficientes: ${letras.join(', ')}`);
  if (!q.gabarito) erros.push('sem gabarito: a tabela do fim da lista não foi lida (preencha na edição)');
  else if (!letras.includes(q.gabarito)) erros.push(`gabarito ${q.gabarito} não está entre as alternativas`);
  for (const [l, t] of Object.entries(q.alternativas || {})) {
    if (!String(t).trim()) erros.push(`alternativa ${l} vazia`);
    else if (/^\(?[a-eA-E][).]\s/.test(t)) avisos.push(`alternativa ${l} parece começar com a letra`);
  }
  const faixa = FAIXA_ETAPA[q.etapa];
  if (faixa && !(faixa[0] <= q.dificuldade && q.dificuldade <= faixa[1])) avisos.push(`dificuldade ${q.dificuldade} fora da faixa ${faixa[0]}–${faixa[1]} de ${q.etapa}`);
  const campos = {enunciado: q.enunciado, ...Object.fromEntries(Object.entries(q.alternativas || {}).map(([k, v]) => [`alternativa ${k}`, v]))};
  for (const [nome, texto] of Object.entries(campos)) checarLatex(nome, String(texto || ''), erros, avisos);
  const nomes = new Set((q.figuras || []).map(f => f.nome));
  const usadas = new Set(Object.values(campos).flatMap(t => [...String(t || '').matchAll(RE_FIG)].map(m => m[1])));
  const inexistentes = [...usadas].filter(n => !nomes.has(n));
  if (inexistentes.length) erros.push(`figura inexistente referenciada: ${inexistentes.join(', ')}`);
  const sobras = [...nomes].filter(n => !usadas.has(n));
  if (sobras.length) avisos.push(`figura recortada mas não usada no texto: ${sobras.join(', ')}`);
  avisos.push(...conferirComPdf(q.textoPdf, [q.enunciado, ...Object.values(q.alternativas || {})].join('\n')));
  if (q.revisar && !q.revisada) avisos.unshift(`IA pediu revisão: ${q.observacoes || '(sem motivo)'}`);
  if (q.revisada) return {erros, avisos: []};
  return {erros, avisos};
}

- Texto extraído do PDF (${comImagens() ? 'apoio; contém erros de símbolos — confira na imagem' : 'fonte desta transcrição; corrija os erros de símbolos'}):
<<<

>>>${q.correcao ? `
- ATENÇÃO, NOVA TENTATIVA: a transcrição anterior desta questão foi rejeitada pela validação por:

  Assuntos válidos deste tópico (escolha 1 ou 2, grafia exata): ${q.assuntosValidos.join('; ')}` : ''}` : ''}`;
  }).join('\n\n');
  const fixos = ctx.disciplina ? `\nDisciplina e tópico da lista (use exatamente): ${ctx.disciplina} / ${ctx.topico}` : '';

${blocos}

Responda somente com JSON, um objeto por questão e na mesma ordem:

  "assuntos": ["..."], "dificuldade": 2, "enunciado": "Markdown com LaTeX", "alternativas": [{"letra": "A", "texto": "..."}],
  "gabarito": "A", "revisar": false, "observacoes": null}]}`;
}
// Referências (créditos de figura, fontes de texto): parágrafo próprio, à direita, em subscrito.
// Mesmo formato de upq/referencias.py; aplicado pelo código para sair sempre igual.
const REF_ABRE = '<p style="text-align: right;"><sub>', REF_FECHA = '</sub></p>';
const REF_INICIO = /^\(?\s*(fontes?\s*(\([^)]*\)\s*)?:|dispon[ií]vel em|adaptad[oa] de|texto adaptado|extra[ií]d[oa] d[eo]|retirad[oa] d[eo]|imagem dispon[ií]vel|foto:|ilustra[cç][aã]o:|cr[eé]dito)/i;
const REF_MEIO = /acesso em\s*:|dispon[ií]vel em\s*:/i;
function eReferencia(p) {
  const t = p.trim().replace(/^[*_]+|[*_]+$/g, '').trim();
  if (!t || /^(<p|!|\||\$\$)/.test(t) || t.includes('$')) return false;
  return REF_INICIO.test(t) || (t.length < 500 && REF_MEIO.test(t));
}
function limparReferencia(p) {
  let t = p.trim(), m;
  while ((m = t.match(/^(\*{1,3}|_{1,3})([\s\S]+?)\1$/))) t = m[2].trim();
  t = t.replace(/<(https?:\/\/[^>\s]+)>/g, '$1').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '$1');
  return t.replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function formatarReferencias(texto) {
  if (!texto) return texto;
  const partes = texto.split(/(\n\s*\n)/);
  for (let i = 0; i < partes.length; i += 2)
    if (eReferencia(partes[i])) partes[i] = partes[i].match(/^\s*/)[0] + REF_ABRE + limparReferencia(partes[i]) + REF_FECHA;
  return partes.join('');
}

// Linha em branco antes e depois de toda tabela Markdown (igual a upq/referencias.py).
function separarTabelas(texto) {
  if (!texto) return texto;
  const saida = [];
  for (const l of texto.split('\n')) {
    const tab = l.trim().startsWith('|'), ant = saida.length ? saida[saida.length - 1].trim() : '';
    if ((tab && ant && !ant.startsWith('|')) || (!tab && l.trim() && ant.startsWith('|'))) saida.push('');
    saida.push(l);
  }
  return saida.join('\n');
}
const normalizarTexto = t => separarTabelas(formatarReferencias(t));

function normalizarIA(r, q, ctx) {
  const alternativas = {};
  for (const a of r.alternativas || []) { const l = String(a.letra || '').trim().toUpperCase(); if (/^[A-E]$/.test(l)) alternativas[l] = normalizarTexto(String(a.texto ?? '').trim()); }
  // O gabarito é sempre o da tabela do PDF; a letra que a IA devolver é ignorada.
  const oficial = ctx.gabarito[nn(q.numero)];
  const obs = [r.observacoes].filter(Boolean);
  const instituicao = r.instituicao ? String(r.instituicao).trim() : null;
  const ano = Number.isInteger(+r.ano) && +r.ano > 1900 ? +r.ano : null;
  return {
    numero: q.numero, titulo: titulo(ctx.tipo, ctx.titulo, q.numero, instituicao, ano, ctx.simulado),
    instituicao, ano, disciplina: ctx.disciplina || String(r.disciplina || ''), topico: ctx.topico || String(r.topico || ''),
    assuntos: (Array.isArray(r.assuntos) ? r.assuntos : [r.assuntos]).filter(Boolean).map(String).slice(0, 2),
    etapa: q.etapa, dificuldade: Math.min(5, Math.max(1, Math.round(+r.dificuldade) || 3)),
    enunciado: normalizarTexto(String(r.enunciado || '').trim()), alternativas, gabarito: oficial || '',
    pagina: q.pagina, textoPdf: q.textoPdf, revisar: !!r.revisar || !oficial,
    observacoes: [...obs, ...(oficial ? [] : ['gabarito não encontrado na tabela do PDF: preencha na edição'])].join('; ') || null, revisada: false,
  };
}

// ============================================================ reprocessamento de questões com erro
// Toda questão com erro é reprocessada primeiro (recorte guardado + lista dos erros para a IA
// corrigir). "Sem gabarito" não se resolve assim: o gabarito vem só da tabela.
const errosReprocessaveis = q => (q.erros || []).filter(e => !/^sem gabarito/.test(e));
function comCorrecao(q, erros, ctx) {
  const assuntosValidos = erros.some(e => /assunto/.test(e)) ? (BASE.get(ctx.disciplina + '\u0000' + ctx.topico) || null) : null;
  return {...q, correcao: erros, assuntosValidos};
}
// Uma rodada: devolve Map numero → questão nova, só quando a nova tem menos erros que a anterior.
async function rodadaCorrecao(itens, ctx, aoAvancar = () => {}) {
  const melhores = new Map(), porLote = porChamada();
  for (let i = 0; i < itens.length; i += porLote) {
    const lote = itens.slice(i, i + porLote);
    const r = await perguntar(promptLote(lote.map(x => comCorrecao(x.q, x.erros, ctx)), ctx), comImagens() ? {images: lote.map(x => x.imagem)} : {});
    const lista = Array.isArray(r?.questoes) ? r.questoes : [];
    lote.forEach((x, k) => {
      const achada = lista.find(y => +y.numero === x.q.numero) || (lista.length === lote.length ? lista[k] : null);
      if (!achada || !String(achada.enunciado || '').trim()) return;
      const nova = {...x.manter, ...normalizarIA(achada, x.q, ctx), ...x.manter};
      Object.assign(nova, validarQuestao(nova, {tipo: ctx.tipo, disciplina: ctx.disciplina, topico: ctx.topico}));
      if (nova.erros.length < x.erros.length) melhores.set(x.q.numero, nova);
    });
    aoAvancar(Math.min(i + porLote, itens.length), itens.length);
  }
  return melhores;
}
// Durante a importação: valida o que veio do Claude e reprocessa as questões com erro.
async function corrigirComErro(job) {
  const ctx = job.ctx, itens = [];
  for (const q of job.m.questoes) {
    const r = job.resultados.get(q.numero);
    if (!r) continue;
    const v = validarQuestao({...r, figuras: q.figuras.map(f => ({nome: f.nome}))}, {tipo: ctx.tipo, disciplina: ctx.disciplina, topico: ctx.topico});
    const erros = errosReprocessaveis(v);
    if (erros.length) itens.push({q, erros, imagem: q.imagem, manter: {figuras: q.figuras.map(f => ({nome: f.nome}))}});
  }
  job.reprocessadas = 0; job.corrigidas = 0;
  if (!itens.length) return;
  atualizar(job, {etapa: 2, estado: 'rodando', progresso: 0, mensagem: `Reprocessando ${itens.length} questão(ões) com erro…`});
  try {
    const melhores = await rodadaCorrecao(itens, ctx, (f, t) => atualizar(job, {progresso: f / t, mensagem: `Reprocessando questões com erro: ${f} de ${t}…`}));
    for (const [n, nova] of melhores) { const {figuras, erros, avisos, ...resto} = nova; job.resultados.set(n, resto); }
    job.reprocessadas = itens.length; job.corrigidas = melhores.size;
  } catch (e) { console.warn('reprocessamento adiado', e); job.reprocessadas = 0; }
}
// Questões já no banco: baixa o recorte guardado e reprocessa.
async function baixarImagem(id) {
  try { const r = await fetch(blobUrl(id)); if (r.ok) return await r.blob(); } catch {}
  const img = new Image(); img.src = blobUrl(id); await img.decode();
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
}
let reprocessando = false;
async function reprocessarQuestoes(qs) {
  if (reprocessando || !qs.length) return;
  if (!cap.sample) return toast('O Claude não está disponível nesta visualização.');
  reprocessando = true; desenhar();
  let corrigidas = 0, feitas = 0;
  try {
    const porImp = new Map();
    for (const q of qs) { if (!porImp.has(q.origem)) porImp.set(q.origem, []); porImp.get(q.origem).push(q); }
    for (const [idImp, grupo] of porImp) {
      const imp = estado.importacoes.get(idImp);
      if (!imp) continue;
      const ctx = {titulo: imp.titulo, tipo: imp.tipo, gabarito: imp.gabarito || {}, disciplina: imp.disciplina, topico: imp.topico,
        simulado: imp.tipo === 'simulado' ? dadosSimulado(imp.arquivo) : null};
      const itens = [];
      for (const q of grupo) itens.push({q, erros: errosReprocessaveis(q), imagem: comImagens() ? await baixarImagem(q.imagem) : null,
        manter: {imagem: q.imagem, figuras: q.figuras, gabaritoRecorte: q.gabaritoRecorte || null}});
      const melhores = await rodadaCorrecao(itens, ctx, (f) => toast(`Reprocessando: ${feitas + f} de ${qs.length}…`));
      feitas += grupo.length;
      const porParte = new Map();
      for (const q of grupo) if (melhores.has(q.numero)) { if (!porParte.has(q.parte_id)) porParte.set(q.parte_id, []); porParte.get(q.parte_id).push(melhores.get(q.numero)); }
      for (const [pid, novas] of porParte) {
        const parte = estado.partes.get(pid);
        const questoes = parte.questoes.map(x => { const n = novas.find(y => y.numero === x.numero); return n ? {...n, revisada: false} : x; });
        await cap.db.doc(`partes/${pid}`).set({...parte, questoes});
        corrigidas += novas.length;
      }
    }
    toast(`Reprocessamento concluído: ${corrigidas} de ${qs.length} questão(ões) corrigida(s).${corrigidas < qs.length ? ' As demais continuam com erro para revisão.' : ''}`);
  } catch (e) {
    toast(e?.code === 'rate_limited' ? 'Limite de uso do Claude atingido. Tente de novo em alguns minutos.' : `Reprocessamento parou: ${e?.message || e?.code || e}`);
  } finally { reprocessando = false; desenhar(); }
}

// ============================================================ processamento de um PDF
function novoJob(arquivo) {
  const job = {id: 'j' + Date.now() + Math.random().toString(36).slice(2, 6), arquivo: arquivo.name, file: arquivo,
    etapa: 0, estado: 'rodando', mensagem: 'Lendo o PDF…', progresso: 0, m: null, ctx: null, resultados: new Map(), pendentes: []};
  estado.jobs.unshift(job);
  return job;
}
function atualizar(job, campos) { Object.assign(job, campos); if (tela.nome === 'enviar') desenharEnvios(); }

async function processar(job, {reprocessar = false} = {}) {
  try {
    if (!job.m) {
      atualizar(job, {etapa: 0, estado: 'rodando', mensagem: 'Recortando questões e figuras…', progresso: 0});
      await pdfjsPronto;
      job.m = await UPQRecorte.segmentar(job.file, p => atualizar(job, {mensagem: p.etapa === 'lendo' ? `Lendo a página ${p.pagina} de ${p.total}…` : `Recortando a página ${p.pagina} de ${p.total}…`, progresso: p.pagina / p.total}));
      if (!job.m.questoes.length) return atualizar(job, {estado: 'falhou', mensagem: 'Nenhuma barra "Questão NN" encontrada. Este PDF segue outro modelo de lista.'});
      job.idImp = job.m.hash.slice(0, 16);
      if (estado.importacoes.has(job.idImp) && !reprocessar)
        return atualizar(job, {estado: 'duplicado', mensagem: `Esta lista já está no banco (${job.m.questoes.length} questões). Reprocessar substitui a transcrição.`});
    }
    const m = job.m;
    if (!job.ctx) {
      atualizar(job, {etapa: 1, estado: 'rodando', progresso: 0, mensagem: `${m.questoes.length} questões recortadas. Lendo o gabarito e classificando a lista…`});
      // Gabarito obrigatório e sempre da tabela do fim da lista: lido no navegador; se não der,
      // o Claude lê a imagem da tabela; se ainda faltar, a lista para aqui (nada é transcrito).
      const completo = g => m.questoes.every(q => g[nn(q.numero)]);
      let gabarito = m.gabaritoPdf, origem = 'tabela do PDF';
      if (!completo(gabarito) && m.paginaGabarito && comImagens()) {
        atualizar(job, {mensagem: 'Lendo a tabela de gabarito com o Claude…'});
        gabarito = await lerGabarito(m.paginaGabarito).catch(() => ({}));
        origem = 'tabela do PDF (lida pelo Claude)';
      }
      if (!completo(gabarito)) {
        const faltam = m.questoes.filter(q => !gabarito[nn(q.numero)]).map(q => nn(q.numero));
        const motivo = m.gabaritoMotivo || `faltam as questões ${faltam.join(', ')}`;
        guardarFalhaGabarito(job, motivo).catch(() => {});
        return atualizar(job, {estado: 'gabarito', mensagem: `Não consegui ler a tabela de gabarito automaticamente (${motivo}). A lista não foi processada e nada foi enviado ao Claude.`});
      }
      const classe = m.tipo === 'lista' ? await classificar(m) : null;
      job.ctx = {titulo: m.titulo, tipo: m.tipo, gabarito, gabaritoOrigem: origem, disciplina: classe?.disciplina || null, topico: classe?.topico || null,
                 classificacao: classe, simulado: m.tipo === 'simulado' ? dadosSimulado(m.arquivo) : null};
      const porLote = porChamada();
      job.pendentes = [];
      for (let i = 0; i < m.questoes.length; i += porLote) job.pendentes.push({questoes: m.questoes.slice(i, i + porLote), tentativas: 0});
    }
    await transcreverPendentes(job);
    if (job.pendentes.length) return;   // parou: o botão "Continuar" retoma
    await corrigirComErro(job);
    await salvarNoBanco(job);
  } catch (e) {
    console.error(e);
    pararComErro(job, e);
  }
}

function pararComErro(job, e) {
  const codigo = e?.code;
  const msgs = {
    not_granted: 'O uso do Claude não foi permitido neste artefato. Recarregue a página e permita para continuar.',
    rate_limited: 'Limite de uso do Claude atingido por agora. Espere alguns minutos e clique em Continuar.',
    session_expired: 'Sua sessão expirou. Entre de novo no claude.ai e clique em Continuar.',
    images_unavailable: 'Esta visualização não consegue enviar imagens ao Claude. Abra o artefato no claude.ai pelo navegador.',
    sem_claude: 'O Claude não está disponível nesta visualização. Abra o artefato no claude.ai.',
  };
  atualizar(job, {estado: 'parado', mensagem: msgs[codigo] || `Parou: ${e?.message || codigo || e}. Clique em Continuar para tentar de novo.`});
}

async function transcreverPendentes(job) {
  const total = job.m.questoes.length;
  atualizar(job, {etapa: 1, estado: 'rodando', mensagem: `Transcrevendo com o Claude: ${job.resultados.size} de ${total} questões…`, progresso: job.resultados.size / total});
  let erroFatal = null;
  const trabalhador = async () => {
    while (job.pendentes.length && !erroFatal) {
      const lote = job.pendentes.shift();
      try {
        const r = await perguntar(promptLote(lote.questoes, job.ctx), comImagens() ? {images: lote.questoes.map(q => q.imagem)} : {});
        const lista = Array.isArray(r?.questoes) ? r.questoes : [];
        lote.questoes.forEach((q, i) => {
          const achada = lista.find(x => +x.numero === q.numero) || (lista.length === lote.questoes.length ? lista[i] : null);
          if (achada && String(achada.enunciado || '').trim()) job.resultados.set(q.numero, normalizarIA(achada, q, job.ctx));
        });
        const faltaram = lote.questoes.filter(q => !job.resultados.has(q.numero));
        if (faltaram.length && lote.tentativas < 1) job.pendentes.push({questoes: faltaram, tentativas: lote.tentativas + 1});
        else if (faltaram.length) { job.pendentes.unshift({questoes: faltaram, tentativas: 0}); erroFatal = {message: `a IA não devolveu as questões ${faltaram.map(q => nn(q.numero)).join(', ')}`}; }
      } catch (e) {
        const transitorio = ['invalid_json', 'upstream_error', 'empty_completion'].includes(e?.code);
        if (transitorio && lote.tentativas < 1) job.pendentes.push({...lote, tentativas: lote.tentativas + 1});
        else { job.pendentes.unshift({...lote, tentativas: 0}); erroFatal = e; }
      }
      atualizar(job, {mensagem: `Transcrevendo com o Claude: ${job.resultados.size} de ${total} questões…`, progresso: job.resultados.size / total});
    }
  };
  await Promise.all(Array.from({length: SIMULTANEAS}, trabalhador));
  if (erroFatal) throw erroFatal;
}

// Tabela que o leitor não conseguiu ler: guarda a página e o motivo (coleção "falhas") para
// ajustar o leitor sem precisar do PDF.
async function guardarFalhaGabarito(job, motivo) {
  if (!cap.db || !cap.assets || job.falhaGuardada) return;
  job.falhaGuardada = true;
  const imagem = job.m.paginaGabarito ? (await cap.assets.upload(job.m.paginaGabarito, {type: 'image/jpeg'})).id : null;
  await cap.db.doc(`falhas/${job.idImp}`).set({arquivo: job.m.arquivo, hash: job.m.hash, motivo, gabaritoImagem: imagem,
    questoes: job.m.questoes.length, criado_em: agora()});
}

async function salvarNoBanco(job) {
  if (!cap.db || !cap.assets) throw {message: 'só quem pode editar este artefato grava no banco'};
  const m = job.m, ctx = job.ctx, id = job.idImp;
  atualizar(job, {etapa: 2, estado: 'rodando', mensagem: 'Validando e guardando as imagens…', progresso: 0});
  const questoes = [];
  let feitas = 0;
  for (const q of m.questoes) {
    const base = job.resultados.get(q.numero);
    const up = await cap.assets.upload(q.imagem, {type: 'image/jpeg'});
    const figuras = [];
    for (const f of q.figuras) figuras.push({nome: f.nome, asset: (await cap.assets.upload(f.blob, {type: 'image/png'})).id});
    const recGab = m.gabaritoRecortes?.[nn(q.numero)];
    const gabaritoRecorte = recGab ? (await cap.assets.upload(recGab, {type: 'image/png'})).id : null;
    const final = {...base, imagem: up.id, figuras, gabaritoRecorte};
    Object.assign(final, validarQuestao(final, {tipo: ctx.tipo, disciplina: ctx.disciplina, topico: ctx.topico}));
    questoes.push(final);
    atualizar(job, {progresso: ++feitas / m.questoes.length});
  }
  const gabaritoImagem = m.paginaGabarito ? (await cap.assets.upload(m.paginaGabarito, {type: 'image/jpeg'})).id : null;
  atualizar(job, {etapa: 3, mensagem: 'Gravando no banco…', progresso: 0.5});
  const tags = [...new Set(questoes.flatMap(q => q.assuntos))];
  const nPartes = Math.ceil(questoes.length / QUESTOES_POR_PARTE);
  for (let k = 0; k < nPartes; k++)
    await cap.db.doc(`partes/${id}-${k}`).set({importacao: id, fatia: id[0], parte: k, questoes: questoes.slice(k * QUESTOES_POR_PARTE, (k + 1) * QUESTOES_POR_PARTE)});
  for (const [pid, parte] of estado.partes)   // reprocessamento com menos questões: some com as partes que sobraram
    if (parte.importacao === id && parte.parte >= nPartes) await cap.db.doc(`partes/${pid}`).delete();
  await cap.db.doc(`importacoes/${id}`).set({arquivo: m.arquivo, hash: m.hash, titulo: m.titulo, tipo: m.tipo,
    disciplina: ctx.disciplina, topico: ctx.topico, tags, total: questoes.length, etapas: m.etapas, gabarito: ctx.gabarito, gabaritoOrigem: ctx.gabaritoOrigem, gabaritoImagem,
    classificacao: ctx.classificacao, criado_em: estado.importacoes.get(id)?.criado_em || agora(), atualizado_em: agora()});
  const padrao = [...estado.listas.entries()].find(([, l]) => l.origem === id);
  const listaId = padrao ? padrao[0] : id;
  await cap.db.doc(`listas/${listaId}`).set({...(padrao?.[1] || {}), nome: `Lista de ${m.titulo}`, descricao: `Lista completa de ${m.titulo}`,
    disciplina: ctx.disciplina, topico: ctx.topico, tags, origem: id, questoes: questoes.map(q => `${id}:${nn(q.numero)}`),
    status: padrao?.[1]?.status || 'rascunho', criado_em: padrao?.[1]?.criado_em || agora(), atualizado_em: agora()});
  const erros = questoes.filter(q => q.erros.length).length, avisos = questoes.filter(q => q.avisos.length).length;
  atualizar(job, {estado: 'concluido', progresso: 1, lista: listaId,
    mensagem: `${questoes.length} questões no banco · ${erros} com erro e ${avisos} para revisar.` + (job.reprocessadas ? ` ${job.corrigidas} de ${job.reprocessadas} com erro foram corrigidas no reprocessamento automático.` : '')});
}

let pdfjsPronto = new Promise(r => window.pdfjsLib ? r() : window.addEventListener('pdfjs-pronto', r, {once: true}));

// ============================================================ telas
const tela = {nome: 'enviar', lista: null, questaoBanco: null};
const FILTRO_VAZIO = {busca: '', disciplina: '', topico: '', assunto: '', instituicao: '', ano: '', dificuldade: '', situacao: ''};
const filtroBanco = {...FILTRO_VAZIO}, filtroBusca = {...FILTRO_VAZIO};
const selecionadas = new Set();
let criandoLista = false, confirmandoExclusao = false, confirmandoExclusaoQ = false, confirmandoExclusaoL = false, excluindo = false;
const listasSelecionadas = new Set();
const principal = document.getElementById('principal');
document.querySelectorAll('.nav').forEach(b => b.addEventListener('click', () => ir(b.dataset.tela)));
function ir(nome, extra = {}) { Object.assign(tela, {nome, ...extra}); confirmandoExclusao = confirmandoExclusaoQ = confirmandoExclusaoL = false; desenhar(); window.scrollTo(0, 0); }

function situacaoQuestao(q) { return q.erros?.length ? 'erro' : q.avisos?.length ? 'revisar' : 'ok'; }
function seloQuestao(q) {
  const s = situacaoQuestao(q);
  return s === 'erro' ? '<span class="selo erro">erro</span>' : s === 'revisar' ? '<span class="selo alerta">revisar</span>' : '';
}
function desenhar() {
  const ativa = tela.nome === 'lista' ? 'listas' : tela.nome;
  document.querySelectorAll('.nav').forEach(b => b.setAttribute('aria-current', b.dataset.tela === ativa ? 'page' : 'false'));
  const qs = banco();
  document.getElementById('contagem-banco').textContent = qs.length || '';
  document.getElementById('contagem-listas').textContent = estado.listas.size || '';
  document.getElementById('modo').textContent = !cap.prontas ? 'Conectando…'
    : !cap.db ? 'Abra este artefato no claude.ai para usar o banco.'
    : `${estado.importacoes.size} lista(s) importada(s) · dados guardados neste artefato`;
  if (tela.nome === 'enviar') telaEnviar();
  else if (tela.nome === 'banco') telaBanco(qs);
  else if (tela.nome === 'listas') telaListas(qs);
  else telaGerenciar(qs);
}

// ---------------- Enviar lista
function telaEnviar() {
  const semClaude = cap.prontas && !cap.sample;
  const soTexto = cap.prontas && cap.sample && !comImagens();
  const semGravar = cap.prontas && (!cap.db || !cap.assets);
  const bloqueado = !cap.prontas || semClaude || semGravar;
  principal.innerHTML = `
    <div class="cab"><h1>Enviar lista</h1></div>
    ${!cap.prontas ? '<div class="aviso-topo info">Conectando ao claude.ai…</div>' : ''}
    ${semClaude ? `<div class="aviso-topo">O Claude não respondeu nesta visualização (capacidade de IA ${window.claude?.use ? 'recusada ou indisponível' : 'ausente: a página não está dentro do claude.ai'}). Abra o artefato em claude.ai no navegador (Chrome/Edge), entre na sua conta e recarregue a página.</div>` : ''}
    ${soTexto ? '<div class="aviso-topo info">Esta visualização não envia imagens ao Claude: a transcrição usa o texto do PDF (símbolos corrigidos pela IA) e marca para revisão o que ficar incerto. Para a leitura pela imagem, que é mais fiel, abra o artefato em claude.ai no navegador.</div>' : ''}
    ${!semClaude && semGravar ? '<div class="aviso-topo">Você pode ver o banco, mas só quem pode editar este artefato envia listas.</div>' : ''}
    <label class="soltar ${bloqueado ? 'desligado' : ''}" id="soltar" for="arquivo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 18v-6m0 0-2.5 2.5M12 12l2.5 2.5"/></svg>
      <strong>Arraste os PDFs das listas para cá</strong>
      <p>ou clique para escolher · as listas são processadas uma de cada vez</p>
      <input type="file" id="arquivo" accept="application/pdf,.pdf" multiple hidden ${bloqueado ? 'disabled' : ''}>
    </label>
    <p class="dica">O PDF é recortado aqui no navegador. As questões vão ao Claude em lotes de ${porChamada()} para transcrição (LaTeX, formatação) e classificação, usando o seu plano do claude.ai. Depois entram no banco, junto com a lista do PDF. Uma lista de 30 questões leva alguns minutos; mantenha esta aba aberta enquanto processa.</p>
    <div class="envios" id="envios"></div>`;
  const zona = document.getElementById('soltar'), input = document.getElementById('arquivo');
  input.addEventListener('change', () => { receber(input.files); input.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); if (!bloqueado) zona.classList.add('ativo'); }));
  ['dragleave', 'drop'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.remove('ativo'); }));
  zona.addEventListener('drop', e => { if (!bloqueado) receber(e.dataTransfer.files); });
  desenharEnvios();
}
function desenharEnvios() {
  const alvo = document.getElementById('envios');
  if (!alvo) return;
  alvo.innerHTML = estado.jobs.map(cartaoEnvio).join('');
  alvo.querySelectorAll('[data-acao]').forEach(b => b.addEventListener('click', () => {
    const job = estado.jobs.find(j => j.id === b.dataset.job);
    const acao = b.dataset.acao;
    if (acao === 'abrir') ir('lista', {lista: job.lista});
    else if (acao === 'continuar') enfileirar(job);
    else if (acao === 'reprocessar') enfileirar(job, {reprocessar: true});
    else if (acao === 'descartar') { estado.jobs.splice(estado.jobs.indexOf(job), 1); desenharEnvios(); }
    else if (acao === 'ver-existente') { const l = [...estado.listas.entries()].find(([, x]) => x.origem === job.idImp); if (l) ir('lista', {lista: l[0]}); }
  }));
}
function cartaoEnvio(e) {
  const etapas = ETAPAS.map((nome, i) => {
    let cls = i < e.etapa ? 'feita' : i === e.etapa ? 'atual' : '';
    if (e.estado === 'concluido') cls = 'feita';
    if (i === e.etapa && (e.estado === 'parado' || e.estado === 'gabarito')) cls = 'parada';
    if (i === e.etapa && e.estado === 'falhou') cls = 'falhou';
    const largura = cls === 'feita' ? 100 : i === e.etapa ? Math.round((e.progresso || 0) * 100) : 0;
    return `<div class="etapa ${cls}"><i><b style="width:${largura}%"></b></i>${nome}</div>`;
  }).join('');
  const b = (acao, txt, prim) => `<button class="botao ${prim ? 'primario' : ''}" data-job="${e.id}" data-acao="${acao}">${txt}</button>`;
  const acoes = e.estado === 'concluido' ? b('abrir', 'Ver lista', true)
    : e.estado === 'parado' ? b('continuar', 'Continuar', true) + b('descartar', 'Descartar')
    : e.estado === 'duplicado' ? b('ver-existente', 'Ver a lista') + b('reprocessar', 'Reprocessar', true) + b('descartar', 'Cancelar')
    : e.estado === 'gabarito' ? b('descartar', 'Descartar')
    : e.estado === 'falhou' ? b('descartar', 'Fechar')
    : e.estado === 'fila' ? b('descartar', 'Tirar da fila') : '';
  const manual = e.estado !== 'gabarito' ? '' : `<div class="gab-manual">
    ${e.m?.paginaGabarito ? `<img src="${e.urlGabarito ||= URL.createObjectURL(e.m.paginaGabarito)}" alt="Página da tabela de gabarito">` : '<div class="sub">O PDF não tem página de gabarito depois das questões.</div>'}
    <div class="sub">A página da tabela foi guardada para análise do leitor de gabarito.</div></div>`;
  return `<div class="painel envio"><div><div class="nome">${esc(e.arquivo)}</div><div class="msg">${esc(e.mensagem)}</div></div>
    <div class="acoes-envio">${acoes}</div><div class="etapas">${etapas}</div>${manual}</div>`;
}
// Uma lista por vez: as chamadas ao Claude de listas diferentes não competem entre si.
let filaRodando = false;
const fila = [];
function enfileirar(job, opcoes = {}) {
  atualizar(job, {estado: 'fila', mensagem: 'Na fila…'});
  fila.push([job, opcoes]);
  if (!filaRodando) rodarFila();
}
async function rodarFila() {
  filaRodando = true;
  while (fila.length) {
    const [job, opcoes] = fila.shift();
    if (!estado.jobs.includes(job)) continue;
    await processar(job, opcoes);
  }
  filaRodando = false;
}
function receber(arquivos) {
  for (const a of arquivos) {
    if (!/\.pdf$/i.test(a.name)) { toast(`${a.name} não é PDF.`); continue; }
    enfileirar(novoJob(a));
  }
}

// ---------------- filtros
function opcoes(qs, campo) {
  const vals = qs.flatMap(q => campo === 'assunto' ? (q.assuntos || []) : [q[campo]]).filter(v => v !== null && v !== undefined && v !== '');
  return [...new Set(vals)].sort((a, b) => campo === 'ano' ? b - a : String(a).localeCompare(String(b), 'pt-BR'));
}
function htmlFiltros(qs, f, pre) {
  const sel = (campo, rotulo, txt = v => v, valores = opcoes(qs, campo)) => `<select class="campo" data-filtro="${campo}" id="${pre}-${campo}" aria-label="${rotulo}">
    <option value="">${rotulo}</option>${valores.map(v => `<option value="${esc(v)}" ${String(v) === String(f[campo]) ? 'selected' : ''}>${esc(txt(v))}</option>`).join('')}</select>`;
  return `<div class="filtros">
    <input class="campo busca" data-filtro="busca" id="${pre}-busca" placeholder="Buscar no título ou no enunciado…" value="${esc(f.busca)}" aria-label="Buscar">
    ${sel('disciplina', 'Disciplina')}${sel('topico', 'Tópico')}${sel('assunto', 'Assunto')}${sel('instituicao', 'Instituição')}
    ${sel('ano', 'Ano')}${sel('dificuldade', 'Dificuldade', v => DIFICULDADE[v])}
    ${sel('situacao', 'Situação', v => ({ok: 'Sem pendência', revisar: 'Para revisar', erro: 'Com erro'})[v], ['ok', 'revisar', 'erro'])}
  </div>`;
}
function filtrar(qs, f) {
  const termo = f.busca.trim().toLowerCase();
  return qs.filter(q => (!termo || (q.titulo + ' ' + textoBusca(q)).toLowerCase().includes(termo))
    && (!f.disciplina || q.disciplina === f.disciplina) && (!f.topico || q.topico === f.topico)
    && (!f.assunto || (q.assuntos || []).includes(f.assunto)) && (!f.instituicao || q.instituicao === f.instituicao)
    && (!f.ano || String(q.ano) === f.ano) && (!f.dificuldade || String(q.dificuldade) === f.dificuldade)
    && (!f.situacao || situacaoQuestao(q) === f.situacao));
}
function ligarFiltros(f, redesenhar) {
  principal.querySelectorAll('[data-filtro]').forEach(el => el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'change', () => {
    f[el.dataset.filtro] = el.value; const id = el.id; redesenhar();
    const n = document.getElementById(id); if (n) { n.focus(); if (n.tagName === 'INPUT') n.setSelectionRange(n.value.length, n.value.length); }
  }));
}

// ---------------- Banco de questões
function telaBanco(qs) {
  const achadas = filtrar(qs, filtroBanco), visiveis = achadas.slice(0, LIMITE_LINHAS);
  const todasMarcadas = visiveis.length > 0 && visiveis.every(q => selecionadas.has(q.id));
  const listas = [...estado.listas.entries()];
  const podeEditar = !!cap.db;
  principal.innerHTML = `
    <div class="cab"><div><h1>Banco de questões</h1>
      <div class="resumo-lista"><span>${qs.length} questões no banco</span><span>${achadas.length} com estes filtros</span></div></div>
      <div class="form-linha">${podeEditar && cap.sample && qs.some(q => errosReprocessaveis(q).length) ? `<button class="botao primario" id="reprocessar-erros" ${reprocessando ? 'disabled' : ''}>${reprocessando ? 'Reprocessando…' : `Reprocessar questões com erro (${qs.filter(q => errosReprocessaveis(q).length).length})`}</button>` : ''}
      <button class="botao" id="limpar" ${Object.values(filtroBanco).some(Boolean) ? '' : 'disabled'}>Limpar filtros</button></div></div>
    ${htmlFiltros(qs, filtroBanco, 'fb')}
    <div class="gerenciar">
      <div class="painel rolagem tabela-wrap"><table>
        <thead><tr>${podeEditar ? `<th class="marcar"><input type="checkbox" id="marcar-todas" ${todasMarcadas ? 'checked' : ''} aria-label="Selecionar as questões filtradas"></th>` : ''}
          <th>Título</th><th>Instituição</th><th>Ano</th><th>Dificuldade</th><th></th></tr></thead>
        <tbody>${visiveis.map(q => `
          <tr class="clicavel ${q.id === tela.questaoBanco ? 'sel' : ''}" data-q="${esc(q.id)}" tabindex="0">
            ${podeEditar ? `<td class="marcar"><input type="checkbox" data-marcar="${esc(q.id)}" ${selecionadas.has(q.id) ? 'checked' : ''} aria-label="Selecionar ${esc(q.titulo)}"></td>` : ''}
            <td title="${esc(q.titulo)}"><div style="white-space:nowrap">${esc(tituloCurto(q.titulo))}</div><div class="sub">${esc(q.lista_origem)}</div></td>
            <td>${esc(q.instituicao || '—')}</td><td class="num">${q.ano || '—'}</td><td>${DIFICULDADE[q.dificuldade] || '—'}</td><td>${seloQuestao(q)}</td></tr>`).join('')
          || `<tr><td colspan="6" class="vazio">${qs.length ? 'Nenhuma questão com esses filtros.' : 'O banco está vazio. Envie um PDF em Enviar lista.'}</td></tr>`}</tbody></table>
        ${achadas.length > LIMITE_LINHAS ? `<div class="mais">Mostrando ${LIMITE_LINHAS} de ${achadas.length}. Refine os filtros.</div>` : ''}</div>
      <section class="painel detalhe" id="detalhe" aria-label="Detalhes da questão"></section>
    </div>
    ${selecionadas.size ? `<div class="barra-sel"><span class="cont">${selecionadas.size} questão(ões) selecionada(s)</span>
      ${criandoLista ? `<form class="form-linha" id="form-nova" style="flex:1 1 100%">
          <input class="campo" id="nova-nome" placeholder="Nome da lista, ex.: Lista de Revisão MCU" required>
          <input class="campo" id="nova-descricao" placeholder="Descrição (opcional)">
          <button class="botao primario" type="submit">Criar lista</button><button class="botao" type="button" id="cancelar-nova">Cancelar</button></form>`
        : `<button class="botao primario" id="nova-lista">Criar lista com as selecionadas</button>
          ${listas.length ? `<select class="campo" id="destino" aria-label="Lista de destino">${listas.map(([id, l]) => `<option value="${esc(id)}">${esc(l.nome)}</option>`).join('')}</select>
          <button class="botao" id="adicionar">Adicionar à lista</button>` : ''}
          <button class="botao" id="desmarcar">Limpar seleção</button>
          ${confirmandoExclusaoQ ? `<span class="confirmar">Excluir ${selecionadas.size} questão(ões) do banco? Elas saem também das listas. Não dá para desfazer.
            <button class="botao perigo" id="sim-excluir-q" ${excluindo ? 'disabled' : ''}>${excluindo ? 'Excluindo…' : 'Excluir'}</button><button class="botao" id="nao-excluir-q">Cancelar</button></span>`
            : '<button class="botao perigo" id="excluir-q">Excluir</button>'}`}</div>` : ''}`;
  const redesenhar = () => telaBanco(banco());
  document.getElementById('excluir-q')?.addEventListener('click', () => { confirmandoExclusaoQ = true; redesenhar(); });
  document.getElementById('nao-excluir-q')?.addEventListener('click', () => { confirmandoExclusaoQ = false; redesenhar(); });
  document.getElementById('sim-excluir-q')?.addEventListener('click', async () => {
    const ids = [...selecionadas];
    await excluirQuestoes(ids);
    confirmandoExclusaoQ = false; ids.forEach(id => selecionadas.delete(id));
    if (ids.includes(tela.questaoBanco)) tela.questaoBanco = null;
    desenhar();
  });
  ligarFiltros(filtroBanco, redesenhar);
  document.getElementById('limpar').onclick = () => { Object.assign(filtroBanco, FILTRO_VAZIO); redesenhar(); };
  const botaoRep = document.getElementById('reprocessar-erros');
  if (botaoRep) botaoRep.onclick = () => reprocessarQuestoes(banco().filter(q => errosReprocessaveis(q).length));
  document.getElementById('marcar-todas')?.addEventListener('change', e => { visiveis.forEach(q => e.target.checked ? selecionadas.add(q.id) : selecionadas.delete(q.id)); redesenhar(); });
  principal.querySelectorAll('[data-marcar]').forEach(c => {
    c.addEventListener('click', e => e.stopPropagation());
    c.addEventListener('change', () => { c.checked ? selecionadas.add(c.dataset.marcar) : selecionadas.delete(c.dataset.marcar); redesenhar(); });
  });
  principal.querySelectorAll('tr[data-q]').forEach(tr => {
    const abrir = () => { tela.questaoBanco = tr.dataset.q; redesenhar(); };
    tr.addEventListener('click', abrir); tr.addEventListener('keydown', e => e.key === 'Enter' && abrir());
  });
  document.getElementById('nova-lista')?.addEventListener('click', () => { criandoLista = true; redesenhar(); document.getElementById('nova-nome')?.focus(); });
  document.getElementById('cancelar-nova')?.addEventListener('click', () => { criandoLista = false; redesenhar(); });
  document.getElementById('desmarcar')?.addEventListener('click', () => { selecionadas.clear(); redesenhar(); });
  document.getElementById('form-nova')?.addEventListener('submit', async e => {
    e.preventDefault();
    const escolhidas = qs.filter(q => selecionadas.has(q.id));
    const unico = campo => { const v = [...new Set(escolhidas.map(q => q[campo]))]; return v.length === 1 ? v[0] : null; };
    const id = 'l' + Date.now().toString(36);
    try {
      await cap.db.doc(`listas/${id}`).set({nome: document.getElementById('nova-nome').value.trim(), descricao: document.getElementById('nova-descricao').value.trim(),
        disciplina: unico('disciplina'), topico: unico('topico'), tags: [...new Set(escolhidas.flatMap(q => q.assuntos || []))],
        origem: null, questoes: escolhidas.map(q => q.id), status: 'rascunho', criado_em: agora(), atualizado_em: agora()});
      selecionadas.clear(); criandoLista = false; toast('Lista criada.'); ir('lista', {lista: id});
    } catch (err) { toast(`Não foi possível criar a lista: ${err.message || err.code}`); }
  });
  document.getElementById('adicionar')?.addEventListener('click', async () => {
    const id = document.getElementById('destino').value, l = estado.listas.get(id);
    const novas = qs.filter(q => selecionadas.has(q.id) && !l.questoes.includes(q.id)).map(q => q.id);
    await salvarLista(id, {questoes: [...l.questoes, ...novas]});
    toast(`${novas.length} questão(ões) adicionada(s) a ${l.nome}.`); selecionadas.clear(); redesenhar();
  });
  const d = document.getElementById('detalhe'), q = qs.find(x => x.id === tela.questaoBanco);
  d.innerHTML = q ? detalheQuestao(q, true) : '<p class="vazio">Clique numa questão para ver os detalhes.</p>';
  if (q) { ligarDetalhe(d, q); tipografar(d); principal.querySelector('tr.sel')?.scrollIntoView({block: 'nearest'}); }
}

// ---------------- Listas
function resumoLista(l, indice) {
  const qs = (l.questoes || []).map(i => indice.get(i)).filter(Boolean);
  return {total: qs.length, faltando: (l.questoes || []).length - qs.length,
          erros: qs.filter(q => q.erros?.length).length, avisos: qs.filter(q => q.avisos?.length).length};
}
function situacaoLista(r) {
  if (!r.total) return '<span class="selo info">Vazia</span>';
  if (r.erros) return `<span class="selo erro">${r.erros} com erro</span>`;
  if (r.avisos) return `<span class="selo alerta">${r.avisos} para revisar</span>`;
  return '<span class="selo ok">Pronta</span>';
}
function telaListas(qs) {
  const indice = new Map(qs.map(q => [q.id, q]));
  const listas = [...estado.listas.entries()].sort((a, b) => (b[1].atualizado_em || '').localeCompare(a[1].atualizado_em || ''));
  principal.innerHTML = `
    <div class="cab"><h1>Listas de questões</h1>${cap.db ? '<button class="botao primario" id="nova">+ Nova lista</button>' : ''}</div>
    <div class="painel tabela-wrap"><table>
      <thead><tr>${cap.db ? `<th class="marcar"><input type="checkbox" id="marcar-listas" ${listas.length && listas.every(([id]) => listasSelecionadas.has(id)) ? 'checked' : ''} aria-label="Selecionar todas as listas"></th>` : ''}<th>Nome</th><th>Qtd. questões</th><th>Descrição</th><th>Disciplina</th><th>Tópico</th><th>Tags</th><th>Situação</th></tr></thead>
      <tbody>${listas.map(([id, l]) => { const r = resumoLista(l, indice); return `
        <tr class="clicavel ${listasSelecionadas.has(id) ? 'sel' : ''}" data-lista="${esc(id)}" tabindex="0">
          ${cap.db ? `<td class="marcar"><input type="checkbox" data-marcar-lista="${esc(id)}" ${listasSelecionadas.has(id) ? 'checked' : ''} aria-label="Selecionar ${esc(l.nome)}"></td>` : ''}
          <td><strong>${esc(l.nome)}</strong>${l.origem ? '<div class="sub">do PDF importado</div>' : ''}</td>
          <td class="num">${r.total}</td><td>${esc(l.descricao || '—')}</td><td>${esc(l.disciplina || '—')}</td><td>${esc(l.topico || '—')}</td>
          <td>${(l.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</td><td>${situacaoLista(r)}</td></tr>`; }).join('')
        || '<tr><td colspan="8" class="vazio">Nenhuma lista ainda. Envie um PDF ou crie uma lista a partir do banco.</td></tr>'}</tbody>
    </table></div>
    ${listasSelecionadas.size ? `<div class="barra-sel"><span class="cont">${listasSelecionadas.size} lista(s) selecionada(s)</span>
      <button class="botao" id="desmarcar-listas">Limpar seleção</button>
      ${confirmandoExclusaoL ? `<span class="confirmar">Excluir ${listasSelecionadas.size} lista(s)?
          <label style="display:inline-flex;gap:6px;align-items:center;color:var(--texto)"><input type="checkbox" id="com-questoes"> excluir também as questões delas do banco</label>
          <button class="botao perigo" id="sim-excluir-l" ${excluindo ? 'disabled' : ''}>${excluindo ? 'Excluindo…' : 'Excluir'}</button><button class="botao" id="nao-excluir-l">Cancelar</button></span>`
        : '<button class="botao perigo" id="excluir-l">Excluir listas selecionadas</button>'}</div>` : ''}`;

// ============================================================ exclusão em massa
// Questões: saem das partes (parte vazia é apagada), das listas que as usam e, quando a
// importação fica sem questões, a importação some (o PDF pode ser reenviado). As imagens
// das questões excluídas são apagadas do armazenamento do artefato.
async function excluirQuestoes(ids) {
  if (!cap.db || !ids.length) return;
  excluindo = true; desenhar();
  const alvo = new Set(ids), imagens = [];
  try {
    const porParte = new Map();
    for (const [pid, parte] of estado.partes) {
      const sai = (parte.questoes || []).filter(q => alvo.has(`${parte.importacao}:${nn(q.numero)}`));
      if (sai.length) porParte.set(pid, {parte, sai});
    }
    for (const [pid, {parte, sai}] of porParte) {
      const resto = parte.questoes.filter(q => !sai.includes(q));
      if (resto.length) await cap.db.doc(`partes/${pid}`).set({...parte, questoes: resto});
      else await cap.db.doc(`partes/${pid}`).delete();
      for (const q of sai) imagens.push(q.imagem, q.gabaritoRecorte, ...(q.figuras || []).map(f => f.asset));
    }
    const tocadas = new Set([...porParte.values()].map(x => x.parte.importacao));
    for (const idImp of tocadas) {
      const restam = [...estado.partes.entries()].filter(([pid, p]) => p.importacao === idImp)
        .reduce((n, [pid, p]) => n + (porParte.has(pid) ? p.questoes.length - porParte.get(pid).sai.length : p.questoes.length), 0);
      const imp = estado.importacoes.get(idImp);
      if (!imp) continue;
      if (restam) await cap.db.doc(`importacoes/${idImp}`).set({...imp, total: restam, atualizado_em: agora()});
      else { await cap.db.doc(`importacoes/${idImp}`).delete(); if (imp.gabaritoImagem) imagens.push(imp.gabaritoImagem); }
    }
    for (const [lid, l] of estado.listas) {
      const resto = (l.questoes || []).filter(id => !alvo.has(id));
      if (resto.length !== (l.questoes || []).length) await cap.db.doc(`listas/${lid}`).set({...l, questoes: resto, atualizado_em: agora()});
    }
    toast(`${ids.length} questão(ões) excluída(s).`);
  } catch (e) { toast(`A exclusão parou: ${e.message || e.code}. Recarregue a página e confira.`); }
  finally { excluindo = false; }
  if (cap.assets) for (const id of imagens.filter(Boolean)) await cap.assets.delete(id).catch(() => {});
}
async function excluirListas(ids, comQuestoes) {
  if (!cap.db || !ids.length) return;
  const questoes = comQuestoes ? [...new Set(ids.flatMap(id => estado.listas.get(id)?.questoes || []))] : [];
  excluindo = true; desenhar();
  try { for (const id of ids) await cap.db.doc(`listas/${id}`).delete(); }
  catch (e) { excluindo = false; return toast(`A exclusão parou: ${e.message || e.code}`); }
  for (const id of ids) estado.listas.delete(id);   // as questões não ficam "presas" nas listas recém-excluídas
  excluindo = false;
  if (questoes.length) await excluirQuestoes(questoes);
  toast(`${ids.length} lista(s) excluída(s)` + (questoes.length ? ` e ${questoes.length} questão(ões) do banco.` : '. As questões continuam no banco.'));
}

async function salvarLista(id, campos) {
  const l = estado.listas.get(id);
  try { await cap.db.doc(`listas/${id}`).set({...l, ...campos, atualizado_em: agora()}); }
  catch (e) { toast(`Não foi possível salvar: ${e.message || e.code}`); }
}
