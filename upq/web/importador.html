<script type="module">
// pdf.js num Worker próprio (a leitura do PDF não trava a página). Se o navegador não deixar criar o
// Worker, o pdf.js roda na própria página, como antes.
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/legacy/build/';
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/legacy/build/pdf.min.mjs';
async function workerDoPdf() {
  try {
    const url = URL.createObjectURL(new Blob([`import '${PDFJS}pdf.worker.min.mjs';`], {type: 'text/javascript'}));
    const w = new Worker(url, {type: 'module'});
    const ok = await new Promise(res => {
      const t = setTimeout(() => res(false), 8000);
      w.addEventListener('message', () => { clearTimeout(t); res(true); }, {once: true});
      w.addEventListener('error', () => { clearTimeout(t); res(false); }, {once: true});
    });
    if (ok) return w;
    w.terminate();
  } catch {}
  return null;
}
const w = await workerDoPdf();
if (w) { pdfjsLib.GlobalWorkerOptions.workerPort = w; window.pdfjsModo = 'worker'; }
else { globalThis.pdfjsWorker = await import(PDFJS + 'pdf.worker.min.mjs'); window.pdfjsModo = 'página'; }
window.pdfjsLib = pdfjsLib;
window.dispatchEvent(new Event('pdfjs-pronto'));
</script>

<script>
const DADOS = /*__UPQ_DADOS__*/null;   // prompt e base de tópicos, gerados por upq/artefato.py
const BASE = new Map(DADOS.base.map(([d, t, a]) => [d + '\u0000' + t, a]));
const ETAPAS = ['Recorte', 'Transcrição', 'Validação', 'No banco'];
const DIFICULDADE = {1: 'Muito Fácil', 2: 'Fácil', 3: 'Média', 4: 'Difícil', 5: 'Muito Difícil'};
const FAIXA_ETAPA = {'Fixação': [1, 2], 'Treinamento': [2, 3], 'Aprofundamento': [3, 4], 'Desafios': [4, 5]};
const QUESTOES_POR_PARTE = 20;     // questões por documento do banco (cada documento ≤ 256 KiB)
const SIMULTANEAS = 3;             // chamadas ao Claude ao mesmo tempo, por lista
const LISTAS_JUNTAS = 2;

const LIMITE_LINHAS = 300;

// ============================================================ utilidades
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const nn = n => String(n).padStart(2, '0');
const tituloCurto = t => (String(t || '').match(/Questão \d+/) || [t])[0];
const agora = () => new Date().toISOString();
const blobUrl = id => id ? '/_blob/' + id : '';
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'aviso-toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
}

// Markdown + LaTeX: guarda as fórmulas antes do Markdown para não perder _ e * dentro delas.
function md(texto, figuras = {}) {
  const guardadas = [];
  const t = String(texto || '').replace(/\\\$/g, '\u0001')
    .replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => { guardadas.push(m); return `\u0002${guardadas.length - 1}\u0002`; })
    .replace(/(\(|src=")figura:([A-Za-z0-9_]+)/g, (m, a, n) => a + (figuras[n] || ''));
  const html = window.marked ? marked.parse(t) : `<p>${esc(t)}</p>`;
  return html.replace(/\u0002(\d+)\u0002/g, (m, i) => esc(guardadas[+i])).replace(/\u0001/g, '\\$');
}
function tipografar(el) {
  if (window.MathJax?.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
  else setTimeout(() => tipografar(el), 300);
}
function textoBusca(q) {
  return String(q.enunciado || '').replace(/<[^>]+>|!\[[^\]]*\]\([^)]*\)|[$*_#>|\\]/g, ' ').replace(/\s+/g, ' ').slice(0, 400);
}

// ============================================================ capacidades do artefato
const cap = {db: null, assets: null, sample: null, downloads: null, user: null, limites: null, limitesErro: null, sonda: null, prontas: false};
const estado = {importacoes: new Map(), partes: new Map(), listas: new Map(), jobs: []};

async function iniciarCapacidades() {
  if (!window.claude?.use) { cap.prontas = true; return; }
  const [db, assets, sample, downloads, user] = await Promise.all(
    ['db', 'assets', 'sample', 'downloads', 'user'].map(n => claude.use(n).catch(() => null)));
  Object.assign(cap, {db, assets, sample, downloads, user});
  if (sample) cap.limites = await sample.limits().catch(e => { cap.limitesErro = e?.code || e?.message || String(e); return null; });
  cap.prontas = true;
  medirArmazenamento();
  if (db) {
    const erro = e => toast(`Banco do artefato indisponível: ${e.message || e.code}`);
    db.collection('importacoes').limit(1000).onSnapshot(s => { estado.importacoes = new Map(s.docs.map(d => [d.id, d.data()])); aoMudarDados(); }, erro);
    // Cada consulta devolve até 1000 documentos: as partes são lidas em 16 fatias (1º caractere do id).
    const fatias = new Map();
    for (const f of '0123456789abcdef') db.collection('partes').where('fatia', '==', f).limit(1000).onSnapshot(s => {
      fatias.set(f, s.docs.map(d => [d.id, d.data()]));
      estado.partes = new Map([...fatias.values()].flat()); aoMudarDados();
    }, erro);
    db.collection('listas').limit(1000).onSnapshot(s => { estado.listas = new Map(s.docs.map(d => [d.id, d.data()])); aoMudarDados(); }, erro);
  }
  desenhar();
}
let redesenhoPendente = null;
function aoMudarDados() {   // vários snapshots chegam juntos: um redesenho por quadro
  if (redesenhoPendente) return;
  redesenhoPendente = requestAnimationFrame(() => { redesenhoPendente = null; desenharSeSeguro(); });
}
function desenharSeSeguro() {   // não redesenha por baixo de quem está digitando ou com a janela aberta
  if (document.getElementById('camada').childElementCount) return;
  const ativo = document.activeElement;
  if (ativo && ['INPUT', 'TEXTAREA', 'SELECT'].includes(ativo.tagName) && principal.contains(ativo)) return;
  desenhar();
}

// O banco geral = todas as questões de todas as partes, com id "<importação>:<NN>".
function banco() {
  const qs = [];
  for (const [parteId, parte] of estado.partes) {
    const imp = estado.importacoes.get(parte.importacao);
    for (const q of parte.questoes || []) qs.push({...q, id: `${parte.importacao}:${nn(q.numero)}`, origem: parte.importacao,
      parte_id: parteId, lista_origem: imp?.titulo || '', criado_em: imp?.criado_em || ''});
  }
  return qs.sort((a, b) => a.criado_em.localeCompare(b.criado_em) || a.lista_origem.localeCompare(b.lista_origem) || a.numero - b.numero);
}
function indiceBanco() { return new Map(banco().map(q => [q.id, q])); }

// ============================================================ validação (porta de upq/validar.py)
const RE_MATH = /\$\$[\s\S]+?\$\$|\$[^$]+?\$/g;
const RE_FIG = /(?:!\[[^\]]*\]\(|src=")figura:([A-Za-z0-9_]+)/g;
const UNICODE_MAT = '²³¹⁰⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉√≤≥≠±×÷∞∫∑πΔ≈';
const semAcento = s => s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function checarLatex(campo, texto, erros, avisos) {
  const limpo = texto.replace(/\\\$/g, '');
  if ((limpo.match(/\$/g) || []).length % 2) erros.push(`${campo}: quantidade ímpar de "$" (fórmula aberta ou R$ sem escape)`);
  if (/R\$\s?\d/.test(limpo)) erros.push(`${campo}: "R$" sem escape (use R\\$)`);
  for (const f of limpo.match(RE_MATH) || []) {
    if ((f.match(/\{/g) || []).length !== (f.match(/\}/g) || []).length) erros.push(`${campo}: chaves desbalanceadas em ${f.slice(0, 40)}`);
    for (const p of ['\\ce{', '\\SI{', '\\usepackage']) if (f.includes(p)) erros.push(`${campo}: comando não suportado ${p}`);
  }
  const fora = limpo.replace(RE_MATH, ' ');
  const achados = [...new Set([...fora].filter(c => UNICODE_MAT.includes(c)))];
  if (achados.length) avisos.push(`${campo}: símbolo fora de LaTeX (${achados.join(' ')})`);
}
// Negrito e centralização do PDF (marcados no texto extraído) têm de estar na transcrição
// (igual a conferir_formatacao em upq/validar.py).
// aviso que a IA às vezes escreve no lugar de um trecho que não leu (igual a upq/validar.py)
const RE_NAO_LIDO = /n[ãa]o\s+(?:[ée]\s+)?leg[ií]ve|ileg[ií]ve|n[ãa]o\s+(?:foi\s+)?(?:capturad|extra[ií]d|identificad)|n[ãa]o\s+dispon[ií]vel\s+no\s+texto|\((?:express[ãa]o|f[óo]rmula)[^)]*\)/i;
const soAlnum = t => semAcento(String(t).replace(/\\[a-zA-Z]+|<[^>]+>/g, ' ')).replace(/[^a-z0-9]/g, '');
function trechosNegrito(t) {
  const partes = [...t.matchAll(/\*\*([\s\S]+?)\*\*/g), ...t.matchAll(/<strong>([\s\S]+?)<\/strong>/g), ...t.matchAll(/<thead>([\s\S]*?)<\/thead>/g)].map(m => m[1]);
  const linhas = t.split('\n');
  linhas.forEach((l, i) => { if (l.trim().startsWith('|') && (i === 0 || !linhas[i - 1].trim().startsWith('|'))) partes.push(l); });
  return partes.map(soAlnum).join('|');
}
function trechosCentralizados(t) {
  return [...t.matchAll(/<p style="text-align: center;">([\s\S]*?)<\/p>/g), ...t.matchAll(/<table style="margin-left: auto; margin-right: auto;">([\s\S]*?)<\/table>/g)]
    .map(m => soAlnum(m[1])).join('|');
}
// Trava contra vazamento: nenhum trecho do PDF pode aparecer na transcrição mais vezes do que
// aparece no PDF (ex.: cabeçalho de tabela repetido como título). Igual a upq/validar.py.
function conferirRepeticoes(textoPdf, transcrito) {
  const linhas = String(textoPdf || '').split('\n').slice(1).filter(l => !l.startsWith(MARCA_OCR)).map(l => soAlnum(l.replace(/^\[centralizado\] /, '').replace(/\*\*/g, '')));
  const pdf = linhas.join(''), tr = soAlnum(transcrito);
  const conta = (t, n) => t.split(n).length - 1;
  const repetidos = [...new Set(linhas.filter(n => n.length >= 12))].filter(n => conta(tr, n) > conta(pdf, n));
  if (!repetidos.length) return [];
  const original = String(textoPdf).split('\n').slice(1).filter(l => !l.startsWith(MARCA_OCR)).map(l => l.replace(/^\[centralizado\] /, '').replace(/\*\*/g, '').trim());
  return ['trecho repetido na transcrição (aparece mais vezes do que no PDF): ' + repetidos.slice(0, 3).map(n => `«${(original.find(l => soAlnum(l) === n) || n).slice(0, 60)}»`).join('; ')];
}
// A figura tem de ficar no lugar dela no PDF: as palavras logo antes da marca ⟦FIGURA NOME⟧ vêm antes
// da figura no enunciado, e as logo depois vêm depois (texto trocado de lugar em volta da figura = erro).
function recorteMisturado(textoPdf, numero) {
  const linhas = String(textoPdf || '').split('\n');
  if (!textoPdf) return null;
  const barra = linhas[0].match(/^\s*Quest[aã]o\s*(\d[\d ]*)/i);
  if (!barra || +barra[1].replace(/ /g, '') !== +numero) return `o texto da questão não começa na barra "Questão ${nn(numero)}" (colunas ou questões misturadas)`;
  if (linhas.slice(1).some(l => /^\s*Quest[aã]o\s*\d/i.test(l))) return 'há a barra de outra questão dentro desta (questões misturadas)';
  const letras = linhas.map(l => (l.match(/^(?:\*\*)?([A-E])(?:\*\*)?\s+\S/) || [])[1]).filter(Boolean);
  let viuB = false;
  for (let i = 1; i < letras.length; i++) {
    if (letras[i] === 'B') viuB = true;
    if (viuB && letras[i] < letras[i - 1]) return `alternativas fora de ordem no texto do PDF (${letras.join(' ')}): colunas misturadas`;
  }
  return null;
}
function conferirPosicaoFiguras(textoPdf, enunciado, tabelas = new Set()) {
  const linhas = String(textoPdf || '').split('\n').slice(1), enun = String(enunciado || ''), erros = [];
  const palavras = l => semAcento(semMarcasFormula(l).replace(/^\[centralizado\] /, '').replace(/\*\*/g, '')).match(/[a-z]{4,}/g) || [];
  const ehAlternativa = l => /^(\*\*)?[A-E](\*\*)?(\s|$)/.test(l.trim());
  for (const [i, l] of linhas.entries()) {
    const m = l.match(/^⟦FIGURA ([A-Za-z0-9_]+)⟧$/);
    if (!m || tabelas.has(m[1])) continue;
    const pos = enun.search(new RegExp(`figura:${m[1]}\\b`));
    if (pos < 0) continue;   // figura numa alternativa ou não usada: outras conferências cuidam
    const antes = semAcento(enun.slice(0, pos)).replace(/\\[a-zA-Z]+/g, ' '), depois = semAcento(enun.slice(pos)).replace(/\\[a-zA-Z]+/g, ' ');
    // últimas palavras do texto antes da marca e primeiras depois (parando nas alternativas)
    const ant = linhas.slice(0, i).filter(x => !/^⟦FIGURA/.test(x)).flatMap(palavras).slice(-3);
    const dep = [];
    for (const x of linhas.slice(i + 1)) { if (ehAlternativa(x)) break; if (!/^⟦FIGURA/.test(x)) dep.push(...palavras(x)); if (dep.length >= 3) break; }
    const falhaAntes = ant.length === 3 && !ant.every(w => antes.includes(w)) && ant.every(w => depois.includes(w));
    const falhaDepois = dep.length >= 3 && !dep.slice(0, 3).every(w => depois.includes(w)) && dep.slice(0, 3).every(w => antes.includes(w));
    if (falhaAntes || falhaDepois)
      erros.push(`figura ${m[1]} fora do lugar: no PDF ela vem ${falhaAntes ? `depois de «…${ant.join(' ')}»` : `antes de «${dep.slice(0, 3).join(' ')}…»`} (texto trocado de lugar em volta da figura)`);
  }
  return erros;
}
function conferirFormatacao(textoPdf, transcrito) {
  const erros = [], faltamN = [], faltamC = [];
  const negrito = trechosNegrito(transcrito), centro = trechosCentralizados(transcrito);
  for (let l of String(textoPdf || '').split('\n').slice(1).filter(l => !l.startsWith(MARCA_OCR))) {
    const cent = l.startsWith('[centralizado] ');
    l = l.replace(/^\[centralizado\] /, '');
    for (const m of l.matchAll(/\*\*(.+?)\*\*/g)) { const n = soAlnum(m[1]); if (n.replace(/[0-9]/g, '').length >= 4 && !negrito.includes(n)) faltamN.push(m[1].trim()); }
    const limpo = l.replace(/\*\*/g, ''), n = soAlnum(limpo);
    if (cent && n.length >= 3 && !/^\s*\(?(fonte|dispon[ií]vel)/i.test(limpo) && !centro.includes(n)) faltamC.push(limpo.trim());
  }
  if (faltamN.length) erros.push('negrito do PDF ausente na transcrição: ' + faltamN.slice(0, 4).map(t => `«${t.slice(0, 60)}»`).join('; '));
  if (faltamC.length) erros.push('texto centralizado no PDF sem centralizar: ' + faltamC.slice(0, 4).map(t => `«${t.slice(0, 60)}»`).join('; '));
  return erros;
}
function conferirComPdf(textoPdf, transcrito) {
  textoPdf = String(textoPdf || '').split('\n').filter(l => !l.startsWith(MARCA_OCR)).join('\n').replace(/\[centralizado\] /g, '').replace(/\*\*/g, '');
  const avisos = [];
  const corpo = String(textoPdf || '').split('\n').slice(1).filter(l => !/^\s*\(?(Fonte|Disponível em)/.test(l)).join('\n');
  const digitos = transcrito.replace(/\D/g, '');
  const faltam = [...new Set((corpo.replace(/\./g, '').match(/\d+/g) || []).filter(n => n.length >= 2 && !digitos.includes(n)))];
  if (faltam.length) avisos.push(`números do PDF ausentes na transcrição: ${faltam.join(', ')}`);
  const palavras = new Set(semAcento(corpo).match(/[a-z]{5,}/g) || []);
  if (palavras.size) {
    const t = semAcento(transcrito);
    const cob = [...palavras].filter(w => t.includes(w)).length / palavras.size;
    if (cob < 0.85) avisos.push(`só ${Math.round(cob * 100)}% das palavras do PDF aparecem na transcrição (trecho cortado?)`);
  }
  return avisos;
}
function validarQuestao(q, lista) {
  const erros = [], avisos = [];
  // Trava de recorte: o texto da questão começa na barra dela e as alternativas vêm em ordem; senão o
  // recorte misturou colunas/questões (nunca deixa passar como se estivesse certo)
  const misturado = recorteMisturado(q.textoPdf, q.numero);
  if (misturado) erros.push(`recorte incompleto: ${misturado}. Avise o suporte do importador.`);
  if (q.foraDoRecorte?.length) erros.push(`recorte incompleto: trecho da página fora da questão (${q.foraDoRecorte.slice(0, 3).map(t => `«${t}»`).join('; ')}). Avise o suporte do importador.`);
  const assuntosBase = BASE.get(q.disciplina + '\u0000' + q.topico);
  if (!assuntosBase) erros.push(`par fora da base de tópicos: ${q.disciplina} / ${q.topico}`);
  if (lista?.tipo === 'lista' && lista.disciplina && (q.disciplina !== lista.disciplina || q.topico !== lista.topico)) erros.push('disciplina/tópico diferente do resto da lista');
  const validos = assuntosBase && assuntosBase.length ? assuntosBase : [q.topico];
  if (!q.assuntos?.length) erros.push('sem assunto');
  for (const a of q.assuntos || []) if (!validos.includes(a)) erros.push(`assunto fora da base para ${q.topico}: ${a}`);
  const letras = Object.keys(q.alternativas || {});
  if (letras.join('') !== 'ABCDE'.slice(0, letras.length) || letras.length < 2) erros.push(`alternativas fora de ordem ou insuficientes: ${letras.join(', ')}`);
  if (!q.gabarito) erros.push('sem gabarito: a tabela do fim da lista não foi lida (preencha na edição)');
  else if (!letras.includes(q.gabarito)) erros.push(`gabarito ${q.gabarito} não está entre as alternativas`);
  for (const [nome, t] of [['enunciado', q.enunciado], ...Object.entries(q.alternativas || {}).map(([l, t]) => [`alternativa ${l}`, t])]) {
    const achado = String(t || '').match(RE_NAO_LIDO);
    if (achado) erros.push(`${nome}: trecho não transcrito (a IA escreveu «${achado[0]}»)`);
  }
  for (const [l, t] of Object.entries(q.alternativas || {})) {
    if (!String(t).trim()) erros.push(`alternativa ${l} vazia`);
    else if (/^\(?[a-eA-E][).]\s/.test(t)) avisos.push(`alternativa ${l} parece começar com a letra`);
  }
  const faixa = FAIXA_ETAPA[q.etapa];
  if (faixa && !(faixa[0] <= q.dificuldade && q.dificuldade <= faixa[1])) avisos.push(`dificuldade ${q.dificuldade} fora da faixa ${faixa[0]}–${faixa[1]} de ${q.etapa}`);
  const campos = {enunciado: q.enunciado, ...Object.fromEntries(Object.entries(q.alternativas || {}).map(([k, v]) => [`alternativa ${k}`, v]))};
  for (const [nome, texto] of Object.entries(campos)) checarLatex(nome, String(texto || ''), erros, avisos);
  const nomes = new Set((q.figuras || []).map(f => f.nome));
  const usadas = new Set(Object.values(campos).flatMap(t => [...String(t || '').matchAll(RE_FIG)].map(m => m[1])));
  const inexistentes = [...usadas].filter(n => !nomes.has(n));
  if (inexistentes.length) erros.push(`figura inexistente referenciada: ${inexistentes.join(', ')}`);
  // Tabela colada como imagem (print) no PDF: tem de virar tabela de verdade, nunca imagem.
  const tabelasImg = new Set((q.figuras || []).filter(f => f.tabela).map(f => f.nome));
  const comoImagem = [...tabelasImg].filter(n => usadas.has(n));
  const temTabela = Object.values(campos).some(t => /<table|^\s*\|/m.test(String(t || '')));
  const porOcr = new Set(q.tabelasOcr || []), semDados = [...tabelasImg].filter(n => !porOcr.has(n));
  if (tabelasImg.size && q.lidaSemImagem && semDados.length)
    erros.push(`tabela colada como imagem no PDF (${semDados.join(', ')}): os dados só existem na imagem e esta leitura foi feita sem imagem nem OCR. Clique em Reprocessar.`);
  else if (comoImagem.length) erros.push(`tabela colada como imagem no PDF usada como figura (${comoImagem.join(', ')}): transcreva-a como tabela`);
  else if (tabelasImg.size && !temTabela) erros.push(`tabela da imagem não foi transcrita (${[...tabelasImg].join(', ')})`);
  if (q.lidaSemImagem && porOcr.size && !comoImagem.length && temTabela) avisos.push(`tabela lida por OCR do print (${[...porOcr].join(', ')}): confira os valores com o original`);

  const foraDoLugar = (q.figuras || []).filter(f => f.alternativa && !f.tabela && q.alternativas?.[f.alternativa] !== undefined
    && !new RegExp(`figura:${f.nome}\\b`).test(String(q.alternativas[f.alternativa])));

  const comFigura = new Set((q.figuras || []).filter(f => f.alternativa && !f.tabela).map(f => f.alternativa));
  if (comFigura.size >= 2) {
    const semFigura = Object.keys(q.alternativas || {}).filter(l => !comFigura.has(l) && !/figura:/.test(String(q.alternativas[l])) && !String(q.alternativas[l]).replace(/[\s.]/g, ''));
    if (semFigura.length) erros.push(`alternativa sem a figura: ${semFigura.join(', ')} (as outras alternativas são imagens)`);
  }
  const deFormula = (q.figuras || []).filter(f => f.deFormula).map(f => f.nome);
  if (deFormula.length) avisos.push(`trecho sem texto do PDF entrou como imagem (${deFormula.join(', ')}): confira se é desenho ou fórmula`);
  const sobras = [...nomes].filter(n => !usadas.has(n) && !tabelasImg.has(n));
  if (sobras.length) erros.push(`figura recortada mas não usada no texto: ${sobras.join(', ')}`);

  const marcas = marcasFormula(q.textoPdf);
  if (marcas.length) {
    const tr = soAlnum(transcrito), info = new Map((q.formulas || []).map(f => [f.nome, f]));
    const naoLidas = marcas.filter(f => !f.latex).map(f => f.nome);
    if (naoLidas.length && q.lidaSemImagem)
      erros.push(`fórmula em imagem não lida (${naoLidas.join(', ')}): o PDF traz a fórmula só como imagem e esta leitura foi feita sem imagem nem leitor de fórmulas. Clique em Reprocessar.`);
    const faltam = marcas.filter(f => f.latex && soAlnum(f.latex) && !tr.includes(soAlnum(f.latex)));
    if (faltam.length) erros.push(`fórmula do PDF ausente na transcrição: ${faltam.slice(0, 3).map(f => `${f.nome} ($${f.latex}$)`).join('; ')}`);

    if (incertas.length) avisos.push(`fórmula lida da imagem com incerteza (${incertas.map(f => f.nome).join(', ')}): confira com o original`);
    else if (lidas.length && q.lidaSemImagem) avisos.push(`fórmula lida da imagem por OCR (${lidas.map(f => f.nome).join(', ')}): confira com o original`);

  const alvos = job.m.questoes.flatMap(q => (q.formulas || []).filter(f => !f.latex && f.blob).map(f => [q, f]));
  if (alvos.length && formula.estado !== 'pronto') atualizar(job, {mensagem: `${alvos.length} fórmula(s) em imagem no PDF. Carregando o leitor de fórmulas (≈85 MB na primeira vez)…`});
  let feitas = 0, proxima = 0, parar = false;
  const leitor = alvos.length ? await leitorFormulas().catch(() => null) : null;
  const umaPorVez = async () => {
    while (!parar && proxima < alvos.length) {
      const [, f] = alvos[proxima++];
      try { Object.assign(f, await lerFormula(f) || {}); }
      catch (e) { console.warn('leitor de fórmulas', e); if (e?.code !== 'timeout') { parar = true; break; } f.comoFigura = true; }   // travou nesta: vira figura e segue
      atualizar(job, {mensagem: `Lendo fórmulas que estão como imagem no PDF: ${++feitas} de ${alvos.length}…`, progresso: feitas / alvos.length});
    }
  };
  // tantas leituras ao mesmo tempo quantos leitores (Workers) houver; os extras entram quando ficam prontos
  await Promise.all(Array.from({length: leitor ? 3 : 1}, umaPorVez));
  for (const q of job.m.questoes) { formulasViramFiguras(q); if (q.formulas?.length) q.textoPdf = comFormulas(q.textoPdf, q.formulas); }
}

// ============================================================ reprocessamento de questões com erro
// Toda questão com erro é reprocessada primeiro (recorte guardado + lista dos erros para a IA
// corrigir). "Sem gabarito" não se resolve assim: o gabarito vem só da tabela.
// "sem gabarito" e "recorte incompleto" não se resolvem reprocessando; tabela em imagem só com leitura por imagem
const errosReprocessaveis = q => (q.erros || []).filter(e => !/^sem gabarito|^recorte incompleto/.test(e)
  && !(/os dados só existem na imagem/.test(e) && !comImagens() && ocr.estado === 'falhou')
  && !(/^fórmula em imagem não lida/.test(e) && !comImagens() && formula.estado === 'falhou'));
function comCorrecao(q, erros, ctx) {
  const assuntosValidos = erros.some(e => /assunto/.test(e)) ? (BASE.get(ctx.disciplina + '\u0000' + ctx.topico) || null) : null;
  return {...q, correcao: erros, assuntosValidos, anterior: q.enunciado || null};
}
// Uma rodada: devolve Map numero → questão nova, só quando a nova tem menos erros que a anterior.
async function rodadaCorrecao(itens, ctx, aoAvancar = () => {}, repetir = true) {
  const melhores = new Map(), porLote = porChamada(), sem = [];
  for (let i = 0; i < itens.length; i += porLote) {
    const lote = itens.slice(i, i + porLote);
    const r = await perguntar(promptLote(lote.map(x => comCorrecao(x.q, x.erros, ctx)), ctx), comImagens() ? {images: lote.map(x => x.imagem)} : {});
    const lista = (Array.isArray(r?.questoes) ? r.questoes : []).filter(x => x && typeof x === "object");
    lote.forEach((x, k) => {
      const achada = lista.find(y => +y.numero === x.q.numero) || (lista.length === lote.length ? lista[k] : null);
      if (!achada || !String(achada.enunciado || '').trim()) return sem.push(x);
      const nova = {...x.manter, ...normalizarIA(achada, x.q, ctx), ...x.manter};
      Object.assign(nova, validarQuestao(nova, {tipo: ctx.tipo, disciplina: ctx.disciplina, topico: ctx.topico}));
      if (nova.erros.length < x.erros.length) melhores.set(x.q.numero, nova);
    });
    aoAvancar(Math.min(i + porLote, itens.length), itens.length);
  }
  // a IA pulou alguma questão do lote: pede de novo uma vez
  if (sem.length && repetir) for (const [n, q] of await rodadaCorrecao(sem, ctx, () => {}, false)) melhores.set(n, q);
  return melhores;
}
// Durante a importação: valida o que veio do Claude e reprocessa as questões com erro.
async function corrigirComErro(job) {
  job.fase = 'correcao';
  const ctx = job.ctx, itens = [];
  for (const q of job.m.questoes) {
    const r = job.resultados.get(q.numero);
    if (!r) continue;
    const v = validarQuestao({...r, figuras: q.figuras.map(f => ({nome: f.nome, tabela: !!f.tabela, alternativa: f.alternativa || null, deFormula: !!f.deFormula}))}, {tipo: ctx.tipo, disciplina: ctx.disciplina, topico: ctx.topico});
    const erros = errosReprocessaveis(v);
    if (erros.length) itens.push({q, erros, imagem: q.imagem, manter: {figuras: q.figuras.map(f => ({nome: f.nome, tabela: !!f.tabela, centralizada: !!f.centralizada, alternativa: f.alternativa || null, deFormula: !!f.deFormula}))}});
  }
  job.reprocessadas = 0; job.corrigidas = 0;
  if (!itens.length) return;
  atualizar(job, {etapa: 2, estado: 'rodando', progresso: 0, mensagem: `Reprocessando ${itens.length} questão(ões) com erro…`});
  try {
    const melhores = await rodadaCorrecao(itens, ctx, (f, t) => atualizar(job, {progresso: f / t, mensagem: `Reprocessando questões com erro: ${f} de ${t}…`}));
    for (const [n, nova] of melhores) { const {figuras, erros, avisos, ...resto} = nova; job.resultados.set(n, resto); }
    job.reprocessadas = itens.length; job.corrigidas = melhores.size;
  } catch (e) { console.warn('reprocessamento adiado', e); job.reprocessadas = 0; }
}
// Questões já no banco: baixa o recorte guardado e reprocessa.
async function baixarImagem(id) {
  try { const r = await fetch(blobUrl(id)); if (r.ok) return await r.blob(); } catch {}
  const img = new Image(); img.src = blobUrl(id); await img.decode();
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
}
let reprocessando = false;
async function reprocessarQuestoes(qs) {
  if (reprocessando || !qs.length) return;
  if (!cap.sample) return toast('O Claude não está disponível nesta visualização.');
  reprocessando = true; desenhar();
  let corrigidas = 0, feitas = 0;
  try {
    const porImp = new Map();
    for (const q of qs) { if (!porImp.has(q.origem)) porImp.set(q.origem, []); porImp.get(q.origem).push(q); }
    for (const [idImp, grupo] of porImp) {
      const imp = estado.importacoes.get(idImp);
      if (!imp) continue;
      const ctx = {titulo: imp.titulo, tipo: imp.tipo, gabarito: imp.gabarito || {}, disciplina: imp.disciplina, topico: imp.topico,
        simulado: imp.tipo === 'simulado' ? dadosSimulado(imp.arquivo) : null};
      const itens = [];
      for (const q0 of grupo) {
        let q = q0;
        if (!comImagens() && (q.figuras || []).some(f => f.tabela)) {   // sem imagem: OCR das tabelas-imagem guardadas
          const lidas = {};
          for (const f of q.figuras.filter(f => f.tabela)) { try { const l = await ocrDaFigura(await baixarImagem(f.asset)); if (l) lidas[f.nome] = l; } catch (e) { console.warn('OCR', e); } }
          if (Object.keys(lidas).length) q = {...q, ocr: lidas, textoPdf: comTabelasOcr(q.textoPdf, q.figuras, lidas)};
        }
        if (!comImagens() && (q.formulas || []).some(f => !f.latex && f.asset)) {   // sem imagem: lê as fórmulas guardadas
          const formulas = [];
          for (const f of q.formulas) {
            if (f.latex || !f.asset) { formulas.push(f); continue; }
            try { formulas.push({...f, ...(await lerFormula({blob: await baixarImagem(f.asset)}) || {})}); } catch (e) { console.warn('fórmula', e); formulas.push(f); }
          }
          q = {...q, formulas, figuras: [...(q.figuras || [])]};
          formulasViramFiguras(q);   // o recorte guardado (asset) passa a ser a figura
          q.textoPdf = comFormulas(q.textoPdf, q.formulas);
        }
        itens.push({q, erros: errosReprocessaveis(q0), imagem: comImagens() ? await baixarImagem(q.imagem) : null,
        manter: {imagem: q.imagem, figuras: q.figuras, formulas: (q.formulas || []).map(({blob, comoFigura, ...f}) => f), gabaritoRecorte: q.gabaritoRecorte || null}});
      }
      const melhores = await rodadaCorrecao(itens, ctx, (f) => toast(`Reprocessando: ${feitas + f} de ${qs.length}…`));
      feitas += grupo.length;
      const porParte = new Map();
      for (const q of grupo) if (melhores.has(q.numero)) { if (!porParte.has(q.parte_id)) porParte.set(q.parte_id, []); porParte.get(q.parte_id).push(melhores.get(q.numero)); }
      for (const [pid, novas] of porParte) {
        const parte = estado.partes.get(pid);
        const questoes = parte.questoes.map(x => { const n = novas.find(y => y.numero === x.numero); return n ? {...n, revisada: false} : x; });
        await cap.db.doc(`partes/${pid}`).set({...parte, questoes});
        corrigidas += novas.length;
      }
    }
    toast(`Reprocessamento concluído: ${corrigidas} de ${qs.length} questão(ões) corrigida(s).${corrigidas < qs.length ? ' As demais continuam com erro para revisão.' : ''}`);
  } catch (e) {
    toast(e?.code === 'rate_limited' ? 'Limite de uso do Claude atingido. Tente de novo em alguns minutos.' : `Reprocessamento parou: ${e?.message || e?.code || e}`);
  } finally { reprocessando = false; desenhar(); }
}

// ============================================================ processamento de um PDF
function novoJob(arquivo) {
  const job = {id: 'j' + Date.now() + Math.random().toString(36).slice(2, 6), arquivo: arquivo.name, file: arquivo,
    etapa: 0, estado: 'rodando', mensagem: 'Lendo o PDF…', progresso: 0, m: null, ctx: null, resultados: new Map(), pendentes: []};
  estado.jobs.unshift(job);
  return job;
}
function atualizar(job, campos) { Object.assign(job, campos); if (tela.nome === 'enviar') desenharEnvios(); }

// ---------------- previsão de término (cartão de cada lista)
// Custos típicos de cada passo; a transcrição usa o ritmo medido assim que as primeiras respostas chegam.
const CUSTO_MS = {pagina: 700, tabela: 6000, formula: 2500, chamada: 75000, classificacao: 25000, gravacaoQ: 150};
const FASES = ['recorte', 'ocr', 'formulas', 'classificacao', 'transcricao', 'correcao', 'gravacao'];
function previsaoMs(job) {
  if (job.estado !== 'rodando' || !job.fase) return null;
  const m = job.m, n = m?.questoes?.length || Math.round((job.paginas || 0) * 3.5);   // antes de recortar: ~3,5 questões/página
  if (!n) return null;
  const lote = porChamada();
  const feitas = job.resultados?.size || 0;
  const ritmo = job.trans && feitas - job.trans.feitas0 >= lote ? (Date.now() - job.trans.inicio) / (feitas - job.trans.feitas0) : null;   // ms por questão
  const transcrever = q => ritmo ? q * ritmo : Math.ceil(q / lote / SIMULTANEAS) * CUSTO_MS.chamada;
  const semImagem = !comImagens();
  const tabelas = semImagem && m ? m.questoes.reduce((a, q) => a + (q.figuras || []).filter(f => f.tabela && !(q.ocr && q.ocr[f.nome])).length, 0) : 0;
  const formulas = semImagem && m ? m.questoes.reduce((a, q) => a + (q.formulas || []).filter(f => !f.latex && !f.comoFigura).length, 0) : 0;
  const resto = {
    recorte: job.fase === 'recorte' ? (job.paginas || 0) * (1 - (job.progresso || 0)) * CUSTO_MS.pagina * (job.lendo ? 1.3 : 1) : 0,
    ocr: tabelas * CUSTO_MS.tabela,
    formulas: formulas * CUSTO_MS.formula / Math.max(1, formula.leitor?.paralelos?.() || 1),
    classificacao: CUSTO_MS.classificacao,
    transcricao: transcrever(n - feitas),
    correcao: 0.12 * transcrever(n),
    gravacao: n * CUSTO_MS.gravacaoQ * (job.fase === 'gravacao' ? 1 - (job.progresso || 0) : 1),
  };
  const i = FASES.indexOf(job.fase);
  return FASES.slice(Math.max(0, i)).reduce((a, f) => a + (resto[f] || 0), 0);
}
const mmss = ms => { const t = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(t / 3600), mi = Math.floor(t % 3600 / 60), se = t % 60;
  return h ? `${h}h${String(mi).padStart(2, '0')}` : `${mi}:${String(se).padStart(2, '0')}`; };
function textoTempo(job) {
  if (job.estado === 'fila') return 'Na fila: começa quando uma das listas em andamento terminar.';
  if (!job.inicio || ['concluido', 'falhou', 'duplicado', 'gabarito'].includes(job.estado)) return '';
  const decorrido = `⏱ ${mmss(Date.now() - job.inicio)} decorridos`;
  if (job.estado === 'parado') return decorrido + ' · pausada';
  const falta = previsaoMs(job);
  if (falta === null) return decorrido + ' · calculando o tempo restante…';
  const fim = new Date(Date.now() + falta).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});
  return `${decorrido} · faltam ~${falta < 60000 ? 'menos de 1 min' : Math.ceil(falta / 60000) + ' min'} · deve terminar por volta de ${fim}`;
}
setInterval(() => {   // o relógio anda sozinho, sem redesenhar os cartões
  document.querySelectorAll('[data-tempo-job]').forEach(el => { const j = estado.jobs.find(x => x.id === el.dataset.tempoJob); if (j) el.textContent = textoTempo(j); });
}, 1000);

async function processar(job, {reprocessar = false} = {}) {
  job.inicio ||= Date.now();
  try {
    if (!job.m) {
      atualizar(job, {etapa: 0, estado: 'rodando', mensagem: 'Recortando questões e figuras…', progresso: 0});
      await pdfjsPronto;
      job.fase = 'recorte';
      job.m = await UPQRecorte.segmentar(job.file, p => atualizar(job, {mensagem: p.etapa === 'lendo' ? `Lendo a página ${p.pagina} de ${p.total}…` : `Recortando a página ${p.pagina} de ${p.total}…`,
        progresso: p.pagina / p.total, paginas: p.total, lendo: p.etapa === 'lendo'}));
      if (!job.m.questoes.length) return atualizar(job, {estado: 'falhou', mensagem: 'Nenhuma barra "Questão NN" encontrada. Este PDF segue outro modelo de lista.'});
      job.idImp = job.m.hash.slice(0, 16);
      if (estado.jobs.some(j => j !== job && j.idImp === job.idImp && ['rodando', 'parado'].includes(j.estado)))
        return atualizar(job, {estado: 'duplicado', mensagem: 'Este mesmo PDF já está sendo processado em outro cartão.'});
      if (estado.importacoes.has(job.idImp) && !reprocessar)
        return atualizar(job, {estado: 'duplicado', mensagem: `Esta lista já está no banco (${job.m.questoes.length} questões). Reprocessar substitui a transcrição.`});
    }
    const m = job.m;
    if (!job.ctx) {
      if (!comImagens()) { atualizar(job, {etapa: 1, estado: 'rodando', progresso: 0, mensagem: 'Testando se o Claude recebe imagens nesta visualização…'}); await sondarImagens(); }
      if (!comImagens()) { await lerTabelasPorOcr(job); await lerFormulasPorOcr(job); }
      atualizar(job, {etapa: 1, estado: 'rodando', progresso: 0, mensagem: `${m.questoes.length} questões recortadas. Lendo o gabarito e classificando a lista…`});
      // Gabarito obrigatório e sempre da tabela do fim da lista: lido no navegador; se não der,
      // o Claude lê a imagem da tabela; se ainda faltar, a lista para aqui (nada é transcrito).
      const completo = g => m.questoes.every(q => g[nn(q.numero)]);
      let gabarito = m.gabaritoPdf, origem = 'tabela do PDF';
      if (!completo(gabarito) && m.paginaGabarito && comImagens()) {
        atualizar(job, {mensagem: 'Lendo a tabela de gabarito com o Claude…'});
        gabarito = await lerGabarito(m.paginaGabarito).catch(() => ({}));
        origem = 'tabela do PDF (lida pelo Claude)';
      }
      if (!completo(gabarito)) {
        const faltam = m.questoes.filter(q => !gabarito[nn(q.numero)]).map(q => nn(q.numero));
        const motivo = m.gabaritoMotivo || `faltam as questões ${faltam.join(', ')}`;
        guardarFalhaGabarito(job, motivo).catch(() => {});
        return atualizar(job, {estado: 'gabarito', mensagem: `Não consegui ler a tabela de gabarito automaticamente (${motivo}). A lista não foi processada e nada foi enviado ao Claude.`});
      }
      job.fase = 'classificacao';
      const classe = m.tipo === 'lista' ? await classificar(m) : null;
      job.ctx = {titulo: m.titulo, tipo: m.tipo, gabarito, gabaritoOrigem: origem, disciplina: classe?.disciplina || null, topico: classe?.topico || null,
                 classificacao: classe, simulado: m.tipo === 'simulado' ? dadosSimulado(m.arquivo) : null};
      const porLote = porChamada();
      job.pendentes = [];
      for (let i = 0; i < m.questoes.length; i += porLote) job.pendentes.push({questoes: m.questoes.slice(i, i + porLote), tentativas: 0});
    }
    await transcreverPendentes(job);
    if (job.pendentes.length) return;   // parou: o botão "Continuar" retoma
    await corrigirComErro(job);
    await salvarNoBanco(job);
  } catch (e) {
    console.error(e);
    pararComErro(job, e);
  }
}

function pararComErro(job, e) {
  const codigo = e?.code;
  const msgs = {
    not_granted: 'O uso do Claude não foi permitido neste artefato. Recarregue a página e permita para continuar.',
    rate_limited: 'Limite de uso do Claude atingido por agora. Espere alguns minutos e clique em Continuar.',
    session_expired: 'Sua sessão expirou. Entre de novo no claude.ai e clique em Continuar.',
    images_unavailable: 'Esta visualização não consegue enviar imagens ao Claude. Abra o artefato no claude.ai pelo navegador.',
    sem_claude: 'O Claude não está disponível nesta visualização. Abra o artefato no claude.ai.',
  };
  // Limite de uso ou falha passageira do Claude: retoma sozinho depois de uma pausa (até MAX_RETOMADAS),
  // para uma fila de várias listas não parar no meio esperando um clique.
  const passageiro = ['rate_limited', 'upstream_error', 'empty_completion', 'invalid_json', 'timeout', 'overloaded', 'incompleto'].includes(codigo);
  job.retomadas = job.retomadas || 0;
  if (passageiro && job.retomadas < MAX_RETOMADAS && estado.jobs.includes(job)) {
    const espera = codigo === 'rate_limited' ? Math.min(600, 90 * 2 ** Math.min(3, job.retomadas)) : 20;
    job.retomadas++;
    let falta = espera;
    atualizar(job, {estado: 'parado', mensagem: `${codigo === 'rate_limited' ? 'Limite de uso do Claude atingido' : 'O Claude não respondeu direito'}. Retomando sozinho em ${falta} s (tentativa ${job.retomadas} de ${MAX_RETOMADAS})…`});
    job.contagem = setInterval(() => {
      if (job.estado !== 'parado' || !estado.jobs.includes(job)) { clearInterval(job.contagem); return; }
      if (--falta > 0) return atualizar(job, {mensagem: job.mensagem.replace(/em \d+ s/, `em ${falta} s`)});
      clearInterval(job.contagem); enfileirar(job);
    }, 1000);
    return;
  }
  atualizar(job, {estado: 'parado', mensagem: msgs[codigo] || `Parou: ${e?.message || codigo || e}. Clique em Continuar para tentar de novo.`});
}

async function transcreverPendentes(job) {
  job.fase = 'transcricao';
  job.trans = {inicio: Date.now(), feitas0: job.resultados.size};   // ritmo medido desta rodada
  const total = job.m.questoes.length;
  atualizar(job, {etapa: 1, estado: 'rodando', mensagem: `Transcrevendo com o Claude: ${job.resultados.size} de ${total} questões…`, progresso: job.resultados.size / total});
  let erroFatal = null;
  const trabalhador = async () => {
    while (job.pendentes.length && !erroFatal) {
      const lote = job.pendentes.shift();
      try {
        const r = await perguntar(promptLote(lote.questoes, job.ctx), comImagens() ? {images: lote.questoes.map(q => q.imagem)} : {});
        const lista = (Array.isArray(r?.questoes) ? r.questoes : []).filter(x => x && typeof x === "object");
        lote.questoes.forEach((q, i) => {
          const achada = lista.find(x => +x.numero === q.numero) || (lista.length === lote.questoes.length ? lista[i] : null);
          if (achada && String(achada.enunciado || '').trim()) job.resultados.set(q.numero, normalizarIA(achada, q, job.ctx));
        });
        const faltaram = lote.questoes.filter(q => !job.resultados.has(q.numero));
        if (faltaram.length && lote.tentativas < 1) job.pendentes.push({questoes: faltaram, tentativas: lote.tentativas + 1});
        else if (faltaram.length) { job.pendentes.unshift({questoes: faltaram, tentativas: 0}); erroFatal = {code: 'incompleto', message: `a IA não devolveu as questões ${faltaram.map(q => nn(q.numero)).join(', ')}`}; }
      } catch (e) {
        const transitorio = ['invalid_json', 'upstream_error', 'empty_completion', 'timeout', 'overloaded'].includes(e?.code);
        if (transitorio && lote.tentativas < 1) job.pendentes.push({...lote, tentativas: lote.tentativas + 1});
        else { job.pendentes.unshift({...lote, tentativas: 0}); erroFatal = e; }
      }
      atualizar(job, {mensagem: `Transcrevendo com o Claude: ${job.resultados.size} de ${total} questões…`, progresso: job.resultados.size / total});
    }
  };
  await Promise.all(Array.from({length: SIMULTANEAS}, trabalhador));
  if (erroFatal) throw erroFatal;
}

// Tabela que o leitor não conseguiu ler: guarda a página e o motivo (coleção "falhas") para
// ajustar o leitor sem precisar do PDF.
async function guardarFalhaGabarito(job, motivo) {
  if (!cap.db || !cap.assets || job.falhaGuardada) return;
  job.falhaGuardada = true;
  const imagem = job.m.paginaGabarito ? (await cap.assets.upload(job.m.paginaGabarito, {type: 'image/jpeg'})).id : null;
  await cap.db.doc(`falhas/${job.idImp}`).set({arquivo: job.m.arquivo, hash: job.m.hash, motivo, gabaritoImagem: imagem,
    questoes: job.m.questoes.length, criado_em: agora()});
}

async function salvarNoBanco(job) {
  job.fase = 'gravacao';
  if (!cap.db || !cap.assets) throw {message: 'só quem pode editar este artefato grava no banco'};
  const m = job.m, ctx = job.ctx, id = job.idImp;

    const up = await cap.assets.upload(q.imagem, {type: 'image/jpeg'});
    const figuras = [];
    for (const f of q.figuras) figuras.push({nome: f.nome, centralizada: !!f.centralizada, tabela: !!f.tabela, alternativa: f.alternativa || null, deFormula: !!f.deFormula, asset: (await cap.assets.upload(f.blob, {type: 'image/png'})).id});

    const gabaritoRecorte = recGab ? (await cap.assets.upload(recGab, {type: 'image/png'})).id : null;

    }

  const gabaritoImagem = m.paginaGabarito ? (await cap.assets.upload(m.paginaGabarito, {type: 'image/jpeg'})).id : null;
  atualizar(job, {etapa: 3, mensagem: 'Gravando no banco…', progresso: 0.5});
  const tags = [...new Set(questoes.flatMap(q => q.assuntos))];
  const nPartes = Math.ceil(questoes.length / QUESTOES_POR_PARTE);
  for (let k = 0; k < nPartes; k++)
    await cap.db.doc(`partes/${id}-${k}`).set({importacao: id, fatia: id[0], parte: k, questoes: questoes.slice(k * QUESTOES_POR_PARTE, (k + 1) * QUESTOES_POR_PARTE)});
  for (const [pid, parte] of estado.partes)   // reprocessamento com menos questões: some com as partes que sobraram

    disciplina: ctx.disciplina, topico: ctx.topico, tags, total: questoes.length, etapas: m.etapas, gabarito: ctx.gabarito, gabaritoOrigem: ctx.gabaritoOrigem, gabaritoImagem, modoLeitura: comImagens() ? 'imagem' : 'texto', testeImagem: cap.sonda || null, ocrEstado: ocr.estado, ocrErro: ocr.erro, formulaEstado: formula.estado, formulaErro: formula.erro,
    classificacao: ctx.classificacao, criado_em: estado.importacoes.get(id)?.criado_em || agora(), atualizado_em: agora()});
  const padrao = [...estado.listas.entries()].find(([, l]) => l.origem === id);
  const listaId = padrao ? padrao[0] : id;
  await cap.db.doc(`listas/${listaId}`).set({...(padrao?.[1] || {}), nome: `Lista de ${m.titulo}`, descricao: `Lista completa de ${m.titulo}`,
    disciplina: ctx.disciplina, topico: ctx.topico, tags, origem: id, questoes: questoes.map(q => `${id}:${nn(q.numero)}`),
    status: padrao?.[1]?.status || 'rascunho', criado_em: padrao?.[1]?.criado_em || agora(), atualizado_em: agora()});
  const erros = questoes.filter(q => q.erros.length).length, avisos = questoes.filter(q => q.avisos.length).length;

      + (job.inicio ? ` · processada em ${Math.max(1, Math.round((Date.now() - job.inicio) / 60000))} min` : '')});

// Liberar espaço: apaga as imagens que nenhuma questão do banco usa (sobras de listas apagadas ou de
// importações interrompidas), os registros de importação sem questões e os registros de falha de gabarito.
// Nunca toca em imagem de questão que está no banco. Só roda sem lista em processamento.
let liberando = false;
async function liberarEspaco() {
  if (liberando || !cap.assets?.list || !cap.db) return;
  if (estado.jobs.some(j => ['rodando', 'fila', 'parado'].includes(j.estado))) return toast('Espere as listas em processamento terminarem (ou descarte-as) antes de liberar espaço.');
  liberando = true; desenhar();
  try {
    const usadas = new Set();
    for (const parte of estado.partes.values()) for (const q of parte.questoes || []) {
      [q.imagem, q.gabaritoRecorte, ...(q.figuras || []).map(f => f.asset), ...(q.formulas || []).map(f => f.asset)].forEach(id => id && usadas.add(id));
    }
    const comQuestoes = new Set([...estado.partes.values()].map(p => p.importacao));
    for (const [id, imp] of estado.importacoes) if (comQuestoes.has(id) && imp.gabaritoImagem) usadas.add(imp.gabaritoImagem);
    // registros sem questões e falhas antigas de gabarito
    for (const id of [...estado.importacoes.keys()].filter(id => !comQuestoes.has(id))) await cap.db.doc(`importacoes/${id}`).delete().catch(() => {});
    const falhas = await cap.db.collection('falhas').limit(1000).get().catch(() => null);
    for (const d of falhas?.docs || []) await cap.db.doc(`falhas/${d.id}`).delete().catch(() => {});
    const {assets = []} = await cap.assets.list();
    const sobras = assets.filter(a => !usadas.has(a.id));
    let feitas = 0, proxima = 0;
    await Promise.all(Array.from({length: 6}, async () => {
      while (proxima < sobras.length) {
        const a = sobras[proxima++];
        await cap.assets.delete(a.id).catch(() => {});
        if (++feitas % 50 === 0) toast(`Liberando espaço: ${feitas} de ${sobras.length} imagens apagadas…`);
      }
    }));
    toast(`Espaço liberado: ${feitas} imagens sem uso apagadas${usadas.size ? `; ${usadas.size} imagens das questões do banco foram mantidas` : ''}.`);
  } catch (e) { toast(`Não foi possível liberar o espaço: ${e?.message || e?.code || e}`); }
  finally { liberando = false; await medirArmazenamento(); }
}
function liberarJob(job) {
  medirArmazenamento();

          erros: qs.filter(q => q.erros?.length).length, avisos: qs.filter(q => q.avisos?.length).length};

// ============================================================ exclusão em massa
// Questões: saem das partes (parte vazia é apagada), das listas que as usam e, quando a
// importação fica sem questões, a importação some (o PDF pode ser reenviado). As imagens
// das questões excluídas são apagadas do armazenamento do artefato.
async function excluirQuestoes(ids) {
  if (!cap.db || !ids.length) return;
  excluindo = true; desenhar();
  const alvo = new Set(ids), imagens = [];
  try {
    const porParte = new Map();
    for (const [pid, parte] of estado.partes) {
      const sai = (parte.questoes || []).filter(q => alvo.has(`${parte.importacao}:${nn(q.numero)}`));
      if (sai.length) porParte.set(pid, {parte, sai});
    }
    for (const [pid, {parte, sai}] of porParte) {
      const resto = parte.questoes.filter(q => !sai.includes(q));
      if (resto.length) await cap.db.doc(`partes/${pid}`).set({...parte, questoes: resto});
      else await cap.db.doc(`partes/${pid}`).delete();
      for (const q of sai) imagens.push(q.imagem, q.gabaritoRecorte, ...(q.figuras || []).map(f => f.asset), ...(q.formulas || []).map(f => f.asset));
    }
    const tocadas = new Set([...porParte.values()].map(x => x.parte.importacao));
    for (const idImp of tocadas) {
      const restam = [...estado.partes.entries()].filter(([pid, p]) => p.importacao === idImp)
        .reduce((n, [pid, p]) => n + (porParte.has(pid) ? p.questoes.length - porParte.get(pid).sai.length : p.questoes.length), 0);
      const imp = estado.importacoes.get(idImp);
      if (!imp) continue;
      if (restam) await cap.db.doc(`importacoes/${idImp}`).set({...imp, total: restam, atualizado_em: agora()});
      else { await cap.db.doc(`importacoes/${idImp}`).delete(); if (imp.gabaritoImagem) imagens.push(imp.gabaritoImagem); }
    }
    for (const [lid, l] of estado.listas) {
      const resto = (l.questoes || []).filter(id => !alvo.has(id));
      if (resto.length !== (l.questoes || []).length) await cap.db.doc(`listas/${lid}`).set({...l, questoes: resto, atualizado_em: agora()});
    }
    toast(`${ids.length} questão(ões) excluída(s).`);
  } catch (e) { toast(`A exclusão parou: ${e.message || e.code}. Recarregue a página e confira.`); }
  finally { excluindo = false; }
  if (cap.assets) for (const id of imagens.filter(Boolean)) await cap.assets.delete(id).catch(() => {});
}
async function excluirListas(ids, comQuestoes) {
  if (!cap.db || !ids.length) return;
  const questoes = comQuestoes ? [...new Set(ids.flatMap(id => estado.listas.get(id)?.questoes || []))] : [];
  excluindo = true; desenhar();
  try { for (const id of ids) await cap.db.doc(`listas/${id}`).delete(); }
  catch (e) { excluindo = false; return toast(`A exclusão parou: ${e.message || e.code}`); }
  for (const id of ids) estado.listas.delete(id);   // as questões não ficam "presas" nas listas recém-excluídas
  excluindo = false;
  if (questoes.length) await excluirQuestoes(questoes);
  toast(`${ids.length} lista(s) excluída(s)` + (questoes.length ? ` e ${questoes.length} questão(ões) do banco.` : '. As questões continuam no banco.'));
}

async function salvarLista(id, campos) {
  const l = estado.listas.get(id);
  try { await cap.db.doc(`listas/${id}`).set({...l, ...campos, atualizado_em: agora()}); }
  catch (e) { toast(`Não foi possível salvar: ${e.message || e.code}`); }
}

  document.getElementById('form-lista')?.addEventListener('submit', async e => {
    e.preventDefault();
    const nome = document.getElementById('lista-nome').value.trim();
    if (!nome) return toast('Dê um nome para a lista.');
    await salvarLista(id, {nome, descricao: document.getElementById('lista-descricao').value.trim()}); toast('Lista salva.');
    document.activeElement?.blur(); desenhar();
  });
  principal.querySelectorAll('[data-mover]').forEach(b => b.onclick = () => {
    const i = +b.dataset.mover, j = i + +b.dataset.dir, ordem = naLista.map(q => q.id);
    [ordem[i], ordem[j]] = [ordem[j], ordem[i]]; salvarLista(id, {questoes: ordem});
  });
  principal.querySelectorAll('[data-tirar]').forEach(b => b.onclick = () => salvarLista(id, {questoes: l.questoes.filter(x => x !== b.dataset.tirar)}));
  principal.querySelectorAll('[data-por]').forEach(b => b.onclick = () => salvarLista(id, {questoes: [...l.questoes, b.dataset.por]}));
  principal.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => abrirModal(b.dataset.ver));
  document.getElementById('excluir')?.addEventListener('click', () => { confirmandoExclusao = true; desenhar(); });
  document.getElementById('nao-excluir')?.addEventListener('click', () => { confirmandoExclusao = false; desenhar(); });
  document.getElementById('sim-excluir')?.addEventListener('click', async () => { confirmandoExclusao = false; await cap.db.doc(`listas/${id}`).delete(); toast('Lista excluída.'); ir('listas'); });
  document.getElementById('baixar-xlsx')?.addEventListener('click', () => baixarXlsx(l, naLista));
  document.getElementById('baixar-json')?.addEventListener('click', () => baixarJson(l, naLista));
}

// ---------------- detalhe e edição de uma questão
function figurasDe(q) { return Object.fromEntries((q.figuras || []).map(f => [f.nome, blobUrl(f.asset)])); }
function detalheQuestao(q, comBotoes) {
  const figs = figurasDe(q);
  const alts = Object.entries(q.alternativas || {}).map(([letra, texto]) => `
    <div class="alt"><span class="letra">${letra}</span><div class="conteudo">${md(texto, figs)}</div>
      <span class="chave ${letra === q.gabarito ? 'on' : ''}" role="img" aria-label="${letra === q.gabarito ? 'Correta' : 'Incorreta'}"></span></div>`).join('');
  return `
    <div class="cab" style="margin:0"><h2>Detalhes da questão</h2>${comBotoes && cap.db ? `<div class="form-linha">
      ${q.avisos?.length && !q.erros?.length ? '<button class="botao" data-acao-q="revisada">Marcar como revisada</button>' : ''}
      ${cap.sample && errosReprocessaveis(q).length ? `<button class="botao primario" data-acao-q="reprocessar" ${reprocessando ? 'disabled' : ''}>Reprocessar</button>` : ''}
      <button class="botao" data-acao-q="editar">Editar</button></div>` : ''}</div>
    ${q.erros?.length ? `<ul class="avisos erro sem-tex">${q.erros.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    ${q.avisos?.length ? `<ul class="avisos alerta sem-tex">${q.avisos.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    <div><div class="rotulo">Título da pergunta (uso interno)</div><div class="valor">${esc(q.titulo)}</div></div>
    <div class="grade">
      <div><div class="rotulo">Instituição</div><div class="valor">${esc(q.instituicao || '—')}</div></div>
      <div><div class="rotulo">Disciplina</div><div class="valor">${esc(q.disciplina)}</div></div>
      <div><div class="rotulo">Tópico</div><div class="valor">${esc(q.topico)}</div></div></div>
    <div><div class="rotulo">Enunciado</div><div class="enunciado">${md(q.enunciado, figs)}</div></div>
    <div><div class="rotulo">Assuntos</div><div class="valor">${(q.assuntos || []).map(a => `<span class="tag">${esc(a)}</span>`).join('') || '—'}</div></div>
    <div class="grade duas">
      <div><div class="rotulo">Dificuldade da questão</div><div class="valor">${DIFICULDADE[q.dificuldade] || '—'}${q.etapa ? ` <span class="sub sem-tex">· etapa ${esc(q.etapa)}</span>` : ''}</div></div>
      <div><div class="rotulo">Ano</div><div class="valor num">${q.ano || '—'}</div></div></div>
    <div><div class="rotulo">Alternativas</div><div class="alternativas">
      <div class="alt cab-alt"><span>#</span><span>Conteúdo da alternativa</span><span style="justify-self:center">Correta?</span></div>${alts}</div></div>
    <div><div class="rotulo">Gabarito (tabela do PDF)</div><div class="gab-tabela"><span class="valor num">${esc(q.gabarito || '—')}</span>
      ${q.gabaritoRecorte ? `<img src="${blobUrl(q.gabaritoRecorte)}" alt="Linha da questão ${q.numero} na tabela de gabarito" loading="lazy">` : ''}</div></div>
    <details class="original"><summary>Ver original no PDF (${esc(q.lista_origem)}, página ${q.pagina})</summary><img src="${blobUrl(q.imagem)}" alt="Recorte original da questão ${q.numero}" loading="lazy"></details>`;
}
function formEdicao(q) {
  const assuntos = BASE.get(q.disciplina + '\u0000' + q.topico) || [];
  const opcoesAss = (assuntos.length ? assuntos : [q.topico]);
  return `
    <div class="cab" style="margin:0"><h2>Editar questão ${nn(q.numero)}</h2></div>
    <p class="sub sem-tex">Texto em Markdown com LaTeX entre $...$. Figuras: ![descrição](figura:NOME) com ${(q.figuras || []).map(f => f.nome).join(', ') || 'nenhuma figura'}.</p>
    <form id="form-q" class="detalhe" style="padding:0">
      <div class="grade">
        <label class="rotulo-campo">Instituição<input class="campo" name="instituicao" value="${esc(q.instituicao || '')}"></label>
        <label class="rotulo-campo">Ano<input class="campo" name="ano" inputmode="numeric" value="${esc(q.ano || '')}"></label>
        <label class="rotulo-campo">Dificuldade<select class="campo" name="dificuldade">${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${n === q.dificuldade ? 'selected' : ''}>${DIFICULDADE[n]}</option>`).join('')}</select></label></div>
      <div class="rotulo-campo">Assuntos<div class="valor">${opcoesAss.map(a => `<label style="margin-right:12px;white-space:nowrap"><input type="checkbox" name="assunto" value="${esc(a)}" ${(q.assuntos || []).includes(a) ? 'checked' : ''}> ${esc(a)}</label>`).join('')}</div></div>
      <label class="rotulo-campo">Enunciado<textarea class="campo" name="enunciado" rows="10">${esc(q.enunciado)}</textarea></label>
      ${'ABCDE'.split('').map(l => `<label class="rotulo-campo">Alternativa ${l}${l === 'E' ? ' (deixe vazia se não houver)' : ''}<textarea class="campo" name="alt_${l}" rows="2" style="min-height:52px">${esc(q.alternativas?.[l] || '')}</textarea></label>`).join('')}
      <label class="rotulo-campo">Gabarito<select class="campo" name="gabarito">${q.gabarito ? '' : '<option value="" selected>—</option>'}${'ABCDE'.split('').map(l => `<option ${l === q.gabarito ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <div class="form-linha"><button class="botao primario" type="submit">Salvar alterações</button><button class="botao" type="button" data-acao-q="cancelar">Cancelar</button></div>
    </form>`;
}
async function gravarQuestao(q, mudancas) {
  const parte = estado.partes.get(q.parte_id);
  if (!parte) return toast('Não encontrei a questão no banco.');
  const imp = estado.importacoes.get(parte.importacao);
  const questoes = parte.questoes.map(x => {
    if (x.numero !== q.numero) return x;
    const nova = {...x, ...mudancas};
    nova.titulo = titulo(imp?.tipo, imp?.titulo, nova.numero, nova.instituicao, nova.ano, imp?.tipo === 'simulado' ? dadosSimulado(imp.arquivo) : null);
    return {...nova, ...validarQuestao(nova, {tipo: imp?.tipo, disciplina: imp?.disciplina, topico: imp?.topico})};
  });
  try { await cap.db.doc(`partes/${q.parte_id}`).set({...parte, questoes}); toast('Questão salva.'); }
  catch (e) { toast(`Não foi possível salvar: ${e.message || e.code}`); }
}
function ligarDetalhe(raiz, q, aoFechar) {
  raiz.querySelectorAll('[data-acao-q]').forEach(b => b.addEventListener('click', async () => {
    const acao = b.dataset.acaoQ;
    if (acao === 'editar') trocarConteudo(raiz, formEdicao(q), q, aoFechar);
    else if (acao === 'cancelar') { trocarConteudo(raiz, detalheQuestao(q, true), q, aoFechar); }
    else if (acao === 'revisada') { await gravarQuestao(q, {revisada: true}); aoFechar?.(); }
    else if (acao === 'reprocessar') { b.disabled = true; b.textContent = 'Reprocessando…'; await reprocessarQuestoes([q]); aoFechar?.(); }
  }));
  raiz.querySelector('#form-q')?.addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(e.target), alternativas = {};
    for (const l of 'ABCDE') { const t = String(f.get('alt_' + l) || '').trim(); if (t) alternativas[l] = normalizarTexto(t); }
    const ano = parseInt(f.get('ano'), 10);
    await gravarQuestao(q, {instituicao: String(f.get('instituicao') || '').trim() || null, ano: Number.isInteger(ano) ? ano : null,
      dificuldade: +f.get('dificuldade'), assuntos: f.getAll('assunto').map(String), enunciado: normalizarTexto(String(f.get('enunciado') || '').trim()),
      alternativas, gabarito: String(f.get('gabarito')), revisada: true});
    aoFechar?.(); if (!aoFechar) { document.activeElement?.blur(); desenhar(); }
  });
}
function trocarConteudo(raiz, html, q, aoFechar) {
  const alvo = raiz.querySelector('.conteudo-modal') || raiz;
  alvo.innerHTML = html; ligarDetalhe(raiz, q, aoFechar); tipografar(alvo);
}
function abrirModal(id) {
  const q = banco().find(x => x.id === id);
  if (!q) return;
  const camada = document.getElementById('camada');
  camada.innerHTML = `<div class="modal-fundo" id="modal-fundo"><section class="painel detalhe modal" role="dialog" aria-modal="true" aria-label="Detalhes da questão">
    <div class="barra-modal"><button class="botao" id="fechar">Fechar</button></div><div class="conteudo-modal detalhe" style="padding:0">${detalheQuestao(q, true)}</div></section></div>`;
  const fechar = () => { camada.innerHTML = ''; document.removeEventListener('keydown', teclaEsc); desenhar(); };
  const teclaEsc = e => e.key === 'Escape' && fechar();
  document.addEventListener('keydown', teclaEsc);
  document.getElementById('fechar').onclick = fechar;
  document.getElementById('fechar').focus();
  document.getElementById('modal-fundo').addEventListener('click', e => e.target.id === 'modal-fundo' && fechar());
  const modal = camada.querySelector('.modal');
  ligarDetalhe(modal, q, fechar);
  tipografar(modal);
}

// ---------------- exportação
async function baixar(nome, dados) {
  try { await cap.downloads.save({filename: nome, data: dados}); }
  catch (e) { if (e?.code !== 'declined') toast(`Não foi possível baixar: ${e.message || e.code}`); }
}
const nomeArquivo = l => l.nome.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w-]+/g, '_').replace(/_+/g, '_').slice(0, 80);
function baixarXlsx(l, qs) {
  if (!window.XLSX) return toast('A biblioteca de planilhas ainda está carregando. Tente de novo em alguns segundos.');
  const linhas = [['Nº', 'Título', 'Instituição', 'Ano', 'Disciplina', 'Tópico', 'Dificuldade', 'Enunciado', 'Alternativa A', 'Alternativa B',
    'Alternativa C', 'Alternativa D', 'Alternativa E', 'Gabarito', 'Explicação do Professor']];
  for (const q of qs) linhas.push([nn(q.numero), q.titulo, q.instituicao || '', q.ano || '', q.disciplina, q.topico, q.dificuldade, q.enunciado,
    ...'ABCDE'.split('').map(x => q.alternativas?.[x] || ''), q.gabarito, '']);
  const ws = XLSX.utils.aoa_to_sheet(linhas);
  ws['!cols'] = [5, 50, 14, 6, 12, 18, 10, 70, 30, 30, 30, 30, 30, 9, 30].map(w => ({wch: w}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Questões');
  baixar(nomeArquivo(l) + '.xlsx', new Blob([XLSX.write(wb, {bookType: 'xlsx', type: 'array'})]));
}
function baixarJson(l, qs) {
  const limpa = q => { const {parte_id, criado_em, textoPdf, ...resto} = q; return resto; };
  baixar(nomeArquivo(l) + '.json', JSON.stringify({lista: {nome: l.nome, descricao: l.descricao, disciplina: l.disciplina, topico: l.topico, tags: l.tags},
    questoes: qs.map(limpa)}, null, 2));
}

desenhar();
iniciarCapacidades();
</script>
