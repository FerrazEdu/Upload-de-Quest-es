<style>
/* Layout: barra lateral fixa com as duas telas (Enviar lista, Listas) + área de trabalho.

  --fonte: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --raio: 8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f4f7; --painel: #ffffff; --campo: #f6f7f9; --borda: #dfe2e8; --borda-forte: #c9ced7;
  --texto: #181b21; --suave: #5b6270; --fraco: #8a909b;
  --acento: #2f63e6; --acento-fundo: #e7eeff; --acento-texto: #ffffff;
  --ok: #1f8a55; --ok-fundo: #e2f4ea; --alerta: #a86b00; --alerta-fundo: #fbf0d9;
  --erro: #c43a3a; --erro-fundo: #fbe5e5; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f3f4f7; --painel: #ffffff; --campo: #f6f7f9; --borda: #dfe2e8; --borda-forte: #c9ced7;
  --texto: #181b21; --suave: #5b6270; --fraco: #8a909b;
  --acento: #2f63e6; --acento-fundo: #e7eeff; --acento-texto: #ffffff;
  --ok: #1f8a55; --ok-fundo: #e2f4ea; --alerta: #a86b00; --alerta-fundo: #fbf0d9;
  --erro: #c43a3a; --erro-fundo: #fbe5e5; color-scheme: light; }

button, input, select { font: inherit; color: inherit; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }

<script>
const DEMO = window.UPQ_DEMO || null;
const ETAPAS = ['Recorte', 'Transcrição', 'Validação', 'No banco'];
const DIFICULDADE = {1: 'Muito Fácil', 2: 'Fácil', 3: 'Média', 4: 'Difícil', 5: 'Muito Difícil'};
const LIMITE_LINHAS = 300;

// ---------- utilidades ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const tituloCurto = t => (String(t || '').match(/Questão \d+/) || [t])[0];
const ICONE = {
  ver: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  tirar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>',
  por: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>',
  subir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
  descer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
};
function textoBusca(q) {
  return (q.busca ?? String(q.enunciado || '').replace(/!\[[^\]]*\]\([^)]*\)|[$*_#>|\\]/g, ' ').replace(/\s+/g, ' ').slice(0, 400));
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'aviso-toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

// Markdown + LaTeX: guarda as fórmulas antes do Markdown para não perder _ e * dentro delas.
function md(texto, figuras) {
  const guardadas = [];
  const t = String(texto || '').replace(/\\\$/g, '\u0001')
    .replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => { guardadas.push(m); return `\u0002${guardadas.length - 1}\u0002`; })
    .replace(/\(figura:([A-Za-z0-9_]+)\)/g, (m, n) => `(${figuras[n] || ''})`);
  const html = window.marked ? marked.parse(t) : `<p>${esc(t)}</p>`;
  return html.replace(/\u0002(\d+)\u0002/g, (m, i) => esc(guardadas[+i])).replace(/\u0001/g, '\\$');
}
function tipografar(el) {
  if (window.MathJax?.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
  else setTimeout(() => tipografar(el), 300);
}

// ---------- acesso aos dados: servidor local ou dados embutidos (demonstração) ----------
async function req(url, opcoes = {}) {
  const r = await fetch(url, opcoes);
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(dados.erro || `Erro ${r.status}`);
  return dados;
}
const json = (metodo, corpo) => ({method: metodo, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(corpo)});

const apiServidor = {
  async banco() { return (await req('/api/banco')).questoes; },
  async questao(id) { return req(`/api/questoes/${id}`); },
  async listas() { return (await req('/api/listas')).listas; },
  async lista(id) { return req(`/api/listas/${encodeURIComponent(id)}`); },
  async criarLista(d) { return req('/api/listas', json('POST', d)); },
  async atualizarLista(id, d) { return req(`/api/listas/${encodeURIComponent(id)}`, json('PUT', d)); },
  async excluirLista(id) { return req(`/api/listas/${encodeURIComponent(id)}`, {method: 'DELETE'}); },
  async enviarBanco(id) { return req(`/api/listas/${encodeURIComponent(id)}/enviar`, {method: 'POST'}); },
  arquivo(origem, caminho) { return `/api/arquivos/${encodeURIComponent(origem)}/${caminho}`; },
  async envios() { return (await req('/api/envios')).envios; },
  async enviarPdf(a) {
    return req('/api/envios', {method: 'POST', body: a,
      headers: {'Content-Type': 'application/pdf', 'X-Nome-Arquivo': encodeURIComponent(a.name)}});
  },
};

// Na demonstração tudo fica na memória da página: some ao recarregar.
function criarApiDemo() {
  const porId = Object.fromEntries(DEMO.questoes.map(q => [q.id, q]));
  const leve = q => ({...q, erros: q.erros.length, avisos: q.avisos.length, busca: textoBusca(q)});
  const listas = DEMO.listas.map(l => ({...l, questoes: [...l.questoes]}));
  const envios = [];
  const resumo = l => {
    const qs = l.questoes.map(i => porId[i]).filter(Boolean);
    return {...l, total_questoes: qs.length, erros: qs.filter(q => q.erros.length).length,
            avisos: qs.filter(q => q.avisos.length).length, enviada: false};
  };
  return {
    async banco() { return DEMO.questoes.map(leve); },
    async questao(id) { return porId[id]; },
    async listas() { return listas.map(resumo); },
    async lista(id) {
      const l = listas.find(x => x.id === id);
      if (!l) throw new Error('Lista não encontrada.');
      return {lista: l, resumo: resumo(l), questoes: l.questoes.map(i => porId[i]).filter(Boolean).map(leve)};
    },
    async criarLista(d) {
      if (d.nome !== undefined && !String(d.nome).trim()) throw new Error('Dê um nome para a lista.');
      const l = {id: 'demo-' + Date.now(), nome: 'Nova lista', descricao: '', disciplina: null, topico: null,
                 tags: [], status: 'rascunho', origem: null, questoes: [], ...d};
      listas.unshift(l); return l;
    },
    async atualizarLista(id, d) {
      if (d.nome !== undefined && !String(d.nome).trim()) throw new Error('Dê um nome para a lista.');
      const l = listas.find(x => x.id === id); Object.assign(l, d);
      if (d.questoes) l.questoes = [...new Set(d.questoes)];
      return l;
    },
    async excluirLista(id) { listas.splice(listas.findIndex(x => x.id === id), 1); },
    async enviarBanco() { throw new Error('Na demonstração o envio ao banco está desligado.'); },
    arquivo(origem, caminho) { return DEMO.arquivos[origem]?.[caminho] || ''; },
    async envios() { return envios; },
    async enviarPdf(a) {
      const job = {id: 'demo-' + Date.now(), arquivo: a.name, etapa: 0, estado: 'rodando',
                   mensagem: 'Recortando questões e figuras…', lista: null};
      envios.unshift(job);
      [[1, 'Transcrevendo questões com a IA…'], [2, 'Validando LaTeX, figuras e base de tópicos…'],
       [3, 'Demonstração: o processamento é simulado; abra a lista de exemplo.']].forEach(([etapa, mensagem], i) =>
        setTimeout(() => {
          Object.assign(job, {etapa, mensagem});
          if (etapa === 3) Object.assign(job, {estado: 'concluido', lista: listas.find(l => l.origem)?.id});
          if (tela.nome === 'enviar') desenhar();
        }, 1300 * (i + 1)));
      return job;
    },
  };
}

// ---------- filtros (banco e "Buscar questões") ----------
const FILTRO_VAZIO = {busca: '', disciplina: '', topico: '', assunto: '', instituicao: '', ano: '', dificuldade: ''};
function opcoes(questoes, campo) {
  const vals = questoes.flatMap(q => campo === 'assunto' ? (q.assuntos || []) : [q[campo]]).filter(v => v !== null && v !== undefined && v !== '');
  return [...new Set(vals)].sort((a, b) => campo === 'ano' ? b - a : String(a).localeCompare(String(b), 'pt-BR'));
}
function htmlFiltros(questoes, f, prefixo) {
  const sel = (campo, rotulo, rotuloOpcao = v => v) => `<select class="campo" data-filtro="${campo}" id="${prefixo}-${campo}" aria-label="${rotulo}">
      <option value="">${rotulo}</option>${opcoes(questoes, campo).map(v =>
        `<option value="${esc(v)}" ${String(v) === String(f[campo]) ? 'selected' : ''}>${esc(rotuloOpcao(v))}</option>`).join('')}</select>`;
  return `<div class="filtros grade-filtros">
    <input class="campo busca" data-filtro="busca" id="${prefixo}-busca" placeholder="Buscar no título ou no enunciado…" value="${esc(f.busca)}" aria-label="Buscar">
    ${sel('disciplina', 'Disciplina')}${sel('topico', 'Tópico')}${sel('assunto', 'Assunto')}
    ${sel('instituicao', 'Instituição')}${sel('ano', 'Ano')}${sel('dificuldade', 'Dificuldade', v => DIFICULDADE[v])}
  </div>`;
}
function filtrar(questoes, f) {
  const termo = f.busca.trim().toLowerCase();
  return questoes.filter(q =>
    (!termo || (q.titulo + ' ' + textoBusca(q)).toLowerCase().includes(termo)) &&
    (!f.disciplina || q.disciplina === f.disciplina) && (!f.topico || q.topico === f.topico) &&
    (!f.assunto || (q.assuntos || []).includes(f.assunto)) && (!f.instituicao || q.instituicao === f.instituicao) &&
    (!f.ano || String(q.ano) === f.ano) && (!f.dificuldade || String(q.dificuldade) === f.dificuldade));
}
function ligarFiltros(raiz, f, aoMudar) {
  raiz.querySelectorAll('[data-filtro]').forEach(el => el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'change', () => {
    f[el.dataset.filtro] = el.value; aoMudar(el.id);
  }));
}
function refocar(id) {
  const el = id && document.getElementById(id);
  if (el) { el.focus(); if (el.setSelectionRange && el.type !== 'select-one') el.setSelectionRange(el.value.length, el.value.length); }
}

async function atualizarContagens() {
  try {
    const [qs, ls] = await Promise.all([api.banco(), api.listas()]);
    document.getElementById('contagem-banco').textContent = qs.length || '';
    document.getElementById('contagem-listas').textContent = ls.length || '';

}

async function desenhar(foco) {
  const ativa = tela.nome === 'lista' ? 'listas' : tela.nome;
  document.querySelectorAll('.nav').forEach(b => b.setAttribute('aria-current', b.dataset.tela === ativa ? 'page' : 'false'));
  try {

    else if (tela.nome === 'banco') await telaBanco();
    else if (tela.nome === 'listas') await telaListas();
    else await telaGerenciar();
    refocar(foco);
  } catch (e) {
    principal.innerHTML = `<div class="painel vazio">Não foi possível carregar: ${esc(e.message)}</div>`;

    <div class="envios">${envios.map(cartaoEnvio).join('')}</div>`;
  const zona = document.getElementById('soltar'), input = document.getElementById('arquivo');
  input.addEventListener('change', () => receber(input.files));
  ['dragenter', 'dragover'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.add('ativo'); }));
  ['dragleave', 'drop'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.remove('ativo'); }));
  zona.addEventListener('drop', e => receber(e.dataTransfer.files));
  principal.querySelectorAll('[data-abrir]').forEach(b => b.addEventListener('click', () => ir('lista', {lista: b.dataset.abrir})));
  if (!DEMO && envios.some(e => e.estado === 'rodando')) setTimeout(() => tela.nome === 'enviar' && desenhar(), 2000);
}
function cartaoEnvio(e) {
  const etapas = ETAPAS.map((nome, i) => {
    let cls = i < e.etapa ? 'feita' : i === e.etapa ? 'atual' : '';
    if (e.estado === 'concluido') cls = 'feita';
    if (e.estado === 'parado' && i === e.etapa) cls = 'parada';
    if (e.estado === 'falhou' && i === e.etapa) cls = 'falhou';
    return `<div class="etapa ${cls}"><i></i>${nome}</div>`;
  }).join('');
  const acao = e.lista && e.estado === 'concluido' ? `<button class="botao" data-abrir="${esc(e.lista)}">Ver lista</button>` : '';
  return `<div class="painel envio"><div><div class="nome">${esc(e.arquivo)}</div><div class="msg">${esc(e.mensagem)}</div></div>${acao}<div class="etapas">${etapas}</div></div>`;
}
async function receber(arquivos) {
  for (const a of arquivos) {
    if (!/\.pdf$/i.test(a.name)) { toast(`${a.name} não é PDF.`); continue; }
    try { await api.enviarPdf(a); } catch (e) { toast(e.message); }
  }
  desenhar();
}

            <td>${esc(q.instituicao || '—')}</td><td class="num">${q.ano || '—'}</td><td>${DIFICULDADE[q.dificuldade]}</td>
            <td><div class="acoes"><button class="icone ver" data-ver="${esc(q.id)}" aria-label="Ver questão">${ICONE.ver}</button>
              <button class="icone por" data-por="${esc(q.id)}" ${naLista.has(q.id) ? 'disabled title="Já está na lista"' : ''} aria-label="Adicionar à lista">${ICONE.por}</button></div></td></tr>`).join('')
            || '<tr><td colspan="5" class="vazio">Nenhuma questão com esses filtros.</td></tr>'}</tbody></table>
          ${achadas.length > LIMITE_LINHAS ? `<div class="mais">Mostrando ${LIMITE_LINHAS} de ${achadas.length}. Refine os filtros.</div>` : ''}</div></section>
    </div>`;

  const salvar = async d => { try { await api.atualizarLista(lista.id, d); } catch (e) { toast(e.message); } };
  principal.querySelector('[data-voltar]').addEventListener('click', () => { confirmandoExclusao = false; ir('listas'); });
  document.getElementById('form-lista').addEventListener('submit', async e => {
    e.preventDefault();
    await salvar({nome: document.getElementById('lista-nome').value.trim(), descricao: document.getElementById('lista-descricao').value.trim()});
    toast('Lista salva.'); telaGerenciar();
  });
  principal.querySelectorAll('[data-mover]').forEach(b => b.addEventListener('click', async () => {
    const i = +b.dataset.mover, j = i + +b.dataset.dir, ordem = [...lista.questoes];
    [ordem[i], ordem[j]] = [ordem[j], ordem[i]];
    await salvar({questoes: ordem}); telaGerenciar();
  }));
  principal.querySelectorAll('[data-tirar]').forEach(b => b.addEventListener('click', async () => {
    await salvar({questoes: lista.questoes.filter(i => i !== b.dataset.tirar)}); telaGerenciar();
  }));
  principal.querySelectorAll('[data-por]').forEach(b => b.addEventListener('click', async () => {
    await salvar({questoes: [...lista.questoes, b.dataset.por]}); telaGerenciar();
  }));
  principal.querySelectorAll('[data-ver]').forEach(b => b.addEventListener('click', () => abrirModal(b.dataset.ver)));
  ligarFiltros(principal, filtroBusca, id => telaGerenciar().then(() => refocar(id)));
  document.getElementById('excluir')?.addEventListener('click', () => { confirmandoExclusao = true; telaGerenciar(); });
  document.getElementById('nao-excluir')?.addEventListener('click', () => { confirmandoExclusao = false; telaGerenciar(); });
  document.getElementById('sim-excluir')?.addEventListener('click', async () => {
    confirmandoExclusao = false; await api.excluirLista(lista.id); toast('Lista excluída.'); ir('listas');
  });
  document.getElementById('enviar-banco').addEventListener('click', async ev => {
    const b = ev.currentTarget; b.disabled = true; b.textContent = 'Enviando…';
    try { await api.enviarBanco(lista.id); toast('Lista enviada ao banco.'); telaGerenciar(); }
    catch (e) { b.textContent = 'Enviar ao banco'; b.disabled = false; toast(e.message); }
  });
}

async function abrirModal(id) {
  const q = await api.questao(id);
  const camada = document.getElementById('camada');
  camada.innerHTML = `<div class="modal-fundo" id="modal-fundo"><section class="painel detalhe modal" role="dialog" aria-modal="true" aria-label="Detalhes da questão">
    <button class="botao fechar" id="fechar">Fechar</button>${detalheQuestao(q)}</section></div>`;
  const fechar = () => { camada.innerHTML = ''; document.removeEventListener('keydown', esc_); };
  const esc_ = e => e.key === 'Escape' && fechar();
  document.addEventListener('keydown', esc_);
  document.getElementById('fechar').addEventListener('click', fechar);
  document.getElementById('fechar').focus();
  document.getElementById('modal-fundo').addEventListener('click', e => e.target.id === 'modal-fundo' && fechar());
  tipografar(camada);
}

function detalheQuestao(q) {
  const figs = Object.fromEntries((q.figuras || []).map(f => [f.nome, f.url || api.arquivo(q.origem, f.arquivo)]));
  const alts = Object.entries(q.alternativas).map(([letra, texto]) => `
    <div class="alt"><span class="letra">${letra}</span><div class="conteudo">${md(texto, figs)}</div>
      <span class="chave ${letra === q.gabarito ? 'on' : ''}" role="img" aria-label="${letra === q.gabarito ? 'Correta' : 'Incorreta'}"></span></div>`).join('');
  const erros = q.erros || [], avisos = q.avisos || [];
  return `
    <h2>Detalhes da questão</h2>
    ${erros.length ? `<ul class="avisos erro sem-tex">${erros.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    ${avisos.length ? `<ul class="avisos alerta sem-tex">${avisos.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    <div><div class="rotulo">Título da pergunta (uso interno)</div><div class="valor">${esc(q.titulo)}</div></div>
    <div class="grade">
      <div><div class="rotulo">Instituição</div><div class="valor">${esc(q.instituicao || '—')}</div></div>
      <div><div class="rotulo">Disciplina</div><div class="valor">${esc(q.disciplina)}</div></div>
      <div><div class="rotulo">Tópico</div><div class="valor">${esc(q.topico)}</div></div>
    </div>
    <div><div class="rotulo">Enunciado</div><div class="enunciado">${md(q.enunciado, figs)}</div></div>
    <div><div class="rotulo">Assuntos</div><div class="valor">${(q.assuntos || []).map(a => `<span class="tag">${esc(a)}</span>`).join('') || '—'}</div></div>
    <div class="grade duas">
      <div><div class="rotulo">Dificuldade da questão</div><div class="valor">${DIFICULDADE[q.dificuldade]}${q.etapa ? ` <span class="sem-tex" style="color:var(--fraco)">· etapa ${esc(q.etapa)}</span>` : ''}</div></div>
      <div><div class="rotulo">Ano</div><div class="valor num">${q.ano || '—'}</div></div>
    </div>
    <div><div class="rotulo">Alternativas</div><div class="alternativas">
      <div class="alt cab-alt"><span>#</span><span>Conteúdo da alternativa</span><span style="justify-self:center">Correta?</span></div>${alts}</div></div>
    <details class="original"><summary>Ver original no PDF (${esc(q.lista_origem || '')}, página ${q.pagina})</summary><img src="${api.arquivo(q.origem, q.imagem)}" alt="Recorte original da questão ${q.numero}" loading="lazy"></details>`;
}

document.getElementById('modo').textContent = DEMO
  ? 'Demonstração: as listas que você criar aqui ficam só nesta página e somem ao recarregar.'
  : 'App local · dados em saida/ (banco) e saida/_listas.json (listas)';
if (DEMO) tela.nome = 'banco';
desenhar();
</script>
